  if (googleMapsLoadPromise) return googleMapsLoadPromise;
  googleMapsLoadPromise = new Promise((resolve, reject) => {

    script.onload = () => resolve(window.google);

    document.head.appendChild(script);
  });
  return googleMapsLoadPromise;
}

// Full Cape Cod / South Shore towns, for direct matches and the "already
// a town name" case.
const KNOWN_TOWNS = [
  'Barnstable', 'Bourne', 'Brewster', 'Chatham', 'Dennis', 'Eastham', 'Falmouth',
  'Harwich', 'Mashpee', 'Orleans', 'Provincetown', 'Sandwich', 'Truro', 'Wellfleet', 'Yarmouth',
  'Braintree', 'Duxbury', 'Hingham', 'Kingston', 'Milton', 'Pembroke', 'Quincy', 'Scituate',
  'Cohasset', 'Hanover', 'Hull', 'Marshfield', 'Norwell', 'Plymouth', 'Rockland', 'Weymouth'
];

function escapeRegex_(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// Escapes text before it's inserted into raw HTML strings (e.g. the map's
// InfoWindow content, which Google Maps renders as actual HTML, not React).
function escapeHtml_(str) {
  const div = document.createElement('div');
  div.textContent = String(str == null ? '' : str);
  return div.innerHTML;
}

function getTown(address) {
  if (!address) return 'Unknown';
  const lower = address.toLowerCase();

  const allNames = [
    ...Object.keys(VILLAGE_TO_TOWN).map(v => ({ name: v, town: VILLAGE_TO_TOWN[v] })),
    ...KNOWN_TOWNS.map(t => ({ name: t.toLowerCase(), town: t }))
  ];

  // Pass 1: prefer a name that sits directly next to "MA" (e.g. "Mashpee,
  // MA" or "Mashpee MA") — that's how the actual city component is written
  // in a real address, so it won't be fooled by a town name that happens to
  // appear inside the street name (e.g. "Falmouth Road" in a Mashpee
  // address). If more than one name matches this way, prefer the rightmost
  // occurrence, since street name usually comes first.
  let best = null;
  for (const { name, town } of allNames) {
    const re = new RegExp(`\\b${escapeRegex_(name)}\\b\\s*,?\\s*ma\\b`, 'gi');
    let m;
    while ((m = re.exec(lower)) !== null) {
      if (!best || m.index > best.index) best = { town, index: m.index };
    }
  }
  if (best) return best.town;

  // Pass 2: no "MA" found near a known name — fall back to the LAST
  // occurring known name anywhere in the address, since the town typically
  // comes after the street name, not before it.
  for (const { name, town } of allNames) {
    const re = new RegExp(`\\b${escapeRegex_(name)}\\b`, 'gi');
    let m;
    while ((m = re.exec(lower)) !== null) {
      if (!best || m.index > best.index) best = { town, index: m.index };
    }
  }
  if (best) return best.town;

  // Pass 3: parse "..., City, MA ..." pattern directly, for towns not in
  // our known list at all.
  const match = address.match(/,\s*([A-Za-z][A-Za-z\s]*?)\s*,?\s*MA\b/i);
  if (match) {
    return match[1].trim().replace(/\b\w/g, c => c.toUpperCase());
  }

  return 'Unknown';
}

// ---------------------------------------------------------------------
// Follow-up date helpers
// ---------------------------------------------------------------------
function todayDateString() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

// Returns 'overdue' | 'today' | 'upcoming' | null (no date set, or unparseable)
function followUpStatus(nextFollowUp) {
  if (!nextFollowUp) return null;
  const clean = String(nextFollowUp).slice(0, 10); // tolerate a stray timestamp suffix
  if (!/^\d{4}-\d{2}-\d{2}$/.test(clean)) return null;
  const today = todayDateString();
  if (clean < today) return 'overdue';
  if (clean === today) return 'today';
  return 'upcoming';
}

function formatFollowUpDate(nextFollowUp) {
  if (!nextFollowUp) return '';
  const clean = String(nextFollowUp).slice(0, 10);
  const [y, m, d] = clean.split('-').map(Number);
  if (!y || !m || !d) return '';
  const date = new Date(y, m - 1, d);
  if (isNaN(date.getTime())) return '';
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function FollowUpBadge({ nextFollowUp }) {
  const status = followUpStatus(nextFollowUp);
  if (!status) return null;
  const styles = {
    overdue: 'bg-red-50 text-red-500',
    today: 'bg-amber-50 text-amber-600',
    upcoming: 'bg-skyblue-100 text-navy-700'
  };
  const labels = {

// ---------------------------------------------------------------------
// Scan note text for a mentioned calendar date (e.g. "9/15", "Sept 15",
// "September 15, 2026") and surface the soonest one that's today or later.
// ---------------------------------------------------------------------
const MONTH_NAMES = {
  jan: 0, january: 0, feb: 1, february: 1, mar: 2, march: 2, apr: 3, april: 3,
  may: 4, jun: 5, june: 5, jul: 6, july: 6, aug: 7, august: 7,
  sep: 8, sept: 8, september: 8, oct: 9, october: 9, nov: 10, november: 10, dec: 11, december: 11
};

function stripTime(d) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function parseDatesFromText(text) {
  const dates = [];
  if (!text) return dates;
  const today = stripTime(new Date());
  const currentYear = today.getFullYear();

  // M/D, M/D/YY, M/D/YYYY
  const slashRegex = /\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/g;
  let m;
  while ((m = slashRegex.exec(text)) !== null) {
    const month = parseInt(m[1], 10) - 1;
    const day = parseInt(m[2], 10);
    if (month < 0 || month > 11 || day < 1 || day > 31) continue;
    let year = m[3] ? parseInt(m[3], 10) : currentYear;
    if (year < 100) year += 2000;
    let date = new Date(year, month, day);
    if (!m[3] && date < today) date = new Date(year + 1, month, day);
    dates.push(date);
  }

  // Month name + day, optional year — "Sept 15", "September 15, 2026", "Sep 15th"
  const monthRegex = /\b(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sept?(?:ember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:,?\s+(\d{4}))?\b/gi;
  while ((m = monthRegex.exec(text)) !== null) {
    const month = MONTH_NAMES[m[1].toLowerCase()];
    if (month === undefined) continue;
    const day = parseInt(m[2], 10);
    if (day < 1 || day > 31) continue;
    let year = m[3] ? parseInt(m[3], 10) : currentYear;
    let date = new Date(year, month, day);
    if (!m[3] && date < today) date = new Date(year + 1, month, day);
    dates.push(date);
  }

  return dates;
}

// Given an account's notes, returns the soonest upcoming (today or later)
// activity as { date, note }, or null if none found.
function getUpcomingActivity(accountNotes) {
  const today = stripTime(new Date());
  let best = null;
  accountNotes.forEach(n => {
    parseDatesFromText(n.NoteText).forEach(d => {
      if (d >= today && (!best || d < best.date)) {
        best = { date: d, note: n };
      }
    });
  });
  return best;
}

function formatShortDate(date) {
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function UpcomingActivityBadge({ upcoming }) {
  if (!upcoming) return null;
  return (
    <span className="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-teal-50 text-teal-600">
      Upcoming Meeting — {formatShortDate(upcoming.date)}
    </span>
  );
}

// ---------------------------------------------------------------------
// API helpers
// ---------------------------------------------------------------------
function getSessionToken() {
  return sessionStorage.getItem('bdd_crm_session_token') || '';
}

// If the backend ever says a request is unauthorized (session expired,
// revoked, etc.), clear local session state and reload back to the sign-in
// gate rather than leaving the app in a broken half-logged-in state.
function handleUnauthorized() {
  sessionStorage.removeItem('bdd_crm_unlocked');
  sessionStorage.removeItem('bdd_crm_session_token');
  sessionStorage.removeItem('bdd_crm_user_email');
  window.location.reload();
}

async function apiGet() {
  const res = await fetch(`${API_URL}?action=all&token=${encodeURIComponent(getSessionToken())}`);
  const result = await res.json();
  if (result.error === 'Unauthorized — please sign in again') {
    handleUnauthorized();
    return { accounts: [], contacts: [], connections: [], notes: [] };
  }
  return result;
}
async function apiPost(action, payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ action, token: getSessionToken(), ...payload })
  });
  const result = await res.json();
  if (result.error === 'Unauthorized — please sign in again') {
    handleUnauthorized();
  }
  return result;
}

// ---------------------------------------------------------------------
// Login gate — Google Sign-In only
// ---------------------------------------------------------------------
function Gate({ onUnlock }) {
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const [googleFailedToLoad, setGoogleFailedToLoad] = useState(false);
  const googleButtonRef = useRef(null);

  const unlock = () => {
    sessionStorage.setItem('bdd_crm_unlocked', 'true');
    onUnlock();
  };

  const handleCredentialResponse = useCallback(async (response) => {
    setBusy(true);
    setError('');
    try {
      const result = await apiPost('verifyGoogleLogin', { idToken: response.credential });
      if (result.success) {
        sessionStorage.setItem('bdd_crm_user_email', result.result.email);
        sessionStorage.setItem('bdd_crm_session_token', result.result.sessionToken);
        unlock();
      } else {
        setError(result.error || "That Google account isn't authorized for this app.");
      }
    } catch (err) {
      setError('Something went wrong signing in — try again.');
    }
    setBusy(false);
  }, []);

  useEffect(() => {
    loadGoogleIdentity().then((google) => {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse
      });
      if (googleButtonRef.current) {
        google.accounts.id.renderButton(googleButtonRef.current, {
          theme: 'outline', size: 'large', width: 280
        });
      }
    }).catch(() => {
      setGoogleFailedToLoad(true);
    });
  }, [handleCredentialResponse]);

  return (
    <div className="min-h-screen flex items-center justify-center bg-navy-900 px-4">
      <div className="bg-white rounded-2xl shadow-2xl p-10 max-w-sm w-full text-center">
        <div className="w-16 h-16 mx-auto mb-4 rounded-full bg-navy-900 flex items-center justify-center p-2.5">
          <img src={LOGO_DATA_URI} alt="Bayside Dysphagia Diagnostics" className="w-full h-full object-contain" />
        </div>
        <h1 className="font-display text-2xl text-navy-900 mb-1">Bayside Dysphagia Diagnostics</h1>
        <p className="text-sm text-navy-700/60 mb-6">Client &amp; Referral tracker</p>

        {googleFailedToLoad ? (
          <p className="text-navy-700/50 text-sm">
            Sign-in is currently unavailable. Please check back shortly.
          </p>
        ) : (
          <div className="flex justify-center mb-2">
            <div ref={googleButtonRef}></div>
          </div>
        )}

        {busy && <p className="text-navy-700/40 text-sm mt-3">Signing in…</p>}
        {error && <p className="text-red-500 text-sm mt-3">{error}</p>}
      </div>
    </div>
  );
}

    loadGoogleMaps(GOOGLE_MAPS_API_KEY).then((google) => {

// ---------------------------------------------------------------------
function AccountDetail({ account, contacts, connections, notes, onBack, onRefresh, roleOptions, relationshipOptions, referralSourceOptions }) {
  const [editingAccount, setEditingAccount] = useState(false);
  const [addingContact, setAddingContact] = useState(false);
  const [editingContactId, setEditingContactId] = useState(null);
  const [addingConnection, setAddingConnection] = useState(false);
  const [editingConnectionId, setEditingConnectionId] = useState(null);
  const [noteText, setNoteText] = useState('');
  const [editingNoteId, setEditingNoteId] = useState(null);
  const [editingNoteText, setEditingNoteText] = useState('');
  const [busy, setBusy] = useState(false);
  const [followUpDate, setFollowUpDate] = useState((account.NextFollowUp || '').slice(0, 10));
  const [emailThreads, setEmailThreads] = useState(null); // null = not loaded yet
  const [emailsLoading, setEmailsLoading] = useState(false);
  const [emailsError, setEmailsError] = useState('');

  // Keep the local date field in sync if the account data refreshes from elsewhere.
  useEffect(() => {
    setFollowUpDate((account.NextFollowUp || '').slice(0, 10));
  }, [account.NextFollowUp]);

  const accountContacts = contacts.filter(c => c.AccountId === account.AccountId);
  const accountConnections = connections.filter(c => c.AccountId === account.AccountId);
  const accountNotes = notes
    .filter(n => n.AccountId === account.AccountId)
    .sort((a, b) => new Date(b.Timestamp) - new Date(a.Timestamp));
  const upcomingActivity = getUpcomingActivity(accountNotes);

  const saveAccount = async (form) => {
    setBusy(true);
    await apiPost('updateAccount', { data: { ...form, AccountId: account.AccountId } });
    setEditingAccount(false);
    setBusy(false);
    onRefresh();
  };

  const saveFollowUp = async (dateStr) => {
    setFollowUpDate(dateStr);
    setBusy(true);
    await apiPost('updateAccount', { data: { AccountId: account.AccountId, NextFollowUp: dateStr } });
    setBusy(false);
    onRefresh();
  };

  const convert = async () => {
    setBusy(true);
    await apiPost('convertAccount', { accountId: account.AccountId });
    setBusy(false);
    onRefresh();
  };

  const removeAccount = async () => {
    if (!confirm(`Delete "${account.AccountName}"? This also removes its contacts and notes from view (rows stay in the Sheet's Contacts/Notes tabs but won't be linked to anything). This can't be undone from the app.`)) return;
    setBusy(true);
    await apiPost('deleteAccount', { accountId: account.AccountId });
    setBusy(false);
    onRefresh();
    onBack();
  };

  const saveContact = async (form) => {
    setBusy(true);
    if (form.ContactId) {
      await apiPost('updateContact', { data: form });
    } else {
      await apiPost('createContact', { data: { ...form, AccountId: account.AccountId } });
    }
    setAddingContact(false);
    setEditingContactId(null);
    setBusy(false);
    onRefresh();
  };

  const removeContact = async (contactId) => {
    if (!confirm('Remove this contact?')) return;
    setBusy(true);
    await apiPost('deleteContact', { contactId });
    setBusy(false);
    onRefresh();
  };

  const saveConnection = async (form) => {
    setBusy(true);
    if (form.ConnectionId) {
      await apiPost('updateConnection', { data: form });
    } else {
      await apiPost('createConnection', { data: { ...form, AccountId: account.AccountId } });
    }
    setAddingConnection(false);
    setEditingConnectionId(null);
    setBusy(false);
    onRefresh();
  };

  const removeConnection = async (connectionId) => {
    if (!confirm('Remove this connection?')) return;
    setBusy(true);
    await apiPost('deleteConnection', { connectionId });
    setBusy(false);
    onRefresh();
  };

  const knownEmails = [...accountContacts, ...accountConnections]
    .map(c => c.Email)
    .filter(Boolean);

  const loadEmails = async () => {
    setEmailsLoading(true);
    setEmailsError('');
    const response = await apiPost('getAccountEmails', { emails: knownEmails });
    if (response.success) {
      setEmailThreads(response.result);
    } else {
      setEmailsError(response.error || 'Could not load emails');
    }
    setEmailsLoading(false);
  };

  const addNote = async () => {
    if (!noteText.trim()) return;
    setBusy(true);
    await apiPost('addNote', { accountId: account.AccountId, noteText: noteText.trim() });
    setNoteText('');
    setBusy(false);
    onRefresh();
  };

  const saveNoteEdit = async (noteId, text) => {
    if (!text.trim()) return;
    setBusy(true);
    await apiPost('updateNote', { data: { NoteId: noteId, NoteText: text.trim() } });
    setEditingNoteId(null);
    setBusy(false);
    onRefresh();
  };

  const removeNote = async (noteId) => {
    if (!confirm('Delete this note? This can\'t be undone.')) return;
    setBusy(true);
    await apiPost('deleteNote', { noteId });
    setBusy(false);
    onRefresh();
  };

  return (
    <div className="max-w-4xl mx-auto px-4 sm:px-6 py-8">
      <button onClick={onBack} className="text-teal-600 hover:text-teal-700 text-sm mb-4 flex items-center gap-1">
        ← Back to accounts
      </button>

      {editingAccount ? (
        <AccountForm initial={account} onSave={saveAccount} onCancel={() => setEditingAccount(false)} referralSourceOptions={referralSourceOptions} />
      ) : (
        <div className="bg-white rounded-xl border border-skyblue-100 p-6 mb-6">

                <FollowUpBadge nextFollowUp={account.NextFollowUp} />

                {account.Phone && <p>{account.Phone}</p>}

          <div className="flex divide-x divide-skyblue-100 border-t border-skyblue-100 text-sm">
            <a
              href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(account.Address)}`}
              target="_blank" rel="noopener noreferrer"
              className="flex-1 text-center py-2.5 text-teal-600 hover:bg-skyblue-100/30 transition font-medium"
            >
              Open in Google Maps
            </a>
            <a
              href={`https://maps.apple.com/?q=${encodeURIComponent(account.Address)}`}
              target="_blank" rel="noopener noreferrer"
              className="flex-1 text-center py-2.5 text-teal-600 hover:bg-skyblue-100/30 transition font-medium"
            >
              Open in Apple Maps
            </a>
          </div>
        </div>
      )}

      <div className="bg-white rounded-xl border border-skyblue-100 p-6 mb-6">
        <div className="flex items-center justify-between mb-4">
          <h2 className="font-display text-lg text-navy-900">Contacts</h2>
          {!addingContact && (
            <button onClick={() => setAddingContact(true)} className="text-teal-600 hover:text-teal-700 text-sm font-medium">+ Add contact</button>
          )}
        </div>
        {addingContact && <ContactForm onSave={saveContact} onCancel={() => setAddingContact(false)} roleOptions={roleOptions} />}
        {accountContacts.length === 0 && !addingContact && (
          <p className="text-navy-700/40 text-sm">No contacts yet.</p>
        )}
        {accountContacts.map(c => (
          editingContactId === c.ContactId ? (
            <ContactForm key={c.ContactId} initial={c} onSave={saveContact} onCancel={() => setEditingContactId(null)} roleOptions={roleOptions} />
          ) : (
            <div key={c.ContactId} className="flex items-center justify-between py-3 border-b border-skyblue-100 last:border-0">
              <div>
                <p className="font-medium text-navy-900">{c.ContactName} <span className="text-navy-700/50 font-normal">— {c.Role}</span></p>

              </div>
              <div className="flex gap-3 text-sm">
                <button onClick={() => setEditingContactId(c.ContactId)} className="text-teal-600 hover:text-teal-700">Edit</button>
                <button onClick={() => removeContact(c.ContactId)} className="text-navy-700/40 hover:text-red-500">Remove</button>

            </div>

      {/* Connections */}
      <div className="bg-white rounded-xl border border-skyblue-100 p-6 mb-6">
        <div className="flex items-center justify-between mb-1">
          <h2 className="font-display text-lg text-navy-900">Connections</h2>

            <button onClick={() => setAddingConnection(true)} className="text-teal-600 hover:text-teal-700 text-sm font-medium">+ Add connection</button>
          )}
        </div>
        <p className="text-xs text-navy-700/40 mb-4">People tied to this account who don't work there — e.g. a covering physician or referral partner.</p>
        {addingConnection && <ConnectionForm onSave={saveConnection} onCancel={() => setAddingConnection(false)} roleOptions={roleOptions} relationshipOptions={relationshipOptions} />}
        {accountConnections.length === 0 && !addingConnection && (
          <p className="text-navy-700/40 text-sm">No connections yet.</p>
        )}
        {accountConnections.map(c => (
          editingConnectionId === c.ConnectionId ? (
            <ConnectionForm key={c.ConnectionId} initial={c} onSave={saveConnection} onCancel={() => setEditingConnectionId(null)} roleOptions={roleOptions} relationshipOptions={relationshipOptions} />
          ) : (
            <div key={c.ConnectionId} className="flex items-center justify-between py-3 border-b border-skyblue-100 last:border-0">
              <div>
                <p className="font-medium text-navy-900">{c.ContactName} <span className="text-navy-700/50 font-normal">— {c.Role}</span></p>
                <p className="text-sm text-navy-700/60">{[c.Phone, c.Email].filter(Boolean).join(' · ')}</p>
                {c.Relationship && <p className="text-sm text-teal-600/80 mt-0.5">{c.Relationship}</p>}
              </div>
              <div className="flex gap-3 text-sm">
                <button onClick={() => setEditingConnectionId(c.ConnectionId)} className="text-teal-600 hover:text-teal-700">Edit</button>
                <button onClick={() => removeConnection(c.ConnectionId)} className="text-navy-700/40 hover:text-red-500">Remove</button>
              </div>
            </div>
          )
        ))}
      </div>

      {/* Emails */}
      <div className="bg-white rounded-xl border border-skyblue-100 p-6 mb-6">
        <div className="flex items-center justify-between mb-1">
          <h2 className="font-display text-lg text-navy-900">Emails</h2>

              {emailsLoading ? 'Refreshing…' : 'Refresh'}
            </button>
          )}
        </div>
        <p className="text-xs text-navy-700/40 mb-4">Gmail threads to or from any contact/connection email on file for this account.</p>

        {knownEmails.length === 0 && (
          <p className="text-navy-700/40 text-sm">No contact emails on file to search for yet — add one under Contacts or Connections.</p>
        )}

        {knownEmails.length > 0 && emailThreads === null && (
          <button onClick={loadEmails} disabled={emailsLoading} className="bg-navy-900 hover:bg-navy-700 text-white rounded-lg px-4 py-2 text-sm font-medium transition disabled:opacity-60">
            {emailsLoading ? 'Loading…' : 'Load emails'}
          </button>
        )}

        {emailsError && <p className="text-red-500 text-sm mt-2">{emailsError}</p>}

        {emailThreads !== null && emailThreads.length === 0 && !emailsError && (
          <p className="text-navy-700/40 text-sm">No Gmail threads found for these email addresses.</p>
        )}

        {emailThreads !== null && emailThreads.length > 0 && (
          <div className="divide-y divide-skyblue-100">
            {emailThreads.map(t => (
              <a
                key={t.threadId}
                href={t.url}
                target="_blank"
                rel="noopener noreferrer"
                className="block py-3 hover:bg-skyblue-100/30 transition -mx-2 px-2 rounded-lg"
              >
                <div className="flex items-start justify-between gap-3">
                  <p className="font-medium text-navy-900 text-sm">{t.subject}</p>
                  <p className="text-xs text-navy-700/40 shrink-0">{new Date(t.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</p>
                </div>
                <p className="text-xs text-navy-700/50 mt-0.5">{t.from}{t.messageCount > 1 ? ` · ${t.messageCount} messages` : ''}</p>
                {t.snippet && <p className="text-sm text-navy-700/60 mt-1">{t.snippet}…</p>}
              </a>
            ))}
          </div>
        )}
      </div>

      {/* Notes / activity */}
      <div className="bg-white rounded-xl border border-skyblue-100 p-6">
        <div className="flex items-center justify-between flex-wrap gap-3 mb-4">
          <h2 className="font-display text-lg text-navy-900">Notes &amp; activity</h2>
          <div className="flex items-center gap-2">
            <label className="text-sm text-navy-700/60 flex items-center gap-2">
              Next follow-up
              <input
                type="date"
                value={followUpDate}
                onChange={(e) => saveFollowUp(e.target.value)}
                className="border border-skyblue-300 rounded-lg px-3 py-1.5 text-sm"
              />
            </label>
            {followUpDate && (
              <button onClick={() => saveFollowUp('')} className="text-xs text-navy-700/40 hover:text-red-500">Clear</button>
            )}
          </div>
        </div>
        <div className="flex gap-2 mb-5">
          <input
            value={noteText}
            onChange={(e) => setNoteText(e.target.value)}
            onKeyDown={(e) => e.key === 'Enter' && !e.nativeEvent.isComposing && addNote()}
            placeholder="Log a call, visit, or update..."
            className="flex-1 border border-skyblue-300 rounded-lg px-3 py-2 text-sm"
          />
          <button onClick={addNote} disabled={busy} className="bg-navy-900 hover:bg-navy-700 text-white rounded-lg px-4 py-2 text-sm font-medium transition">
            Log note
          </button>
        </div>
        <div className="space-y-4">
          {accountNotes.length === 0 && <p className="text-navy-700/40 text-sm">No notes yet.</p>}
          {accountNotes.map(n => (
            <div key={n.NoteId} className="flex gap-3 text-sm">
              <div className="w-1.5 h-1.5 rounded-full bg-teal-500 mt-2 shrink-0"></div>
              <div className="flex-1">
                <p className="text-navy-700/40 text-xs">{new Date(n.Timestamp).toLocaleString()}</p>
                {editingNoteId === n.NoteId ? (
                  <div className="mt-1">
                    <input
                      value={editingNoteText}
                      onChange={(e) => setEditingNoteText(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && !e.nativeEvent.isComposing && saveNoteEdit(n.NoteId, editingNoteText)}
                      className="w-full border border-skyblue-300 rounded-lg px-3 py-1.5 text-sm"
                      autoFocus
                    />
                    <div className="flex gap-3 mt-1.5">
                      <button onClick={() => saveNoteEdit(n.NoteId, editingNoteText)} className="text-teal-600 hover:text-teal-700 text-xs font-medium">Save</button>
                      <button onClick={() => setEditingNoteId(null)} className="text-navy-700/60 hover:text-navy-900 text-xs">Cancel</button>
                    </div>
                  </div>
                ) : (
                  <div className="flex items-start justify-between gap-3">
                    <p className="text-navy-900">{n.NoteText}</p>
                    <div className="flex gap-2 text-xs shrink-0">
                      <button onClick={() => { setEditingNoteId(n.NoteId); setEditingNoteText(n.NoteText); }} className="text-teal-600 hover:text-teal-700">Edit</button>
                      <button onClick={() => removeNote(n.NoteId)} className="text-navy-700/40 hover:text-red-500">Delete</button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// Map view — plots accounts as pins using their address, geocoded on the
// fly via Google's client-side Geocoder and cached back to the Sheet
// (Latitude/Longitude) so repeat visits don't re-geocode every address.
// ---------------------------------------------------------------------
function MapView({ accounts, onSelect }) {
  const mapRef = useRef(null);
  const markersRef = useRef([]);
  const [status, setStatus] = useState('loading'); // 'loading' | 'ready' | 'no-key'

  useEffect(() => {
    let cancelled = false;

    loadGoogleMaps(GOOGLE_MAPS_API_KEY).then(async (google) => {
      if (cancelled || !mapRef.current) return;

      const map = new google.maps.Map(mapRef.current, {
        center: { lat: 41.7, lng: -70.3 }, // roughly Cape Cod
        zoom: 10,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: false
      });

      // Let info-window "View account" buttons (raw HTML, outside React)
      // call back into the app.
      window.__crmSelectAccount = (accountId) => {
        const account = accounts.find(a => a.AccountId === accountId);
        if (account) onSelect(account);
      };

      const geocoder = new google.maps.Geocoder();
      const bounds = new google.maps.LatLngBounds();
      const accountsWithAddress = accounts.filter(a => a.Address);

      for (const a of accountsWithAddress) {
        if (cancelled) return;
        let lat = parseFloat(a.Latitude);
        let lng = parseFloat(a.Longitude);

        if (!lat || !lng) {
          try {
            const result = await new Promise((resolve, reject) => {
              geocoder.geocode({ address: a.Address }, (results, geoStatus) => {
                if (geoStatus === 'OK' && results && results[0]) resolve(results[0]);
                else reject(geoStatus);
              });
            });
            lat = result.geometry.location.lat();
            lng = result.geometry.location.lng();
            // Cache so this address never needs re-geocoding.
            apiPost('updateAccount', { data: { AccountId: a.AccountId, Latitude: lat, Longitude: lng } });
          } catch (err) {
            continue; // couldn't geocode this address — skip its pin
          }
        }

        if (cancelled) return;
        const position = { lat, lng };
        const marker = new google.maps.Marker({
          position,
          map,
          title: a.AccountName,
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 8,
            fillColor: a.Status === 'Customer' ? '#0f766e' : '#a9c6dc',
            fillOpacity: 1,
            strokeColor: '#081e3d',
            strokeWeight: 1.5
          }
        });
        const infoWindow = new google.maps.InfoWindow({
          content: `<div style="font-family:'Source Sans 3',sans-serif;padding:2px;min-width:160px;">
            <strong style="color:#081e3d;">${escapeHtml_(a.AccountName)}</strong><br/>
            <span style="font-size:12px;color:${a.Status === 'Customer' ? '#0f766e' : '#334'};">${escapeHtml_(a.Status)}</span><br/>
            <button onclick="window.__crmSelectAccount('${escapeHtml_(a.AccountId)}')" style="margin-top:6px;background:#0f766e;color:white;border:none;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;">View account</button>
          </div>`
        });
        marker.addListener('click', () => infoWindow.open(map, marker));
        markersRef.current.push(marker);
        bounds.extend(position);
      }

      if (!bounds.isEmpty()) map.fitBounds(bounds);
      if (!cancelled) setStatus('ready');
    }).catch(() => setStatus('no-key'));

    return () => {
      cancelled = true;
      markersRef.current.forEach(m => m.setMap(null));
      markersRef.current = [];
    };
  }, [accounts]);

  if (status === 'no-key') {
    return (
      <div className="bg-white rounded-xl border border-skyblue-100 p-10 text-center text-navy-700/50 text-sm">
        Map view needs a Google Maps API key configured in GOOGLE_MAPS_API_KEY — see the README.
      </div>
    );
  }

  return (
    <div className="bg-white rounded-xl border border-skyblue-100 overflow-hidden">
      {status === 'loading' && (
        <p className="text-center text-navy-700/40 text-sm py-3">Plotting accounts…</p>
      )}
      <div ref={mapRef} className="w-full h-[500px]"></div>
    </div>
  );
}

function AccountList({ accounts, contacts, connections, notes, onSelect, onCreate, onSignOut }) {
  const [filter, setFilter] = useState('All');
  const [viewMode, setViewMode] = useState('list'); // 'list' | 'map'
  const [query, setQuery] = useState('');

  const matchesQuery = (a) => {
    if (!query.trim()) return true;
    const q = query.toLowerCase();
    if (a.AccountName.toLowerCase().includes(q)) return true;
    if ((a.Address || '').toLowerCase().includes(q)) return true;
    if ((a.ReferralSource || '').toLowerCase().includes(q)) return true;
    const relatedContacts = contacts.filter(c => c.AccountId === a.AccountId);
    if (relatedContacts.some(c => `${c.ContactName} ${c.Role}`.toLowerCase().includes(q))) return true;
    const relatedConnections = connections.filter(c => c.AccountId === a.AccountId);
    if (relatedConnections.some(c => `${c.ContactName} ${c.Role} ${c.Relationship}`.toLowerCase().includes(q))) return true;
    const relatedNotes = notes.filter(n => n.AccountId === a.AccountId);
    if (relatedNotes.some(n => (n.NoteText || '').toLowerCase().includes(q))) return true;
    return false;
  };

  // "Follow-up" filter shows any account with a follow-up date scheduled,
  // not just ones due today/overdue — the badge color still tells you which.
  const hasFollowUp = (a) => !!(a.NextFollowUp && String(a.NextFollowUp).trim());

  // Soonest upcoming (today or later) activity mentioned in each account's
  // notes, keyed by AccountId — computed once per notes/accounts change.
  const upcomingByAccount = useMemo(() => {
    const map = {};
    accounts.forEach(a => {
      const accountNotes = notes.filter(n => n.AccountId === a.AccountId);
      const upcoming = getUpcomingActivity(accountNotes);
      if (upcoming) map[a.AccountId] = upcoming;
    });
    return map;
  }, [accounts, notes]);

  const hasUpcomingMeeting = (a) => !!upcomingByAccount[a.AccountId];

  const filtered = accounts.filter(a => {
    const matchesFilter = filter === 'All' ? true
      : filter === 'Follow-up' ? hasFollowUp(a)
      : filter === 'Upcoming Meetings' ? hasUpcomingMeeting(a)
      : a.Status === filter;
    return matchesFilter && matchesQuery(a);
  });

  const counts = {
    All: accounts.length,
    Prospect: accounts.filter(a => a.Status === 'Prospect').length,
    Customer: accounts.filter(a => a.Status === 'Customer').length,
    'Follow-up': accounts.filter(hasFollowUp).length,
    'Upcoming Meetings': accounts.filter(hasUpcomingMeeting).length
  };

  // Group filtered accounts by base town (e.g. "South Yarmouth" -> "Yarmouth"),
  // sorted alphabetically with "Unknown" pushed to the end, and accounts
  // within each town sorted by name.
  const groups = useMemo(() => {
    const map = {};
    filtered.forEach(a => {
      const town = getTown(a.Address);
      if (!map[town]) map[town] = [];
      map[town].push(a);
    });
    Object.values(map).forEach(list => list.sort((a, b) => a.AccountName.localeCompare(b.AccountName)));
    return Object.keys(map)
      .sort((a, b) => {
        if (a === 'Unknown') return 1;
        if (b === 'Unknown') return -1;
        return a.localeCompare(b);
      })
      .map(town => ({ town, accounts: map[town] }));
  }, [filtered]);

  return (
    <div className="max-w-4xl mx-auto px-4 sm:px-6 py-8">
      <div className="flex items-center justify-between mb-6 flex-wrap gap-3">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-full bg-navy-900 flex items-center justify-center p-1.5 shrink-0">
            <img src={LOGO_DATA_URI} alt="Bayside Dysphagia Diagnostics" className="w-full h-full object-contain" />
          </div>
          <div>
            <h1 className="font-display text-2xl text-navy-900">Bayside Dysphagia Diagnostics</h1>
            <p className="text-sm text-navy-700/50">Client &amp; Referral tracker</p>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={onCreate} className="bg-teal-500 hover:bg-teal-600 text-white rounded-lg px-4 py-2 text-sm font-medium transition">
            + New account
          </button>
          <button onClick={onSignOut} className="text-navy-700/40 hover:text-navy-700/70 text-sm px-2 py-2 transition">
            Sign out
          </button>
        </div>
      </div>

      <div className="flex items-center gap-4 mb-5 flex-wrap">
        <div className="flex gap-1 bg-white border border-skyblue-100 rounded-lg p-1 flex-wrap">
          {['All', 'Prospect', 'Customer', 'Follow-up', 'Upcoming Meetings'].map(s => (
            <button
              key={s}
              onClick={() => setFilter(s)}
              className={`px-3 py-1.5 rounded-md text-sm font-medium transition ${
                filter === s ? 'bg-navy-900 text-white' : 'text-navy-700/60 hover:bg-skyblue-100/50'
              }`}
            >
              {s} <span className="opacity-60">({counts[s]})</span>
            </button>
          ))}
        </div>
        <input
          value={query}
          onChange={(e) => setQuery(e.target.value)}
          placeholder="Search accounts, contacts, notes..."
          className="border border-skyblue-300 rounded-lg px-3 py-1.5 text-sm flex-1 min-w-[180px]"
        />
        <div className="flex gap-1 bg-white border border-skyblue-100 rounded-lg p-1">
          {['list', 'map'].map(mode => (
            <button
              key={mode}
              onClick={() => setViewMode(mode)}
              className={`px-3 py-1.5 rounded-md text-sm font-medium capitalize transition ${
                viewMode === mode ? 'bg-navy-900 text-white' : 'text-navy-700/60 hover:bg-skyblue-100/50'
              }`}
            >
              {mode}
            </button>
          ))}
        </div>
      </div>

      {viewMode === 'map' ? (
        <MapView accounts={filtered} onSelect={onSelect} />
      ) : (
        <React.Fragment>
          {filtered.length === 0 && (
            <div className="bg-white rounded-xl border border-skyblue-100">
              <p className="text-navy-700/40 text-sm p-6 text-center">No accounts match yet — add one to get started.</p>
            </div>
          )}

          <div className="space-y-6">
            {groups.map(({ town, accounts: townAccounts }) => (
              <div key={town}>
                <h3 className="text-xs font-semibold uppercase tracking-wide text-navy-700/40 mb-2 px-1">
                  {town} <span className="opacity-60">({townAccounts.length})</span>
                </h3>
                <div className="bg-white rounded-xl border border-skyblue-100 divide-y divide-skyblue-100">
                  {townAccounts.map(a => (
                    <button
                      key={a.AccountId}
                      onClick={() => onSelect(a)}
                      className="w-full text-left px-5 py-4 flex items-center justify-between hover:bg-skyblue-100/30 transition"
                    >
                      <div>
                        <p className="font-medium text-navy-900">{a.AccountName}</p>
                        <p className="text-sm text-navy-700/50">{a.Address || a.Phone || '—'}</p>
                        {upcomingByAccount[a.AccountId] && (
                          <p className="text-xs text-teal-600 mt-0.5">
                            {formatShortDate(upcomingByAccount[a.AccountId].date)} — {upcomingByAccount[a.AccountId].note.NoteText.slice(0, 60)}{upcomingByAccount[a.AccountId].note.NoteText.length > 60 ? '…' : ''}
                          </p>
                        )}
                      </div>
                      <div className="flex items-center gap-2">
                        <FollowUpBadge nextFollowUp={a.NextFollowUp} />
                        <UpcomingActivityBadge upcoming={upcomingByAccount[a.AccountId]} />
                        <StatusPill status={a.Status} />
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function App() {
  const [unlocked, setUnlocked] = useState(() =>
    sessionStorage.getItem('bdd_crm_unlocked') === 'true' && !!sessionStorage.getItem('bdd_crm_session_token')
  );
  const [data, setData] = useState({ accounts: [], contacts: [], connections: [], notes: [] });
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState('list'); // 'list' | 'detail' | 'create'
  const [selectedId, setSelectedId] = useState(null);

  const refresh = useCallback(async () => {
    setLoading(true);
    try {
      const result = await apiGet();
      setData({
        accounts: result.accounts || [],
        contacts: result.contacts || [],
        connections: result.connections || [],
        notes: result.notes || []
      });
    } catch (err) {
      console.error(err);
    }
    setLoading(false);
  }, []);

  useEffect(() => { if (unlocked) refresh(); }, [unlocked]);

  const signOut = useCallback(async () => {
    try {
      await apiPost('logout', {});
    } catch (err) {
      // Even if the network call fails, still clear locally so the user
      // isn't stuck "logged in" on this device.
    }
    sessionStorage.removeItem('bdd_crm_unlocked');
    sessionStorage.removeItem('bdd_crm_session_token');
    sessionStorage.removeItem('bdd_crm_user_email');
    setUnlocked(false);
  }, []);

  // Autocomplete pools: curated defaults + whatever's already in the Sheet.
  const roleOptions = useMemo(() => uniqueSorted([
    ...ROLE_DEFAULTS,
    ...data.contacts.map(c => c.Role),
    ...data.connections.map(c => c.Role)
  ]), [data.contacts, data.connections]);

  const relationshipOptions = useMemo(() => uniqueSorted([
    ...RELATIONSHIP_DEFAULTS,
    ...data.connections.map(c => c.Relationship)
  ]), [data.connections]);

  const referralSourceOptions = useMemo(() => uniqueSorted([
    ...REFERRAL_SOURCE_DEFAULTS,
    ...data.accounts.map(a => a.ReferralSource)
  ]), [data.accounts]);

  if (!unlocked) return <Gate onUnlock={() => setUnlocked(true)} />;

  if (loading) {
    return (
      <div className="min-h-screen flex items-center justify-center text-navy-700/50">
        Loading accounts…
      </div>
    );
  }

  const selectedAccount = data.accounts.find(a => a.AccountId === selectedId);

  if (view === 'create') {
    return (
      <div className="max-w-4xl mx-auto px-4 sm:px-6 py-8">
        <button onClick={() => setView('list')} className="text-teal-600 hover:text-teal-700 text-sm mb-4">← Back to accounts</button>
        <AccountForm
          onSave={async (form) => {
            await apiPost('createAccount', { data: form });
            await refresh();
            setView('list');
          }}
          onCancel={() => setView('list')}
          referralSourceOptions={referralSourceOptions}
        />
      </div>
    );
  }

  if (view === 'detail' && selectedAccount) {
    return (
      <AccountDetail
        account={selectedAccount}
        contacts={data.contacts}
        connections={data.connections}
        notes={data.notes}
        onBack={() => setView('list')}
        onRefresh={refresh}
        roleOptions={roleOptions}
        relationshipOptions={relationshipOptions}
        referralSourceOptions={referralSourceOptions}
      />
    );
  }

  return (
    <AccountList
      accounts={data.accounts}
      contacts={data.contacts}
      connections={data.connections}
      notes={data.notes}
      onSelect={(a) => { setSelectedId(a.AccountId); setView('detail'); }}
      onCreate={() => setView('create')}
      onSignOut={signOut}
    />
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
