const GOOGLE_MAPS_API_KEY = "AIzaSyCwnUXXywRbu2kVsNMtYdvyMfDYuPaJm94";
let googleMapsLoadPromise = null;
function loadGoogleMaps(apiKey) {
  if (!apiKey || apiKey.indexOf('PASTE_YOUR') === 0) {
    return Promise.reject(new Error('No Google Maps API key configured'));
  }
  if (googleMapsLoadPromise) return googleMapsLoadPromise;
  googleMapsLoadPromise = new Promise((resolve, reject) => {
    if (window.google && window.google.maps && window.google.maps.places) {
      resolve(window.google);
      return;
    }
    const script = document.createElement('script');
    script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(apiKey)}&libraries=places`;
    script.async = true;
    script.onload = () => resolve(window.google);
    script.onerror = () => reject(new Error('Failed to load Google Maps'));
    document.head.appendChild(script);
  });
  return googleMapsLoadPromise;
}

// Account list

// ---------------------------------------------------------------------
// Map view — plots accounts as pins using their address, geocoded on the
// fly via Google's client-side Geocoder and cached back to the Sheet
// (Latitude/Longitude) so repeat visits don't re-geocode every address.
// ---------------------------------------------------------------------
// ---------------------------------------------------------------------
// New Map view — a working map-planning view kept separate from the
// original Map view while it is being refined. Pins are always colored by
// relationship stage, urgency is shown with a red outline, and the sidebar
// follows the currently visible map area.
// ---------------------------------------------------------------------
const NEW_MAP_STAGE_HEX = {
  'Target': '#081e3d',
  'Contacted': '#fde9a9',
  'Connected': '#fbbf24',
  'Contract Discussion': '#cdebe7',
  'Active Contract': '#14b8a6',
  'Not a fit': '#cbd5e1'
};

function newMapStageHex(stage) {
  return NEW_MAP_STAGE_HEX[stage || 'Target'] || NEW_MAP_STAGE_HEX.Target;
}

function newMapFollowUpBucket(value) {
  if (!value) return 'none';
  const d = new Date(value);
  if (isNaN(d.getTime())) return 'none';
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  d.setHours(0, 0, 0, 0);
  const diff = Math.round((d - today) / 86400000);
  if (diff < 0) return 'overdue';
  if (diff <= 7) return 'soon';
  return 'later';
}

function NewMapView({ accounts, contacts, connections, onSelect }) {
  const mapRef = useRef(null);

  const [followUpFilter, setFollowUpFilter] = useState('All');
  const [visibleIds, setVisibleIds] = useState([]);
  const [selectedId, setSelectedId] = useState(null);

  const filteredAccounts = useMemo(() => accounts.filter(a => {
    const stage = a.RelationshipStage || 'Target';
    if (stageFilter !== 'All' && stage !== stageFilter) return false;
    if (propensityFilter !== 'All') {
      const p = computeOverallFeesOpportunity(a);
      const label = p ? p.label : 'Unassessed';
      if (propensityFilter === 'High' && !(label === 'High' || label === 'Very High')) return false;
      if (propensityFilter === 'Medium' && label !== 'Medium') return false;
      if (propensityFilter === 'Low' && !(label === 'Low' || label === 'Unassessed')) return false;
    }
    if (followUpFilter !== 'All') {
      const bucket = newMapFollowUpBucket(a.NextFollowUp);
      if (followUpFilter === 'Overdue' && bucket !== 'overdue') return false;
      if (followUpFilter === 'Due soon' && bucket !== 'soon') return false;
      if (followUpFilter === 'No follow-up' && bucket !== 'none') return false;
    }
    return true;
  }), [accounts, stageFilter, propensityFilter, followUpFilter]);

  const sortedVisible = useMemo(() => {

    const rank = { 'Very High': 4, 'High': 3, 'Medium': 2, 'Low': 1 };
    return [...source].sort((a, b) => {
      const au = newMapFollowUpBucket(a.NextFollowUp) === 'overdue' ? 1 : 0;

      const ap = computeOverallFeesOpportunity(a);
      const bp = computeOverallFeesOpportunity(b);

        const lastContact = a.LastContactDate ? formatShortDate(new Date(a.LastContactDate)) : 'Never contacted';
        const content = `<div style="font-family:'Source Sans 3',sans-serif;padding:3px;min-width:230px;max-width:300px;">

          <div style="font-size:12px;color:#5a6b80;margin-top:2px;">${escapeHtml_(getTown(a.Address))} · ${escapeHtml_(stage)}</div>
