<style>
  /* ---------- Design tokens (matches the BDD CRM palette) ---------- */
  :root {
    --ink: #182238;
    --muted: #6b7280;
    --faint: #98a2b3;
    --line: #e6e9ef;
    --canvas: #f6f7f9;
    --surface: #ffffff;
    --navy: #0b1f3a;
    --navy-deep: #081e3d;
    --teal: #0f766e;
    --teal-dark: #0c5f58;
    --teal-wash: #eef6f5;
    --danger: #c2413a;
    --warning: #9a6700;
    --good: #0c8a5f;
    --sidebar-w: 224px;
    --topbar-h: 60px;
  }
  * { box-sizing: border-box; }
  html { background: var(--canvas); }

  button { font-family:inherit; }
  input, select, textarea { font-family:inherit; }

  /* ---------- Login (split brand / auth panel, same pattern as the CRM) ---------- */

  .exp-login-brand { position:relative; isolation:isolate; overflow:hidden; display:flex; align-items:center; padding:64px clamp(48px,7vw,100px); background:linear-gradient(145deg,#071b36 0%,#0a2949 58%,#0d555b 125%); color:#fff; }
  .exp-login-brand:before { content:''; position:absolute; z-index:-1; width:520px; height:520px; right:-260px; top:-200px; border-radius:50%; border:1px solid rgba(139,211,203,.18); box-shadow:0 0 0 70px rgba(139,211,203,.035),0 0 0 140px rgba(139,211,203,.025); }
  .exp-login-brand:after { content:''; position:absolute; z-index:-1; width:400px; height:400px; left:-220px; bottom:-250px; border-radius:50%; background:rgba(47,151,142,.16); filter:blur(2px); }

  .exp-login-company { font-size:14px; font-weight:750; letter-spacing:.01em; }

  .exp-login-brand h1 { max-width:480px; margin:0; font-size:clamp(34px,3.6vw,50px); font-weight:800; line-height:1.08; letter-spacing:-.02em; }

  .nav-icon { width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center; }

  .sidebar-bottom { margin-top:auto; padding:12px 10px 14px; border-top:1px solid var(--line); }
  .profile-row { display:flex; align-items:flex-start; gap:9px; padding:8px 9px; border-radius:10px; }
  .avatar { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#edf1f5; color:var(--navy-deep); font-size:11px; font-weight:700; flex:0 0 30px; }
  .profile-copy { min-width:0; flex:1; }
  .profile-name { font-size:12px; line-height:1.35; font-weight:600; color:#39465a; word-break:break-word; }
  .signout-btn { border:0; background:transparent; color:var(--faint); font-size:11px; cursor:pointer; padding:2px 0; border-radius:6px; }
  .signout-btn:hover { background:#f3f4f6; color:#4b5563; }

  .main { margin-left:var(--sidebar-w); min-height:100vh; }
  .topbar { position:sticky; top:0; z-index:30; height:var(--topbar-h); display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 24px; background:rgba(246,247,249,.9); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
  .topbar-title { font-size:16px; font-weight:750; color:var(--navy-deep); letter-spacing:-.01em; }

  @media (max-width:860px) {

    .hamburger { display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:9px; border:1px solid var(--line); background:#fff; }
    .sidebar-scrim { position:fixed; inset:0; background:rgba(8,20,40,.35); z-index:39; }
    .page { padding:16px; }
  }

  /* ---------- Cards, tiles, tables ---------- */
  .card { background:var(--surface); border:1px solid var(--line); border-radius:14px; }
  .card-pad { padding:18px 20px; }
  .card-title { font-size:14px; font-weight:700; color:var(--navy-deep); }
  .card-copy { font-size:12px; color:var(--muted); margin-top:2px; }

  .kpi-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
  @media (max-width:960px) { .kpi-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .kpi-tile { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .kpi-label { font-size:11.5px; font-weight:650; color:var(--muted); }
  .kpi-value { margin-top:8px; font-size:26px; font-weight:800; color:var(--navy-deep); letter-spacing:-.02em; font-variant-numeric:proportional-nums; }
  .kpi-delta { margin-top:4px; font-size:11.5px; font-weight:650; }
  .kpi-delta.up { color:var(--danger); }
  .kpi-delta.down { color:var(--good); }
  .kpi-delta.flat { color:var(--muted); }

  .bar-row { display:grid; grid-template-columns:150px 1fr 78px; align-items:center; gap:10px; padding:7px 0; }
  .bar-row-label { font-size:12.5px; color:#39465a; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track { position:relative; height:20px; background:#eef1f4; border-radius:6px; overflow:hidden; }
  .bar-fill { position:absolute; inset:0 auto 0 0; height:100%; background:var(--teal); border-radius:6px; min-width:4px; }
  .bar-row-value { font-size:12.5px; font-weight:700; color:var(--navy-deep); text-align:right; font-variant-numeric:tabular-nums; }

  .table-wrap { overflow-x:auto; }
  table.data-table { width:100%; border-collapse:collapse; font-size:13px; }
  table.data-table th { text-align:left; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--faint); padding:10px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.data-table td { padding:11px 14px; border-bottom:1px solid #f0f2f5; vertical-align:middle; color:#39465a; }
  table.data-table tbody tr:hover { background:#fafbfc; cursor:pointer; }
  table.data-table td.num, table.data-table th.num { text-align:right; font-variant-numeric:tabular-nums; }

  .pill { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:650; background:#eef1f4; color:#475467; white-space:nowrap; }

  .pill-navy { background:#eef2f7; color:var(--navy-deep); }
  .pill-warn { background:#fff8e8; color:var(--warning); }
  .pill-danger { background:#fdecea; color:var(--danger); }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; height:36px; padding:0 16px; border-radius:9px; font-size:13px; font-weight:650; cursor:pointer; border:1px solid transparent; transition:.15s ease; white-space:nowrap; }
  .btn-primary { background:var(--navy-deep); color:#fff; }
  .btn-primary:hover { background:#0f2a4e; }
  .btn-teal { background:var(--teal); color:#fff; }

  .btn-ghost { background:#fff; color:#39465a; border-color:var(--line); }

  .btn-sm { height:30px; padding:0 12px; font-size:12px; }

  .field { display:flex; flex-direction:column; gap:6px; }
  .field label { font-size:12px; font-weight:650; color:#475467; }
  .input, select.input, textarea.input { width:100%; height:38px; padding:0 12px; border-radius:9px; border:1px solid #d7dde5; background:#fff; font-size:13.5px; color:var(--ink); }
  textarea.input { height:auto; padding:10px 12px; resize:vertical; }
  .input:focus, select.input:focus, textarea.input:focus { outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(15,118,110,.12); }
  .field-hint { font-size:11px; color:var(--faint); }
  .field-error { font-size:11px; color:var(--danger); }

  .modal-overlay { position:fixed; inset:0; background:rgba(8,20,40,.4); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:60; overflow-y:auto; }
  .modal { width:min(560px,100%); background:#fff; border-radius:16px; box-shadow:0 30px 70px rgba(8,20,40,.3); margin-bottom:5vh; }
  .modal-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:18px 20px; border-bottom:1px solid var(--line); }
  .modal-title { font-size:15px; font-weight:750; color:var(--navy-deep); }
  .modal-close { border:0; background:transparent; color:var(--faint); font-size:18px; line-height:1; cursor:pointer; padding:4px; }
  .modal-body { padding:20px; display:grid; gap:14px; }
  .modal-foot { display:flex; align-items:center; justify-content:flex-end; gap:10px; padding:16px 20px; border-top:1px solid var(--line); }
  .modal-row-2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }

  .receipt-drop { border:1.5px dashed #d7dde5; border-radius:12px; padding:16px; text-align:center; color:var(--muted); font-size:12.5px; cursor:pointer; background:#fbfcfd; }
  .receipt-drop:hover { border-color:var(--teal); background:var(--teal-wash); }

  .empty-state { text-align:center; padding:48px 20px; color:var(--muted); }
  .empty-state-title { font-size:14px; font-weight:700; color:var(--navy-deep); margin-bottom:6px; }

  .toast { position:fixed; right:20px; bottom:20px; z-index:80; background:var(--navy-deep); color:#fff; padding:11px 16px; border-radius:10px; font-size:13px; font-weight:600; box-shadow:0 14px 30px rgba(8,20,40,.3); }

  .filter-row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .segmented { display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:#fff; }
  .segmented button { border:0; background:transparent; padding:7px 13px; font-size:12.5px; font-weight:650; color:#657084; cursor:pointer; }
  .segmented button.active { background:var(--navy-deep); color:#fff; }

  .spinner { width:22px; height:22px; border-radius:50%; border:2.5px solid #dfe7ed; border-top-color:var(--teal); animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .full-loading { min-height:60vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--muted); font-size:13px; }

  .pac-container { z-index:9999; font-family:'Inter',sans-serif; border:1px solid var(--line); border-radius:10px; box-shadow:0 14px 36px rgba(15,23,42,.14); margin-top:4px; overflow:hidden; }
  .checkbox-row { display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; color:#475467; }
  .checkbox-row input { width:15px; height:15px; }
</style>

const { useState, useEffect, useCallback, useMemo, useRef } = React;

// Must match Code.gs's GOOGLE_CLIENT_ID for this app.

// Browser (HTTP-referrer-restricted) Google Maps API key — same kind of key

// =====================================================================
// Small utilities

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function parseDate_(s) {
  if (!s) return null;
  const d = new Date(s.length <= 10 ? s + 'T00:00:00' : s);
  return isNaN(d.getTime()) ? null : d;
}
function formatDate(s) {
  const d = parseDate_(s);
  if (!d) return '—';
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
}
function formatCurrency(v) {
  const n = Number(v) || 0;
  return n.toLocaleString(undefined, { style:'currency', currency:'USD' });
}
function formatCurrencyCompact(v) {

async function apiGet(extraParams) {

  if (!res.ok) throw new Error(`Server returned an error (status ${res.status}).`);
  let result;
  try { result = await res.json(); } catch (e) { throw new Error('Server returned an unexpected response — please try again.'); }

  let result;

function Gate({ onUnlock }) {
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const [googleFailedToLoad, setGoogleFailedToLoad] = useState(false);
  const googleButtonRef = useRef(null);
  const loginInFlightRef = useRef(false);

  const handleCredentialResponse = useCallback(async response => {
    if (loginInFlightRef.current) return;
    loginInFlightRef.current = true;
    setBusy(true); setError('');
    try {
      const result = await apiPost('verifyGoogleLogin', { idToken: response.credential });
      if (result.success) {
        sessionStorage.setItem(LS_PREFIX + 'user_email', result.result.email);
        sessionStorage.setItem(LS_PREFIX + 'user_name', result.result.name || '');
        sessionStorage.setItem(LS_PREFIX + 'session_token', result.result.sessionToken);
        sessionStorage.setItem(LS_PREFIX + 'unlocked', 'true');
        onUnlock();
      } else {
        setError(result.error || "That Google account isn't authorized for this app.");
        loginInFlightRef.current = false;
      }
    } catch (err) {
      setError((err.message || 'Something went wrong signing in') + ' — try again.');
      loginInFlightRef.current = false;
    }
    setBusy(false);

  useEffect(() => {

function ExpenseForm({ initial, presetCategory, categories, paymentMethods, defaultMileageRate, onCancel, onSaved, apiCreate, apiUpdate, apiUploadReceipt }) {
  const isEdit = !!(initial && initial.ExpenseId);
  const [form, setForm] = useState(() => ({
    Date: (initial && initial.Date) || todayStr(),
    Category: (initial && initial.Category) || presetCategory || categories[0] || 'Other',
    Vendor: (initial && initial.Vendor) || '',
    Description: (initial && initial.Description) || '',
    Amount: (initial && initial.Amount) || '',
    PaymentMethod: (initial && initial.PaymentMethod) || paymentMethods[0] || '',
    Miles: (initial && initial.Miles) || '',
    MileageRate: (initial && initial.MileageRate) || defaultMileageRate,
    Notes: (initial && initial.Notes) || '',
    StartLocation: (initial && initial.StartLocation) || (presetCategory === 'Mileage' ? SAVED_START_LOCATIONS[0].address : ''),
    EndLocation: (initial && initial.EndLocation) || ''
  }));
  const [file, setFile] = useState(null);
  const [existingReceipt, setExistingReceipt] = useState(() => (initial && initial.ReceiptFileUrl) ? { name: initial.ReceiptFileName, url: initial.ReceiptFileUrl } : null);
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState('');
  const [roundTrip, setRoundTrip] = useState(false);
  const [calculating, setCalculating] = useState(false);
  const startInputRef = useRef(null);
  const endInputRef = useRef(null);
  const isMileage = form.Category === 'Mileage';
  const hasMapsKey = GOOGLE_MAPS_BROWSER_API_KEY && GOOGLE_MAPS_BROWSER_API_KEY.indexOf('PASTE_YOUR') !== 0;
  const computedMileageAmount = isMileage ? (Number(form.Miles || 0) * Number(form.MileageRate || 0)) : null;
  // True when the Start location isn't one of the three saved bases — that's
  // when the free-text (autocomplete) input is shown at all.
  const isCustomStart = !SAVED_START_LOCATIONS.some(loc => loc.address === form.StartLocation);

  function set(field, value) { setForm(f => ({ ...f, [field]: value })); }

  // Wire Google Places autocomplete onto the start/end address inputs, once
  // Maps is loaded and only while this is a mileage entry. Guarded so it
  // only attaches once per input even if this effect re-runs. Depends on
  // isCustomStart too, since the start input only exists in the DOM once a
  // custom (non-saved) start location is selected.
  useEffect(() => {
    if (!isMileage || !hasMapsKey) return;
    let cancelled = false;
    loadGoogleMaps(GOOGLE_MAPS_BROWSER_API_KEY).then(google => {
      if (cancelled) return;
      if (startInputRef.current && !startInputRef.current._bddAutocomplete) {
        const ac = new google.maps.places.Autocomplete(startInputRef.current, { fields:['formatted_address'] });
        ac.addListener('place_changed', () => {
          const place = ac.getPlace();
          set('StartLocation', (place && place.formatted_address) || startInputRef.current.value);
        });
        startInputRef.current._bddAutocomplete = ac;
      }
      if (endInputRef.current && !endInputRef.current._bddAutocomplete) {
        const ac2 = new google.maps.places.Autocomplete(endInputRef.current, { fields:['formatted_address'] });
        ac2.addListener('place_changed', () => {
          const place = ac2.getPlace();
          set('EndLocation', (place && place.formatted_address) || endInputRef.current.value);
        });
        endInputRef.current._bddAutocomplete = ac2;
      }
    }).catch(() => {});
    return () => { cancelled = true; };
  }, [isMileage, hasMapsKey, isCustomStart]);

  async function calculateDistance() {
    setErr('');
    if (!form.StartLocation || !form.EndLocation) { setErr('Enter both a start and end location first.'); return; }
    if (!window.google || !window.google.maps) { setErr('Google Maps is still loading — try again in a moment.'); return; }
    setCalculating(true);
    try {
      const service = new google.maps.DistanceMatrixService();
      const response = await new Promise((resolve, reject) => {
        service.getDistanceMatrix({
          origins: [form.StartLocation],
          destinations: [form.EndLocation],
          travelMode: google.maps.TravelMode.DRIVING,
          unitSystem: google.maps.UnitSystem.IMPERIAL
        }, (result, status) => {
          if (status === 'OK') resolve(result); else reject(new Error('Could not calculate a route between those two locations.'));
        });
      });
      const element = response.rows[0] && response.rows[0].elements[0];
      if (!element || element.status !== 'OK') throw new Error('Could not calculate a route between those two locations.');
      const oneWayMiles = element.distance.value / 1609.344;
      set('Miles', (roundTrip ? oneWayMiles * 2 : oneWayMiles).toFixed(1));
    } catch (e) {
      setErr(e.message || 'Could not calculate mileage.');
    }
    setCalculating(false);
  }

  async function handleSubmit(e) {
    e.preventDefault();
    setErr('');
    if (!form.Date) return setErr('Date is required.');
    if (!form.Category) return setErr('Category is required.');
    if (isMileage) {
      if (!form.Miles || Number(form.Miles) <= 0) return setErr('Enter the number of miles.');
    } else if (!form.Amount || Number(form.Amount) <= 0) {
      return setErr('Enter an amount greater than zero.');
    }
    setSaving(true);
    try {
      const payload = {
        Date: form.Date,
        Category: form.Category,
        Vendor: form.Vendor,
        Description: form.Description,
        PaymentMethod: form.PaymentMethod,
        Notes: form.Notes,
        Amount: isMileage ? computedMileageAmount : Number(form.Amount),
        Miles: isMileage ? Number(form.Miles) : '',
        MileageRate: isMileage ? Number(form.MileageRate) : '',
        StartLocation: isMileage ? form.StartLocation : '',
        EndLocation: isMileage ? form.EndLocation : ''
      };
      let expenseId = initial && initial.ExpenseId;
      if (isEdit) {
        await apiUpdate({ ExpenseId: expenseId, ...payload });
      } else {
        const created = await apiCreate(payload);
        expenseId = created.ExpenseId;
      }
      if (file) {
        const base64Data = await fileToBase64_(file);
        const uploaded = await apiUploadReceipt(expenseId, file.name, file.type, base64Data);
        await apiUpdate({ ExpenseId: expenseId, ReceiptFileId: uploaded.fileId, ReceiptFileUrl: uploaded.url, ReceiptFileName: uploaded.name });
      }

    } catch (err2) {
      setErr(err2.message || 'Something went wrong saving this expense.');
    }
    setSaving(false);
  }

    h('form', { className:'modal', onSubmit:handleSubmit },

        ),
        h('button', { type:'button', className:'modal-close', onClick:onCancel }, h(Icon, { name:'close' }))
      ),
      h('div', { className:'modal-body' },
        err && h('div', { className:'field-error' }, err),
        h('div', { className:'modal-row-2' },
          h('div', { className:'field' },
            h('label', null, 'Date'),
            h('input', { type:'date', className:'input', value:form.Date, onChange:e => set('Date', e.target.value) })
          ),
          h('div', { className:'field' },
            h('label', null, 'Category'),
            h('select', { className:'input', value:form.Category, onChange:e => set('Category', e.target.value) },
              categories.map(c => h('option', { key:c, value:c }, c))
            )
          )
        ),
        isMileage && h('div', { className:'field' },
          h('label', null, 'Start location'),
          h('select', {
            className:'input',
            value: isCustomStart ? '__custom__' : form.StartLocation,
            onChange: e => set('StartLocation', e.target.value === '__custom__' ? '' : e.target.value)
          },
            SAVED_START_LOCATIONS.map(loc => h('option', { key:loc.label, value:loc.address }, loc.label)),
            h('option', { value:'__custom__' }, 'Other (type an address)')
          ),
          isCustomStart && h('input', { type:'text', className:'input', style:{ marginTop:'6px' }, ref:startInputRef, value:form.StartLocation, onChange:e => set('StartLocation', e.target.value), placeholder:'Type or search an address' })
        ),
        isMileage && h('div', { className:'field' },
          h('label', null, 'End location'),
          h('input', { type:'text', className:'input', ref:endInputRef, value:form.EndLocation, onChange:e => set('EndLocation', e.target.value), placeholder:'e.g. Cape Cod Hospital, Hyannis, MA' })

            )

              )
            : h('label', { className:'receipt-drop' },
                file ? ('Selected: ' + file.name) : 'Click to attach a photo or PDF of the receipt',
                h('input', { type:'file', accept:'image/*,application/pdf', style:{ display:'none' }, onChange:e => setFile(e.target.files[0] || null) })

// =====================================================================
// Expenses list/table view
// =====================================================================
function ExpensesView({ expenses, categories, onEdit, onDelete }) {
  const [search, setSearch] = useState('');
  const [categoryFilter, setCategoryFilter] = useState('All');
  const [sortDesc, setSortDesc] = useState(true);

  const filtered = useMemo(() => {
    let rows = expenses.slice();
    if (categoryFilter !== 'All') rows = rows.filter(r => r.Category === categoryFilter);
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      rows = rows.filter(r => (r.Vendor||'').toLowerCase().includes(q) || (r.Description||'').toLowerCase().includes(q) || (r.Notes||'').toLowerCase().includes(q));
    }
    rows.sort((a,b) => {
      const da = parseDate_(a.Date), db = parseDate_(b.Date);
      const ta = da ? da.getTime() : 0, tb = db ? db.getTime() : 0;
      return sortDesc ? tb - ta : ta - tb;
    });
    return rows;
  }, [expenses, categoryFilter, search, sortDesc]);

  function exportCsv() {
    const headers = ['Date','Category','Vendor','Description','Amount','PaymentMethod','Miles','MileageRate','StartLocation','EndLocation','Notes'];
    const lines = [headers.join(',')].concat(filtered.map(r => headers.map(hd => {
      const v = r[hd] === undefined || r[hd] === null ? '' : String(r[hd]);
      return '"' + v.replace(/"/g,'""') + '"';
    }).join(',')));
    const blob = new Blob([lines.join('\n')], { type:'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'bdd-exp-expenses.csv'; a.click();
    URL.revokeObjectURL(url);
  }

  return h('div', null,
    h('div', { className:'filter-row', style:{ marginBottom:'16px', justifyContent:'space-between' } },
      h('div', { className:'filter-row' },
        h('input', { type:'text', className:'input', style:{ width:'220px' }, placeholder:'Search vendor, description…', value:search, onChange:e => setSearch(e.target.value) }),
        h('select', { className:'input', style:{ width:'190px' }, value:categoryFilter, onChange:e => setCategoryFilter(e.target.value) },
          h('option', { value:'All' }, 'All categories'),
          categories.map(c => h('option', { key:c, value:c }, c))
        ),
        h('button', { type:'button', className:'btn btn-ghost btn-sm', onClick:() => setSortDesc(s => !s) }, 'Date ' + (sortDesc ? '↓' : '↑'))
      ),
      h('button', { type:'button', className:'btn btn-ghost', onClick:exportCsv }, 'Export CSV')
    ),
    h('div', { className:'card table-wrap' },
      filtered.length === 0
        ? h('div', { className:'empty-state' },
            h('div', { className:'empty-state-title' }, 'No expenses yet'),
            h('p', null, 'Add your first expense to start tracking spend.')
          )
        : h('table', { className:'data-table' },
            h('thead', null, h('tr', null,
              h('th', null, 'Date'), h('th', null, 'Category'), h('th', null, 'Vendor / Purpose'),
              h('th', null, 'Payment'), h('th', { className:'num' }, 'Amount'), h('th', null, 'Receipt'), h('th', null, '')
            )),
            h('tbody', null, filtered.map(r => h('tr', { key:r.ExpenseId, onClick:() => onEdit(r) },
              h('td', null, formatDate(r.Date)),
              h('td', null, h('span', { className:'pill ' + categoryPillClass(r.Category) }, r.Category)),
              h('td', null, r.Vendor || '—'),
              h('td', null, r.PaymentMethod || '—'),
              h('td', { className:'num' }, formatCurrency(r.Amount)),
              h('td', null, r.ReceiptFileUrl ? h('a', { href:r.ReceiptFileUrl, target:'_blank', rel:'noopener noreferrer', style:{ color:'var(--teal-dark)', display:'inline-flex' }, onClick:e => e.stopPropagation() }, h(Icon,{name:'receipt'})) : '—'),
              h('td', { style:{ textAlign:'right' } }, h('button', { type:'button', className:'btn btn-danger-ghost btn-sm', onClick:e => { e.stopPropagation(); onDelete(r); } }, h(Icon,{name:'trash'})))
            )))
          )
    )
  );
}

// =====================================================================
// Mileage view — same data, filtered to Category === 'Mileage'
// =====================================================================
function MileageView({ expenses, onEdit, onDelete }) {
  const rows = useMemo(() => expenses.filter(e => e.Category === 'Mileage').sort((a,b) => (parseDate_(b.Date)||0) - (parseDate_(a.Date)||0)), [expenses]);
  const totalMiles = rows.reduce((s,r) => s + (Number(r.Miles)||0), 0);
  const totalAmount = rows.reduce((s,r) => s + (Number(r.Amount)||0), 0);
  return h('div', null,
    h('div', { className:'kpi-grid', style:{ marginBottom:'18px', gridTemplateColumns:'repeat(2,minmax(0,1fr))' } },
      h('div', { className:'kpi-tile' }, h('div', { className:'kpi-label' }, 'Total miles logged'), h('div', { className:'kpi-value' }, totalMiles.toLocaleString(undefined,{maximumFractionDigits:1}))),
      h('div', { className:'kpi-tile' }, h('div', { className:'kpi-label' }, 'Total mileage reimbursement'), h('div', { className:'kpi-value' }, formatCurrency(totalAmount)))
    ),
    h('div', { className:'card table-wrap' },
      rows.length === 0
        ? h('div', { className:'empty-state' }, h('div', { className:'empty-state-title' }, 'No mileage logged yet'), h('p', null, 'Use "Add Mileage" at the top to log a drive.'))
        : h('table', { className:'data-table' },
            h('thead', null, h('tr', null, h('th', null,'Date'), h('th', null,'Purpose'), h('th', {className:'num'}, 'Miles'), h('th', {className:'num'}, 'Rate'), h('th', {className:'num'}, 'Amount'), h('th', null, ''))),
            h('tbody', null, rows.map(r => h('tr', { key:r.ExpenseId, onClick:() => onEdit(r) },
              h('td', null, formatDate(r.Date)),
              h('td', null, r.Vendor || '—'),
              h('td', { className:'num' }, Number(r.Miles||0).toLocaleString(undefined,{maximumFractionDigits:1})),
              h('td', { className:'num' }, '$' + Number(r.MileageRate||0).toFixed(3)),
              h('td', { className:'num' }, formatCurrency(r.Amount)),
              h('td', { style:{ textAlign:'right' } }, h('button', { type:'button', className:'btn btn-danger-ghost btn-sm', onClick:e => { e.stopPropagation(); onDelete(r); } }, h(Icon,{name:'trash'})))
            )))
          )
    )
  );
}

// =====================================================================
// Dashboard — KPI tiles + spend-by-category bars + recent activity
// =====================================================================
function DashboardView({ expenses, setView }) {
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const yearStart = new Date(now.getFullYear(), 0, 1);
  const lastMonthStart = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const lastMonthEnd = new Date(now.getFullYear(), now.getMonth(), 0, 23,59,59);

  const sum = (rows) => rows.reduce((s,r) => s + (Number(r.Amount)||0), 0);
  const inRange = (r, start, end) => { const d = parseDate_(r.Date); return d && d >= start && (!end || d <= end); };

  const mtd = expenses.filter(r => inRange(r, monthStart));
  const lastMonth = expenses.filter(r => inRange(r, lastMonthStart, lastMonthEnd));
  const ytd = expenses.filter(r => inRange(r, yearStart));
  const mileageYtd = ytd.filter(r => r.Category === 'Mileage');
  const missingReceipts = ytd.filter(r => !r.ReceiptFileUrl).length;

  const mtdTotal = sum(mtd), lastMonthTotal = sum(lastMonth), ytdTotal = sum(ytd);
  const mtdDelta = lastMonthTotal > 0 ? Math.round(((mtdTotal - lastMonthTotal) / lastMonthTotal) * 100) : null;

  const byCategory = useMemo(() => {
    const map = {};
    ytd.forEach(r => { map[r.Category] = (map[r.Category]||0) + (Number(r.Amount)||0); });
    return Object.entries(map).sort((a,b) => b[1]-a[1]);
  }, [ytd]);
  const maxCategory = byCategory.length ? byCategory[0][1] : 0;

  const recent = expenses.slice().sort((a,b) => (parseDate_(b.Date)||0) - (parseDate_(a.Date)||0)).slice(0,6);

  return h('div', null,
    h('div', { className:'kpi-grid', style:{ marginBottom:'20px' } },
      h('div', { className:'kpi-tile' },
        h('div', { className:'kpi-label' }, 'This month'),
        h('div', { className:'kpi-value' }, formatCurrencyCompact(mtdTotal)),
        mtdDelta !== null && h('div', { className:'kpi-delta ' + (mtdDelta > 0 ? 'up' : mtdDelta < 0 ? 'down' : 'flat') }, (mtdDelta>0?'↑ ':mtdDelta<0?'↓ ':'') + Math.abs(mtdDelta) + '% vs last month')
      ),
      h('div', { className:'kpi-tile' }, h('div', { className:'kpi-label' }, 'Year to date'), h('div', { className:'kpi-value' }, formatCurrencyCompact(ytdTotal))),
      h('div', { className:'kpi-tile' }, h('div', { className:'kpi-label' }, 'Mileage YTD'), h('div', { className:'kpi-value' }, mileageYtd.reduce((s,r)=>s+(Number(r.Miles)||0),0).toLocaleString(undefined,{maximumFractionDigits:0}) + ' mi')),
      h('div', { className:'kpi-tile' }, h('div', { className:'kpi-label' }, 'Missing receipts (YTD)'), h('div', { className:'kpi-value' }, missingReceipts))
    ),
    h('div', { style:{ display:'grid', gridTemplateColumns:'1.1fr .9fr', gap:'16px' }, className:'dash-grid' },
      h('div', { className:'card card-pad' },
        h('div', { className:'card-title' }, 'Spend by category · year to date'),
        h('div', { style:{ marginTop:'12px' } },
          byCategory.length === 0
            ? h('p', { className:'card-copy' }, 'No expenses logged yet this year.')
            : byCategory.map(([cat, amt]) => h('div', { className:'bar-row', key:cat },
                h('div', { className:'bar-row-label' }, cat),
                h('div', { className:'bar-track' }, h('div', { className:'bar-fill', style:{ width: (maxCategory ? (amt/maxCategory*100) : 0) + '%' } })),
                h('div', { className:'bar-row-value' }, formatCurrency(amt))
              ))
        )
      ),
      h('div', { className:'card card-pad' },
        h('div', { className:'card-title' }, 'Recent activity'),
        h('div', { style:{ marginTop:'10px', display:'grid', gap:'2px' } },
          recent.length === 0
            ? h('p', { className:'card-copy' }, 'Nothing logged yet.')
            : recent.map(r => h('div', { key:r.ExpenseId, style:{ display:'flex', justifyContent:'space-between', gap:'10px', padding:'9px 0', borderBottom:'1px solid #f0f2f5', cursor:'pointer' }, onClick:() => setView('expenses') },
                h('div', { style:{ minWidth:0 } },
                  h('div', { style:{ fontSize:'12.5px', fontWeight:600, color:'#39465a', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' } }, r.Vendor || r.Category),
                  h('div', { style:{ fontSize:'11px', color:'var(--faint)' } }, formatDate(r.Date) + ' · ' + r.Category)
                ),
                h('div', { style:{ fontSize:'12.5px', fontWeight:700, color:'var(--navy-deep)', flex:'0 0 auto' } }, formatCurrency(r.Amount))
              ))
        )
      )
    ),
    h('style', null, '@media (max-width:900px){ .dash-grid { grid-template-columns:1fr !important; } }')
  );
}

// =====================================================================
// Reports view — simple month-by-month category matrix
// =====================================================================
function ReportsView({ expenses, categories }) {
  const [year, setYear] = useState(() => new Date().getFullYear());
  const years = useMemo(() => {
    const set = new Set(expenses.map(r => { const d = parseDate_(r.Date); return d ? d.getFullYear() : null; }).filter(Boolean));
    set.add(new Date().getFullYear());
    return Array.from(set).sort((a,b) => b-a);
  }, [expenses]);

  const monthLabels = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const matrix = useMemo(() => {
    const grid = {};
    categories.forEach(c => { grid[c] = new Array(12).fill(0); });
    expenses.forEach(r => {
      const d = parseDate_(r.Date);
      if (!d || d.getFullYear() !== year) return;
      if (!grid[r.Category]) grid[r.Category] = new Array(12).fill(0);
      grid[r.Category][d.getMonth()] += Number(r.Amount) || 0;
    });
    return grid;
  }, [expenses, categories, year]);

  const monthTotals = monthLabels.map((_, i) => Object.values(matrix).reduce((s,arr) => s + arr[i], 0));
  const yearTotal = monthTotals.reduce((s,v) => s+v, 0);

  return h('div', null,
    h('div', { className:'filter-row', style:{ marginBottom:'14px' } },
      h('div', { className:'card-title' }, 'Expenses by category and month'),
      h('select', { className:'input', style:{ width:'110px', marginLeft:'auto' }, value:year, onChange:e => setYear(Number(e.target.value)) },
        years.map(y => h('option', { key:y, value:y }, y))
      )
    ),
    h('div', { className:'card table-wrap' },
      h('table', { className:'data-table' },
        h('thead', null, h('tr', null, h('th', null, 'Category'), monthLabels.map(m => h('th', { key:m, className:'num' }, m)), h('th', { className:'num' }, 'Total'))),
        h('tbody', null,
          Object.entries(matrix).filter(([,arr]) => arr.some(v => v>0)).map(([cat, arr]) => h('tr', { key:cat },
            h('td', null, cat),
            arr.map((v,i) => h('td', { key:i, className:'num' }, v ? formatCurrency(v) : '—')),
            h('td', { className:'num', style:{ fontWeight:700 } }, formatCurrency(arr.reduce((s,v)=>s+v,0)))
          )),
          h('tr', null,
            h('td', { style:{ fontWeight:700 } }, 'Total'),
            monthTotals.map((v,i) => h('td', { key:i, className:'num', style:{ fontWeight:700 } }, v ? formatCurrency(v) : '—')),
            h('td', { className:'num', style:{ fontWeight:800 } }, formatCurrency(yearTotal))
          )
        )
      )
    )
  );
}

// =====================================================================
// Settings view
// =====================================================================
function SettingsView({ settings, onSaveSettings, user }) {
  const [rate, setRate] = useState(settings.mileageRate);
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);

  async function save() {
    setSaving(true);
    await onSaveSettings({ mileageRate: rate });
    setSaving(false);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  }

  return h('div', { style:{ maxWidth:'520px' } },
    h('div', { className:'card card-pad', style:{ marginBottom:'16px' } },
      h('div', { className:'card-title' }, 'Mileage rate'),
      h('p', { className:'card-copy' }, 'Used as the default rate on new mileage entries. Changing it never rewrites the rate stored on past entries.'),
      h('div', { style:{ display:'flex', gap:'10px', marginTop:'12px', alignItems:'center' } },
        h('input', { type:'number', step:'0.001', min:'0', className:'input', style:{ width:'140px' }, value:rate, onChange:e => setRate(e.target.value) }),
        h('button', { type:'button', className:'btn btn-teal', onClick:save, disabled:saving }, saving ? 'Saving…' : 'Save'),
        saved && h('span', { style:{ fontSize:'12px', color:'var(--good)', fontWeight:650 } }, 'Saved')
      )
    ),
    h('div', { className:'card card-pad' },
      h('div', { className:'card-title' }, 'Signed in as'),
      h('p', { className:'card-copy' }, user.email)
    )
  );
}

// =====================================================================
// App shell
// =====================================================================
function emptyData_() { return { expenses:[], settings:{ mileageRate:0.76 }, categories:[], paymentMethods:[] }; }

function App() {
  const [unlocked, setUnlocked] = useState(() => sessionStorage.getItem(LS_PREFIX+'unlocked') === 'true' && !!sessionStorage.getItem(LS_PREFIX+'session_token'));
  const [startupCache] = useState(() => readCache_());
  const [data, setData] = useState(() => startupCache || emptyData_());
  const [loading, setLoading] = useState(() => !startupCache);
  const [loadError, setLoadError] = useState(null);
  const [view, setView] = useState('dashboard');
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [modal, setModal] = useState(null); // null | { mode:'create'|'edit', expense }
  const [toast, setToast] = useState(null);

  const user = {
    email: sessionStorage.getItem(LS_PREFIX+'user_email') || '',
    name: sessionStorage.getItem(LS_PREFIX+'user_name') || ''
  };

  function showToast(message, type) {
    setToast({ message, type });
    setTimeout(() => setToast(null), 2800);
  }

  const refresh = useCallback(async () => {
    setLoadError(null);
    try {
      const result = await apiGet();
      const next = {
        expenses: result.expenses || [],
        settings: result.settings || { mileageRate:0.76 },
        categories: (result.categories && result.categories.length) ? result.categories : ['Mileage','Equipment & Supplies','Software & Subscriptions','Insurance','Marketing','Professional Services','Travel & Lodging','Office Supplies','Other'],
        paymentMethods: (result.paymentMethods && result.paymentMethods.length) ? result.paymentMethods : ['Business Debit Card','Business Credit Card','Personal (to be reimbursed)','Check','Cash','Other']
      };
      setData(next);
      writeCache_(next);
    } catch (err) {
      setLoadError(err.message || 'Failed to load your expenses.');
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { if (unlocked) refresh(); }, [unlocked, refresh]);

  function handleUnlock() { setUnlocked(true); }
  function handleSignOut() {
    apiPost('logout', {}).catch(() => {});
    sessionStorage.clear();
    window.location.reload();
  }

  const apiCreate = useCallback(async (payload) => {
    const res = await apiPost('createExpense', { data: payload });
    if (!res.success) throw new Error(res.error || 'Could not save expense.');
    setData(d => { const next = { ...d, expenses: [...d.expenses, res.result] }; writeCache_(next); return next; });
    return res.result;
  }, []);
  const apiUpdate = useCallback(async (payload) => {
    const res = await apiPost('updateExpense', { data: payload });
    if (!res.success) throw new Error(res.error || 'Could not save changes.');
    setData(d => { const next = { ...d, expenses: d.expenses.map(e => e.ExpenseId === payload.ExpenseId ? { ...e, ...payload } : e) }; writeCache_(next); return next; });
    return res.result;
  }, []);
  const apiUploadReceipt = useCallback(async (expenseId, filename, mimeType, base64Data) => {
    const res = await apiPost('uploadReceipt', { expenseId, filename, mimeType, base64Data });
    if (!res.success) throw new Error(res.error || 'Could not upload the receipt.');
    return res.result;
  }, []);
  const apiDelete = useCallback(async (expenseId) => {
    const res = await apiPost('deleteExpense', { expenseId });
    if (!res.success) throw new Error(res.error || 'Could not delete this expense.');
    setData(d => { const next = { ...d, expenses: d.expenses.filter(e => e.ExpenseId !== expenseId) }; writeCache_(next); return next; });
  }, []);
  const apiSaveSettings = useCallback(async (payload) => {
    const res = await apiPost('updateSettings', { data: payload });
    if (res.success) setData(d => { const next = { ...d, settings: res.result }; writeCache_(next); return next; });
  }, []);

  function openAddExpense() {
    const firstNonMileage = data.categories.find(c => c !== 'Mileage') || data.categories[0];
    setModal({ mode:'create', presetCategory: firstNonMileage });
  }
  function openAddMileage() { setModal({ mode:'create', presetCategory:'Mileage' }); }
  function openEdit(expense) { setModal({ mode:'edit', expense }); }
  async function handleDelete(expense) {
    if (!window.confirm('Delete this expense? This cannot be undone.')) return;
    try { await apiDelete(expense.ExpenseId); showToast('Expense deleted.'); }
    catch (err) { showToast(err.message, 'error'); }
  }
  async function handleSaved() {
    setModal(null);
    showToast(modal && modal.mode === 'edit' ? 'Expense updated.' : 'Expense added.');
  }

  if (!unlocked) return h(Gate, { onUnlock: handleUnlock });

  if (loading) {
    return h('div', { className:'full-loading' }, h('div', { className:'spinner' }), h('p', null, 'Loading BDD EXP…'));
  }

  const pageTitles = { dashboard:'Dashboard', expenses:'Expenses', mileage:'Mileage', reports:'Reports', settings:'Settings' };

  return h('div', { className:'app-shell' },
    h(Sidebar, { view, setView, user, onSignOut:handleSignOut, open:sidebarOpen, onClose:() => setSidebarOpen(false) }),
    h('div', { className:'main' },
      h('div', { className:'topbar' },
        h('div', { style:{ display:'flex', alignItems:'center', gap:'12px' } },
          h('button', { type:'button', className:'hamburger', onClick:() => setSidebarOpen(true) }, h(Icon, { name:'menu' })),
          h('div', null,
            h('div', { className:'topbar-title' }, pageTitles[view] || ''),
            loadError && h('div', { className:'topbar-sub', style:{ color:'var(--danger)' } }, loadError)
          )
        ),
        h('div', { style:{ display:'flex', alignItems:'center', gap:'8px' } },
          h('button', { type:'button', className:'btn btn-teal btn-sm', onClick:openAddMileage }, h(Icon,{name:'plus'}), 'Add Mileage'),
          h('button', { type:'button', className:'btn btn-primary btn-sm', onClick:openAddExpense }, h(Icon,{name:'plus'}), 'Add expense')
        )
      ),
      h('div', { className:'page' },
        view === 'dashboard' && h(DashboardView, { expenses:data.expenses, setView }),
        view === 'expenses' && h(ExpensesView, { expenses:data.expenses, categories:data.categories, onEdit:openEdit, onDelete:handleDelete }),
        view === 'mileage' && h(MileageView, { expenses:data.expenses, onEdit:openEdit, onDelete:handleDelete }),
        view === 'reports' && h(ReportsView, { expenses:data.expenses, categories:data.categories }),
        view === 'settings' && h(SettingsView, { settings:data.settings, onSaveSettings:apiSaveSettings, user })
      )
    ),
    modal && h(ExpenseForm, {
      initial: modal.mode === 'edit' ? modal.expense : null,
      presetCategory: modal.presetCategory,
      categories: data.categories,
      paymentMethods: data.paymentMethods,
      defaultMileageRate: data.settings.mileageRate,
      onCancel: () => setModal(null),
      onSaved: handleSaved,
      apiCreate, apiUpdate, apiUploadReceipt
    }),
    h(Toast, { toast })
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App, null));
</script>
