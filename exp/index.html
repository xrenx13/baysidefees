<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>BDD EXP — Bayside Dysphagia Diagnostics</title>
<meta name="theme-color" content="#ffffff" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="BDD EXP" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: { DEFAULT: '#081e3d', 50:'#eef2f7', 100:'#d7e0eb', 700:'#0f2a4e', 900:'#081e3d' },
          teal: { DEFAULT: '#0f766e', 50:'#effaf8', 500:'#0f766e', 600:'#0c5f58' },
          skyblue: { DEFAULT: '#a9c6dc', 100:'#eaf2f7', 300:'#c6dbe8', 500:'#a9c6dc' }
        }
      }
    }
  }
</script>
<style>
  /* ---------- Design tokens (matches the BDD CRM palette) ---------- */
  :root {
    --ink: #182238;
    --muted: #6b7280;
    --faint: #98a2b3;
    --line: #e6e9ef;
    --canvas: #f6f7f9;
    --surface: #ffffff;
    --navy: #0b1f3a;
    --navy-deep: #081e3d;
    --teal: #0f766e;
    --teal-dark: #0c5f58;
    --teal-wash: #eef6f5;
    --danger: #c2413a;
    --warning: #9a6700;
    --good: #0c8a5f;
    --sidebar-w: 224px;
    --topbar-h: 60px;
  }
  * { box-sizing: border-box; }
  html { background: var(--canvas); }
  body { margin:0; font-family:'Inter',sans-serif; background:var(--canvas); color:var(--ink); -webkit-font-smoothing:antialiased; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:#cfd5de; border-radius:999px; }
  ::-webkit-scrollbar-track { background:transparent; }
  button { font-family:inherit; }
  input, select, textarea { font-family:inherit; }

  /* ---------- Login (split brand / auth panel, same pattern as the CRM) ---------- */
  .exp-login-page { min-height:100vh; min-height:100dvh; display:grid; grid-template-columns:minmax(440px,1fr) minmax(400px,.9fr); background:#f5f7f8; color:var(--navy); }
  .exp-login-brand { position:relative; isolation:isolate; overflow:hidden; display:flex; align-items:center; padding:64px clamp(48px,7vw,100px); background:linear-gradient(145deg,#071b36 0%,#0a2949 58%,#0d555b 125%); color:#fff; }
  .exp-login-brand:before { content:''; position:absolute; z-index:-1; width:520px; height:520px; right:-260px; top:-200px; border-radius:50%; border:1px solid rgba(139,211,203,.18); box-shadow:0 0 0 70px rgba(139,211,203,.035),0 0 0 140px rgba(139,211,203,.025); }
  .exp-login-brand:after { content:''; position:absolute; z-index:-1; width:400px; height:400px; left:-220px; bottom:-250px; border-radius:50%; background:rgba(47,151,142,.16); filter:blur(2px); }
  .exp-login-brand-inner { width:min(520px,100%); }
  .exp-login-identity { display:flex; align-items:center; gap:13px; margin-bottom:58px; }
  .exp-login-logo-tile { width:52px; height:52px; flex:0 0 52px; display:flex; align-items:center; justify-content:center; border-radius:14px; background:#fff; color:var(--navy-deep); font-weight:800; font-size:18px; box-shadow:0 12px 32px rgba(0,0,0,.14); }
  .exp-login-company { font-size:14px; font-weight:750; letter-spacing:.01em; }
  .exp-login-product { margin-top:3px; color:#9fc9ca; font-size:12px; font-weight:650; letter-spacing:.08em; text-transform:uppercase; }
  .exp-login-eyebrow { margin-bottom:12px; color:#8dd0c9; font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
  .exp-login-brand h1 { max-width:480px; margin:0; font-size:clamp(34px,3.6vw,50px); font-weight:800; line-height:1.08; letter-spacing:-.02em; }
  .exp-login-lede { max-width:470px; margin:18px 0 26px; color:#c0cfdd; font-size:15.5px; line-height:1.65; }
  .exp-login-benefits { display:grid; gap:12px; margin:0; padding:0; list-style:none; }
  .exp-login-benefits li { display:flex; align-items:center; gap:10px; color:#e2eaf1; font-size:13.5px; font-weight:600; }
  .exp-login-check { width:22px; height:22px; flex:0 0 22px; display:inline-flex; align-items:center; justify-content:center; border:1px solid rgba(141,208,201,.48); border-radius:50%; background:rgba(141,208,201,.1); color:#9ee0d8; font-size:12px; }
  .exp-login-privacy { max-width:470px; margin-top:32px; padding-top:18px; border-top:1px solid rgba(255,255,255,.12); color:#95a9bd; font-size:11.5px; line-height:1.55; }
  .exp-login-auth { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:56px clamp(32px,6vw,80px) 28px; background:linear-gradient(180deg,#fff 0%,#fbfcfd 100%); }
  .exp-login-card { width:min(400px,100%); }
  .exp-login-mobile-logo { display:none; }
  .exp-login-badge { display:inline-flex; align-items:center; gap:7px; margin-bottom:20px; color:#14756e; font-size:11px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; }
  .exp-login-badge:before { content:''; width:8px; height:8px; border-radius:50%; background:#2e9b91; box-shadow:0 0 0 4px #e5f4f2; }
  .exp-login-card h2 { margin:0; color:var(--navy-deep); font-size:32px; font-weight:800; line-height:1.15; letter-spacing:-.02em; }
  .exp-login-auth-copy { margin:12px 0 26px; color:#69778b; font-size:13.5px; line-height:1.6; }
  .exp-login-google-wrap { min-height:52px; display:flex; align-items:center; justify-content:center; padding:8px; border:1px solid #dbe5ed; border-radius:12px; background:#fff; box-shadow:0 2px 8px rgba(8,30,61,.045); }
  .exp-login-status { margin:14px 0 0; text-align:center; color:#718096; font-size:12px; line-height:1.5; }
  .exp-login-status.error { color:var(--danger); }
  .exp-login-assurance { display:flex; align-items:flex-start; gap:9px; margin-top:22px; padding:13px 14px; border:1px solid #dce9e8; border-radius:11px; background:#f3f9f8; color:#53677a; font-size:11.5px; line-height:1.5; }
  .exp-login-lock { color:#1a7f77; font-size:14px; line-height:1.3; }
  .exp-login-help { margin-top:22px; text-align:center; color:#8b96a7; font-size:11px; }
  .exp-login-footer { width:min(400px,100%); margin-top:auto; padding-top:40px; display:flex; justify-content:space-between; gap:16px; color:#9aa4b2; font-size:10.5px; }
  .exp-login-footer a { color:#61768a; text-decoration:none; }
  .exp-login-footer a:hover { color:#16756f; }
  @media (max-width:900px) {
    .exp-login-page { grid-template-columns:1fr; }
    .exp-login-brand { display:none; }
    .exp-login-auth { width:100%; min-height:100vh; min-height:100dvh; padding:40px 20px 24px; }
    .exp-login-card { max-width:400px; margin:0 auto; padding:26px 22px; border:1px solid #dbe5ed; border-radius:16px; background:#fff; box-shadow:0 18px 50px rgba(8,30,61,.1); }
    .exp-login-mobile-logo { display:flex; width:52px; height:52px; margin-bottom:22px; border-radius:14px; background:var(--navy-deep); color:#fff; align-items:center; justify-content:center; font-weight:800; font-size:17px; }
    .exp-login-footer { max-width:400px; margin:22px auto 0; padding-top:0; align-items:center; }
  }

  /* ---------- App chrome: fixed sidebar + top bar ---------- */
  .app-shell { min-height:100vh; }
  .sidebar { position:fixed; inset:0 auto 0 0; width:var(--sidebar-w); background:#fff; border-right:1px solid var(--line); z-index:40; display:flex; flex-direction:column; }
  .sidebar-brand { height:var(--topbar-h); display:flex; align-items:center; gap:10px; padding:0 18px; border-bottom:1px solid var(--line); }
  .sidebar-brand-mark { width:30px; height:30px; border-radius:9px; background:var(--navy-deep); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; padding:5px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); }
  .sidebar-brand-mark img { width:100%; height:100%; object-fit:contain; display:block; }
  .sidebar-brand-title { font-size:13px; line-height:1.15; font-weight:700; color:var(--navy-deep); letter-spacing:-.01em; }
  .sidebar-brand-sub { font-size:10px; line-height:1.2; color:var(--faint); margin-top:2px; }
  /* min-height:0 overrides a flexbox default (a flex item's min-height is
     "auto", i.e. at least its content's height) that would otherwise stop
     this from ever shrinking below the combined height of every nav link,
     the mini calendar, and the tool shortcuts — so on a shorter browser
     viewport (a laptop with a visible, non-auto-hiding macOS Dock is the
     common case) this section couldn't scroll internally, and instead
     pushed the Profile/Sign out row at the bottom of the sidebar off the
     bottom of the screen entirely, with no way to scroll the fixed
     sidebar itself down to reach it. */
  .sidebar-nav { padding:14px 10px; display:flex; flex-direction:column; gap:3px; flex:1; min-height:0; overflow-y:auto; }
  .nav-label { padding:12px 10px 6px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--faint); }
  .nav-btn { width:100%; height:38px; border:0; background:transparent; display:flex; align-items:center; gap:10px; padding:0 10px; border-radius:9px; color:#657084; font-size:13px; font-weight:550; text-align:left; text-decoration:none; cursor:pointer; transition:.15s ease; box-sizing:border-box; }
  .nav-btn:hover { background:#f4f6f8; color:var(--navy-deep); }
  .nav-btn.active { background:var(--teal-wash); color:var(--teal-dark); font-weight:650; }
  .nav-icon { width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center; }
  .nav-icon svg { width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .sidebar-bottom { margin-top:auto; padding:22px 10px 18px; border-top:1px solid var(--line); }
  .profile-row { display:flex; align-items:flex-start; gap:9px; padding:8px 9px; border-radius:10px; }
  .avatar { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#edf1f5; color:var(--navy-deep); font-size:11px; font-weight:700; flex:0 0 30px; }
  .profile-copy { min-width:0; flex:1; }
  .profile-name { font-size:12px; line-height:1.35; font-weight:600; color:#39465a; word-break:break-word; }
  .signout-btn { border:0; background:transparent; color:var(--faint); font-size:11px; cursor:pointer; padding:2px 0; border-radius:6px; }
  .signout-btn:hover { background:#f3f4f6; color:#4b5563; }
  .avatar-btn { border:0; padding:0; cursor:pointer; }

  /* ---------- Sidebar theme toggle + mini calendar ---------- */
  .theme-toggle-btn { width:32px; height:32px; border:0; background:transparent; display:flex; align-items:center; justify-content:center; margin:0 0 8px 8px; border-radius:9px; color:#657084; cursor:pointer; transition:.15s ease; }
  .theme-toggle-btn:hover { background:#f4f6f8; color:var(--navy-deep); }

  .mini-cal { margin:4px 10px 10px; padding:10px 8px; border:1px solid var(--line); border-radius:12px; }
  .mini-cal-head { display:flex; align-items:center; justify-content:space-between; padding:0 2px 6px; }
  .mini-cal-title { font-size:11px; font-weight:700; color:var(--navy-deep); }
  .mini-cal-arrow { border:0; background:transparent; width:20px; height:20px; border-radius:6px; color:var(--faint); font-size:13px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .mini-cal-arrow:hover { background:#f4f6f8; color:var(--navy-deep); }
  .mini-cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .mini-cal-dow { font-size:9px; font-weight:700; text-align:center; color:var(--faint); padding:2px 0 4px; }
  .mini-cal-day { font-size:10.5px; text-align:center; padding:4px 0; border-radius:6px; color:#657084; }
  .mini-cal-day.empty { visibility:hidden; }
  .mini-cal-day.today { background:var(--navy-deep); color:#fff; font-weight:700; }
  .mini-cal-day.has-entry { font-weight:700; color:var(--teal-dark); cursor:pointer; border:0; background:var(--teal-wash); font-family:inherit; }
  .mini-cal-day.has-entry:hover { background:var(--teal); color:#fff; }
  .mini-cal-day.today.has-entry { background:var(--navy-deep); color:#fff; }

  .sidebar.dark { background:var(--navy-deep); border-right-color:rgba(255,255,255,.10); }
  .sidebar.dark .sidebar-brand { border-bottom-color:rgba(255,255,255,.10); }
  .sidebar.dark .sidebar-brand-mark { background:#fff; box-shadow:none; }
  .sidebar.dark .sidebar-brand-title { color:#fff; }
  .sidebar.dark .sidebar-brand-sub { color:#91a4bc; }
  .sidebar.dark .nav-label { color:#7189a6; }
  .sidebar.dark .nav-btn { color:#b7c4d5; }
  .sidebar.dark .nav-btn:hover { background:rgba(255,255,255,.07); color:#fff; }
  .sidebar.dark .nav-btn.active { background:rgba(15,118,110,.28); color:#d7fffa; }
  .sidebar.dark .mini-cal { background:rgba(255,255,255,.045); border-color:rgba(255,255,255,.10); }
  .sidebar.dark .mini-cal-title { color:#e7edf5; }
  .sidebar.dark .mini-cal-arrow { color:#91a4bc; }
  .sidebar.dark .mini-cal-arrow:hover { background:rgba(255,255,255,.08); color:#fff; }
  .sidebar.dark .mini-cal-dow { color:#7189a6; }
  .sidebar.dark .mini-cal-day { color:#b7c4d5; }
  .sidebar.dark .mini-cal-day.has-entry { background:rgba(15,118,110,.3); color:#d7fffa; }
  .sidebar.dark .mini-cal-day.has-entry:hover { background:rgba(15,138,128,.5); color:#fff; }
  .sidebar.dark .mini-cal-day.today { background:var(--teal); color:#fff; }
  .sidebar.dark .sidebar-bottom { border-top-color:rgba(255,255,255,.10); }
  .sidebar.dark .theme-toggle-btn { color:#b7c4d5; }
  .sidebar.dark .theme-toggle-btn:hover { background:rgba(255,255,255,.07); color:#fff; }
  .sidebar.dark .avatar { background:rgba(255,255,255,.12); color:#fff; }
  .sidebar.dark .profile-name { color:#fff; }
  .sidebar.dark .signout-btn { color:#91a4bc; }
  .sidebar.dark .signout-btn:hover { background:rgba(255,255,255,.07); color:#fff; }

  /* ---------- Preferences modal ---------- */
  .pref-row { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:15px; border:1px solid var(--line); border-radius:12px; background:#f7fafb; }
  .pref-copy strong { display:block; font-size:13px; font-weight:650; color:var(--navy-deep); }
  .pref-copy span { display:block; font-size:11.5px; color:var(--muted); margin-top:2px; }
  .pref-switch { position:relative; width:42px; height:24px; flex:0 0 42px; border:0; border-radius:999px; padding:0; background:#cbd5df; cursor:pointer; transition:background .18s ease; }
  .pref-switch:after { content:''; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(8,30,61,.25); transition:transform .18s ease; }
  .pref-switch.on { background:var(--teal); }
  .pref-switch.on:after { transform:translateX(18px); }
  .pref-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .pref-grid label { display:block; font-size:13px; font-weight:650; color:var(--navy-deep); }
  .pref-grid select.input { margin-top:6px; font-weight:700; }
  @media (max-width:520px) { .pref-grid { grid-template-columns:1fr; } }
  .pref-sync { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:13px 15px; border:1px solid var(--line); border-radius:12px; background:#fff; }
  .pref-sync strong { display:block; font-size:13px; font-weight:650; color:var(--navy-deep); }
  .pref-sync span { display:block; font-size:11.5px; color:var(--muted); margin-top:2px; }
  .pref-foot { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .pref-meta { text-align:right; font-size:10.5px; color:var(--faint); line-height:1.5; }

  .main { margin-left:var(--sidebar-w); min-height:100vh; }
  .topbar { position:sticky; top:0; z-index:30; height:var(--topbar-h); display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 24px; background:rgba(246,247,249,.9); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
  .topbar-title { font-size:16px; font-weight:750; color:var(--navy-deep); letter-spacing:-.01em; }
  .topbar-sub { font-size:12px; color:var(--muted); margin-top:1px; }
  .page { padding:24px; max-width:1180px; }
  .history-back { width:34px; height:34px; flex:0 0 34px; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:9px; background:#fff; color:#43556d; font-size:20px; line-height:1; cursor:pointer; box-shadow:0 1px 3px rgba(8,30,61,.04); transition:.15s ease; }
  .history-back:hover { border-color:#c7d5df; background:#f7fafb; color:var(--navy-deep); }
  .history-back:focus-visible { outline:2px solid var(--teal-dark); outline-offset:2px; }
  .hamburger { display:none; }

  .topbar-actions { display:flex; align-items:center; gap:8px; }
  .global-search { position:relative; width:220px; max-width:240px; min-width:0; }
  .global-search input { width:100%; height:34px; border:1px solid var(--line); border-radius:9px; background:#fff; padding:0 34px 0 12px; font-size:12px; color:#0f172a; outline:none; transition:.15s; }
  .global-search input:focus { border-color:#94a3b8; box-shadow:0 0 0 3px rgba(148,163,184,.12); }
  .global-search-icon { position:absolute; right:11px; top:50%; transform:translateY(-50%); color:#94a3b8; font-size:14px; pointer-events:none; }
  .global-search-clear { position:absolute; right:7px; top:50%; transform:translateY(-50%); width:24px; height:24px; display:inline-flex; align-items:center; justify-content:center; border:0; border-radius:7px; background:transparent; color:#7b8797; font-size:18px; line-height:1; cursor:pointer; }
  .global-search-clear:hover { background:#eef3f6; color:var(--navy-deep); }
  .search-results { position:absolute; left:0; right:0; top:40px; max-height:340px; overflow:auto; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 14px 35px rgba(15,23,42,.14); padding:6px; z-index:1200; }
  .search-result { width:100%; text-align:left; border:0; background:transparent; padding:9px 10px; border-radius:8px; cursor:pointer; }
  .search-result:hover { background:var(--teal-wash); }
  .search-result strong { display:block; font-size:12px; color:#0f172a; }
  .search-result span { display:block; margin-top:2px; font-size:11px; color:#64748b; }
  .search-empty { padding:12px 10px; font-size:12px; color:#64748b; }

  @media (max-width:860px) {
    .sidebar { transform:translateX(-100%); transition:transform .2s ease; box-shadow:0 20px 50px rgba(8,30,61,.25); }
    .sidebar.open { transform:translateX(0); }
    .main { margin-left:0; }
    .hamburger { display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:9px; border:1px solid var(--line); background:#fff; }
    .sidebar-scrim { position:fixed; inset:0; background:rgba(8,20,40,.35); z-index:39; }
    .page { padding:16px; }
    .topbar { flex-wrap:wrap; height:auto; min-height:var(--topbar-h); padding:12px 16px; row-gap:10px; }
    .topbar-actions { flex:1 1 100%; flex-wrap:wrap; row-gap:8px; }
    .global-search { flex:1 1 100%; width:auto; max-width:none; }
  }

  /* ---------- Cards, tiles, tables ---------- */
  .card { background:var(--surface); border:1px solid var(--line); border-radius:14px; }
  .card-pad { padding:18px 20px; }
  .card-title { font-size:14px; font-weight:700; color:var(--navy-deep); }
  .card-copy { font-size:12px; color:var(--muted); margin-top:2px; }
  .facility-map-card { overflow:hidden; }
  .facility-map { width:100%; height:280px; }

  .kpi-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
  @media (max-width:960px) { .kpi-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .kpi-tile { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .kpi-tile-clickable { cursor:pointer; transition:.15s ease; }
  .kpi-tile-clickable:hover { border-color:var(--teal); box-shadow:0 2px 10px rgba(15,118,110,.1); }
  .kpi-label { font-size:11.5px; font-weight:650; color:var(--muted); }
  .kpi-value { margin-top:8px; font-size:26px; font-weight:800; color:var(--navy-deep); letter-spacing:-.02em; font-variant-numeric:proportional-nums; }
  .kpi-delta { margin-top:4px; font-size:11.5px; font-weight:650; }
  .kpi-delta.up { color:var(--danger); }
  .kpi-delta.down { color:var(--good); }
  .kpi-delta.flat { color:var(--muted); }

  .bar-row { display:grid; grid-template-columns:150px 1fr 78px; align-items:center; gap:10px; padding:7px 0; }
  .bar-row-label { font-size:12.5px; color:#39465a; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track { position:relative; height:20px; background:#eef1f4; border-radius:6px; overflow:hidden; }
  .bar-fill { position:absolute; inset:0 auto 0 0; height:100%; background:var(--teal); border-radius:6px; min-width:4px; }
  .bar-row-value { font-size:12.5px; font-weight:700; color:var(--navy-deep); text-align:right; font-variant-numeric:tabular-nums; }

  .dash-scroll-list { overflow-y:auto; padding-right:12px; }
  /* Applied only when a list is actually taller than its box (see the
     overflow check in DashboardView) — fades the last ~26px to transparent
     so a row cut off by the scroll boundary trails away instead of being
     chopped off mid-line. */
  .dash-scroll-fade { -webkit-mask-image:linear-gradient(to bottom, #000 calc(100% - 26px), transparent 100%); mask-image:linear-gradient(to bottom, #000 calc(100% - 26px), transparent 100%); }
  .month-chart { display:flex; align-items:flex-end; gap:8px; }
  .month-chart-col { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; height:100%; cursor:default; }
  .month-chart-value { height:15px; margin-bottom:4px; font-size:11px; font-weight:700; color:var(--navy-deep); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .month-chart-track { width:100%; max-width:32px; flex:1 1 auto; display:flex; align-items:flex-end; background:#eef1f4; border-radius:5px 5px 2px 2px; overflow:hidden; }
  .month-chart-fill { width:100%; background:var(--teal); border-radius:5px 5px 0 0; transition:height .2s ease; }
  .month-chart-label { margin-top:7px; font-size:10.5px; font-weight:650; color:var(--faint); }

  .table-wrap { overflow-x:auto; }
  table.data-table { width:100%; border-collapse:collapse; font-size:13px; }
  table.data-table thead { background:var(--teal-wash); }
  table.data-table th { text-align:left; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--faint); padding:10px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.data-table th.sortable { cursor:pointer; user-select:none; transition:.12s ease; }
  table.data-table th.sortable:hover { color:var(--navy-deep); }
  table.data-table th.sort-active { color:var(--teal-dark); background:#dcf1ee; }
  table.data-table td { padding:11px 14px; border-bottom:1px solid #f0f2f5; vertical-align:middle; color:#39465a; }
  table.data-table tbody tr:nth-child(even) { background:#fbfcfd; }
  table.data-table tbody tr:hover { background:var(--teal-wash); cursor:pointer; }
  table.data-table td.num, table.data-table th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .table-summary { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; padding:11px 14px; border-top:1px solid var(--line); background:var(--teal-wash); font-size:12px; color:#5b6b7c; border-radius:0 0 14px 14px; }
  .table-summary strong { color:var(--navy-deep); font-size:13px; }

  .pill { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:650; background:#eef1f4; color:#475467; white-space:nowrap; }
  .pill-teal { background:var(--teal-wash); color:var(--teal-dark); }
  .pill-navy { background:#eef2f7; color:var(--navy-deep); }
  .pill-warn { background:#fff8e8; color:var(--warning); }
  .pill-danger { background:#fdecea; color:var(--danger); }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; height:36px; padding:0 16px; border-radius:9px; font-size:13px; font-weight:650; cursor:pointer; border:1px solid transparent; transition:.15s ease; white-space:nowrap; }
  .btn-primary { background:var(--navy-deep); color:#fff; }
  .btn-primary:hover { background:#0f2a4e; }
  .btn-teal { background:var(--teal); color:#fff; }
  .btn-teal:hover { background:var(--teal-dark); }
  .btn-ghost { background:#fff; color:#39465a; border-color:var(--line); }
  .btn-ghost:hover { background:#f7f8fa; }
  .btn-danger-ghost { background:#fff; color:var(--danger); border-color:#f3d3d0; }
  .btn-danger-ghost:hover { background:#fdecea; }
  .btn:disabled { opacity:.55; cursor:not-allowed; }
  .btn-sm { height:30px; padding:0 12px; font-size:12px; }

  .field { display:flex; flex-direction:column; gap:6px; }
  .field label { font-size:12px; font-weight:650; color:#475467; }
  .input, select.input, textarea.input { width:100%; height:38px; padding:0 12px; border-radius:9px; border:1px solid #d7dde5; background:#fff; font-size:13.5px; color:var(--ink); }
  textarea.input { height:auto; padding:10px 12px; resize:vertical; }

  .field-error { font-size:11px; color:var(--danger); }
  .amount-input-wrap { position:relative; }

  .amount-input-wrap .input { padding-left:24px; }

  .modal-overlay { position:fixed; inset:0; background:rgba(8,20,40,.4); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:60; overflow-y:auto; }
  .modal { width:min(560px,100%); background:#fff; border-radius:16px; box-shadow:0 30px 70px rgba(8,20,40,.3); margin-bottom:5vh; }
  .modal-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:18px 20px; border-bottom:1px solid var(--line); }
  .modal-title { font-size:15px; font-weight:750; color:var(--navy-deep); }
  .modal-close { border:1px solid var(--line); border-radius:8px; background:#fff; color:#526174; font-size:11.5px; font-weight:650; line-height:1; cursor:pointer; padding:7px 12px; transition:.12s ease; }
  .modal-close:hover { background:#f8fafc; color:#334155; border-color:#cbd5e1; }
  .modal-body { padding:20px; display:grid; gap:14px; }
  .modal-foot { display:flex; align-items:center; justify-content:flex-end; gap:10px; padding:16px 20px; border-top:1px solid var(--line); }

  @media print {
    body.printing-tax-summary .app-shell > *:not(.tax-summary-overlay) { display:none !important; }
    body.printing-tax-summary .tax-summary-overlay { position:static !important; inset:auto !important; background:none !important; padding:0 !important; display:block !important; }
    body.printing-tax-summary .tax-summary-overlay .modal { box-shadow:none !important; border:none !important; width:100% !important; max-width:100% !important; margin:0 !important; border-radius:0 !important; }
    body.printing-tax-summary .no-print { display:none !important; }

  .modal-row-2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:520px) { .modal-row-2 { grid-template-columns:1fr; } }

  .receipt-drop { border:1.5px dashed #d7dde5; border-radius:12px; padding:16px; text-align:center; color:var(--muted); font-size:12.5px; cursor:pointer; background:#fbfcfd; }

  .receipt-chip a { color:var(--teal-dark); font-weight:650; text-decoration:none; }

  .empty-state-title { font-size:14px; font-weight:700; color:var(--navy-deep); margin-bottom:6px; }

  .toast { position:fixed; right:20px; bottom:20px; z-index:80; background:var(--navy-deep); color:#fff; padding:11px 16px; border-radius:10px; font-size:13px; font-weight:600; box-shadow:0 14px 30px rgba(8,20,40,.3); }
  .toast.error { background:#7a2b26; }

  .filter-row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .segmented { display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:#fff; }
  .segmented button { display:inline-flex; align-items:center; gap:6px; border:0; background:transparent; padding:7px 13px; font-size:12.5px; font-weight:650; color:#657084; cursor:pointer; transition:.12s ease; }
  .segmented button:hover:not(.active) { background:#f4f6f8; }

  .full-loading { min-height:60vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--muted); font-size:13px; }

  .checkbox-row { display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; color:#475467; }

const LS_PREFIX = 'bdd_exp_';
const CACHE_KEY = LS_PREFIX + 'cache_v1';

// Bumped with each delivered change while actively developing — shown in
// the sidebar footer so it's easy to confirm which build is live. Format:
// YYYY.MM.DD-N, where N resets to 1 at the start of each new day.
const BUILD_NUMBER = '2026.09.18-25';

// =====================================================================
// Small utilities
// =====================================================================
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function parseDate_(s) {
  if (!s) return null;
  const d = new Date(s.length <= 10 ? s + 'T00:00:00' : s);
  return isNaN(d.getTime()) ? null : d;
}
// Unique, non-empty values for a field across a list of rows, most-recently-used
// first (by Date desc) — used to power lightweight <datalist> autocomplete on
// Vendor/location fields without any backend change.
function recentUniqueValues_(rows, field, limit) {
  const sorted = rows.slice().sort((a,b) => (parseDate_(b.Date)||0) - (parseDate_(a.Date)||0));
  const seen = new Set();
  const out = [];
  for (const r of sorted) {
    const v = (r[field] || '').trim();
    if (!v || seen.has(v)) continue;
    seen.add(v);
    out.push(v);
    if (limit && out.length >= limit) break;
  }
  return out;

    if (loginInFlightRef.current) return;

    try {
      const result = await apiPost('verifyGoogleLogin', { idToken: response.credential });
      if (result.success) {
        sessionStorage.setItem(LS_PREFIX + 'user_email', result.result.email);
        sessionStorage.setItem(LS_PREFIX + 'user_name', result.result.name || '');
        sessionStorage.setItem(LS_PREFIX + 'session_token', result.result.sessionToken);
        sessionStorage.setItem(LS_PREFIX + 'unlocked', 'true');

        loginInFlightRef.current = false;
      }

        h('h1', null, 'Track every mileage mile and business expense in one place.'),

        h('div', { className:'exp-login-badge' }, 'BDD EXP'),
        h('h2', null, 'Welcome back'),
        h('p', { className:'exp-login-auth-copy' }, 'Sign in with your authorized Bayside Google account to continue.'),

// Small month calendar shown in the sidebar (matches the CRM's mini
// calendar) — days with a logged expense or mileage entry are highlighted
// and clicking one jumps to the Expenses log.
function MiniCalendar({ expenses, onSelectDay }) {
  const today = new Date();
  const [monthDate, setMonthDate] = useState(() => new Date(today.getFullYear(), today.getMonth(), 1));
  const entryDates = useMemo(() => {
    const set = new Set();
    expenses.forEach(e => { if (e.Date) set.add(String(e.Date).slice(0, 10)); });
    return set;
  }, [expenses]);

  const year = monthDate.getFullYear();
  const month = monthDate.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDay; i += 1) cells.push(null);
  for (let day = 1; day <= daysInMonth; day += 1) cells.push(day);
  while (cells.length % 7) cells.push(null);
  const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;
  const title = monthDate.toLocaleDateString(undefined, { month:'long', year:'numeric' });
  const moveMonth = delta => setMonthDate(new Date(year, month + delta, 1));

  return h('div', { className:'mini-cal', 'aria-label':'Monthly calendar' },
    h('div', { className:'mini-cal-head' },
      h('button', { type:'button', className:'mini-cal-arrow', onClick:() => moveMonth(-1), 'aria-label':'Previous month' }, '‹'),
      h('div', { className:'mini-cal-title' }, title),
      h('button', { type:'button', className:'mini-cal-arrow', onClick:() => moveMonth(1), 'aria-label':'Next month' }, '›')
    ),
    h('div', { className:'mini-cal-grid' },
      ['S','M','T','W','T','F','S'].map((d,i) => h('div', { className:'mini-cal-dow', key:'dow-'+i }, d)),
      cells.map((day, i) => {
        const dateKey = day ? `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}` : '';
        const hasEntry = day && entryDates.has(dateKey);
        const isToday = day && isCurrentMonth && day === today.getDate();
        const className = 'mini-cal-day' + (day == null ? ' empty' : '') + (isToday ? ' today' : '') + (hasEntry ? ' has-entry' : '');
        if (hasEntry) {
          return h('button', { type:'button', key:'day-'+i, className, onClick:() => onSelectDay && onSelectDay(dateKey), title:'View expenses logged on ' + dateKey }, day);
        }
        return h('div', { key:'day-'+i, className }, day || '');
      })
    )
  );
}

// =====================================================================
// Category → color mapping for pills (fixed order, matches dataviz rules)
// =====================================================================
function categoryPillClass(cat) {
  if (cat === 'Mileage') return 'pill-teal';
  if (cat === 'Equipment & Supplies' || cat === 'Office Supplies') return 'pill-navy';
  return 'pill';
}

// =====================================================================
// Shared modal shell — overlay + card + header/footer chrome, used by the
// three separate forms below (Expense, Mileage, Purchase Order) so each of
// those only has to describe its own fields.
// =====================================================================
function ModalShell({ title, onCancel, onSubmit, saving, submitLabel, children }) {
  const body = Array.isArray(children) ? children : [children];
  return h('div', { className:'modal-overlay', onClick: e => { if (e.target === e.currentTarget) onCancel(); } },
    h('form', { className:'modal', onSubmit },
      h('div', { className:'modal-head' },
        h('div', { className:'modal-title' }, title),
        h('button', { type:'button', className:'modal-close', onClick:onCancel }, 'Close')
      ),
      h('div', { className:'modal-body' }, ...body),
      h('div', { className:'modal-foot' },
        h('button', { type:'button', className:'btn btn-ghost', onClick:onCancel, disabled:saving }, 'Cancel'),
        h('button', { type:'submit', className:'btn btn-teal', disabled:saving }, saving ? 'Saving…' : submitLabel)
      )
    )
  );
}

// =====================================================================
// Expense form (create/edit) — general business expenses only. Mileage has
// its own dedicated form (MileageForm, below) so this one only ever shows
// fields that actually apply: no start/end locations, no mileage rate.
// =====================================================================
function ExpenseForm({ initial, presetCategory, categories, paymentMethods, vendorOptions, onCancel, onSaved, apiCreate, apiUpdate, apiUploadReceipt, apiCreateRecurringSub, recurringSubscriptions }) {
  const isEdit = !!(initial && initial.ExpenseId);
  const partOfSubscription = isEdit && !!initial.RecurringTemplateId;
  // The expense row itself only carries a RecurringTemplateId — the actual
  // cadence (IntervalUnit/IntervalCount) lives on the subscription template
  // row, so look that up for the read-only note below rather than reading
  // fields that don't exist on an expense record.
  const linkedTemplate = partOfSubscription
    ? (recurringSubscriptions || []).find(s => s.TemplateId === initial.RecurringTemplateId)
    : null;
  // For a brand-new, non-preset expense, default Category/PaymentMethod to
  // whatever was picked last time — most of Melanie's entries repeat the
  // same category/payment method in a row, so this saves a couple of taps.
  const [form, setForm] = useState(() => {
    const lastCategory = localStorage.getItem(LS_PREFIX+'last_category');
    const lastPayment = localStorage.getItem(LS_PREFIX+'last_payment_method');
    return {
      Date: (initial && initial.Date) || todayStr(),
      Category: (initial && initial.Category) || presetCategory || (lastCategory && categories.includes(lastCategory) ? lastCategory : null) || categories[0] || 'Other',
      Vendor: (initial && initial.Vendor) || '',
      Description: (initial && initial.Description) || '',
      Amount: (initial && initial.Amount) || '',
      PaymentMethod: (initial && initial.PaymentMethod) || (lastPayment && paymentMethods.includes(lastPayment) ? lastPayment : null) || paymentMethods[0] || '',
      Notes: (initial && initial.Notes) || ''
    };
  });
  const [file, setFile] = useState(null);
  const [existingReceipt, setExistingReceipt] = useState(() => (initial && initial.ReceiptFileUrl) ? { name: initial.ReceiptFileName, url: initial.ReceiptFileUrl } : null);
  // Recurring subscriptions: only offered on a brand-new expense (see
  // partOfSubscription above for the read-only note shown when editing one
  // that's already part of a subscription). Checking this creates a
  // RecurringSubscriptions template alongside this one expense so future
  // occurrences generate automatically — see the Subscriptions page.
  const [recurring, setRecurring] = useState(false);
  const [cadence, setCadence] = useState('month');
  const [endMonth, setEndMonth] = useState('');
  const [endYear, setEndYear] = useState(String(new Date().getFullYear()));
  const recurringEndDate = endDateFromMonthYear_(endMonth, endYear);
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState('');

  function set(field, value) { setForm(f => ({ ...f, [field]: value })); }

  async function handleSubmit(e) {
    e.preventDefault();
    setErr('');
    if (!form.Date) return setErr('Date is required.');
    if (!form.Category) return setErr('Category is required.');
    if (!form.Amount || Number(form.Amount) <= 0) return setErr('Enter an amount greater than zero.');
    if (recurring && recurringEndDate && recurringEndDate <= form.Date) return setErr('The end date must be after this first occurrence.');
    setSaving(true);
    try {
      const payload = {
        Date: form.Date,
        Category: form.Category,
        Vendor: form.Vendor,
        Description: form.Description,
        PaymentMethod: form.PaymentMethod,
        Notes: form.Notes,
        Amount: Number(form.Amount),
        Miles: '', MileageRate: '', StartLocation: '', EndLocation: ''
      };
      let expenseId = initial && initial.ExpenseId;
      if (isEdit) {
        await apiUpdate({ ExpenseId: expenseId, ...payload });
      } else {
        if (recurring) {
          // Create the template first so we know its TemplateId, then save
          // this first occurrence already linked to it — see the
          // Subscriptions page for pause/edit/cancel.
          const { unit, count } = intervalFromCadenceClient_(cadence);
          const nextDue = addIntervalClient_(form.Date, unit, count);
          const template = await apiCreateRecurringSub({
            Category: form.Category, Vendor: form.Vendor, Description: form.Description,
            Amount: Number(form.Amount), PaymentMethod: form.PaymentMethod, Notes: form.Notes,
            IntervalUnit: unit, IntervalCount: count,
            StartDate: form.Date,
            NextDueDate: nextDue ? formatDateOnlyClient_(nextDue) : form.Date,
            EndDate: recurringEndDate || '', Active: true
          });
          payload.RecurringTemplateId = template.TemplateId;
        }
        const created = await apiCreate(payload);
        expenseId = created.ExpenseId;
      }
      if (file) {
        const uploadFile = await compressReceiptImage_(file);
        const base64Data = await fileToBase64_(uploadFile);
        const uploaded = await apiUploadReceipt(expenseId, uploadFile.name, uploadFile.type, base64Data);
        await apiUpdate({ ExpenseId: expenseId, ReceiptFileId: uploaded.fileId, ReceiptFileUrl: uploaded.url, ReceiptFileName: uploaded.name });
      }
      localStorage.setItem(LS_PREFIX+'last_category', form.Category);
      localStorage.setItem(LS_PREFIX+'last_payment_method', form.PaymentMethod);
      onSaved({ ExpenseId: expenseId, ...payload });
    } catch (err2) {
      setErr(err2.message || 'Something went wrong saving this expense.');
    }
    setSaving(false);
  }

  return h(ModalShell, {
    title: isEdit ? 'Edit expense' : 'Add expense',
    onCancel, onSubmit: handleSubmit, saving,
    submitLabel: isEdit ? 'Save changes' : 'Add expense'
  },
    err && h('div', { className:'field-error' }, err),
    h('div', { className:'modal-row-2' },
      h('div', { className:'field' },
        h('label', null, 'Date'),
        h('input', { type:'date', className:'input', value:form.Date, onChange:e => set('Date', e.target.value) })
      ),
      h('div', { className:'field' },
        h('label', null, 'Category'),
        h('select', { className:'input', value:form.Category, onChange:e => set('Category', e.target.value) },
          categories.map(c => h('option', { key:c, value:c }, c))
        )
      )
    ),
    h('div', { className:'field' },
      h('label', null, 'Amount'),
      h('div', { className:'amount-input-wrap' },
        h('span', { className:'amount-prefix' }, '$'),
        h('input', { type:'number', min:'0', step:'0.01', className:'input', value:form.Amount, onChange:e => set('Amount', e.target.value), placeholder:'0.00' })
      )
    ),
    h('div', { className:'field' },
      h('label', null, 'Vendor'),
      h('input', { type:'text', className:'input', list:'vendor-options', value:form.Vendor, onChange:e => set('Vendor', e.target.value), placeholder:'e.g. Staples' }),
      vendorOptions && vendorOptions.length > 0 && h('datalist', { id:'vendor-options' }, vendorOptions.map(v => h('option', { key:v, value:v })))
    ),
    h('div', { className:'field' },
      h('label', null, 'Description'),
      h('input', { type:'text', className:'input', value:form.Description, onChange:e => set('Description', e.target.value) })
    ),
    h('div', { className:'modal-row-2' },
      h('div', { className:'field' },
        h('label', null, 'Payment method'),
        h('select', { className:'input', value:form.PaymentMethod, onChange:e => set('PaymentMethod', e.target.value) },
          paymentMethods.map(p => h('option', { key:p, value:p }, p))
        )
      ),
      h('div', { className:'field' },
        h('label', null, 'Notes'),
        h('input', { type:'text', className:'input', value:form.Notes, onChange:e => set('Notes', e.target.value) })
      )
    ),
    h('div', { className:'field' },
      h('label', null, 'Receipt'),
      existingReceipt && !file
        ? h('div', { className:'receipt-chip' },
            h(Icon, { name:'receipt' }),
            h('a', { href:existingReceipt.url, target:'_blank', rel:'noopener noreferrer' }, existingReceipt.name || 'View receipt'),
            h('button', { type:'button', className:'btn btn-ghost btn-sm', style:{ marginLeft:'auto' }, onClick:() => setExistingReceipt(null) }, 'Replace')
          )
        : h('label', { className:'receipt-drop' },
            file ? ('Selected: ' + file.name) : 'Click to attach a photo or PDF of the receipt',
            h('input', { type:'file', accept:'image/*,application/pdf', capture:'environment', style:{ display:'none' }, onChange:e => setFile(e.target.files[0] || null) })
          )
    ),
    partOfSubscription && h('div', { className:'field-hint', style:{ marginTop:'-4px' } },
      'Part of a recurring subscription' + (linkedTemplate ? ' (' + formatInterval_(linkedTemplate.IntervalUnit, linkedTemplate.IntervalCount).toLowerCase() + ')' : '') +
      '. Editing this saves just this one occurrence — manage the subscription itself from the Subscriptions page.'
    ),
    !isEdit && h('div', { className:'field', style:{ borderTop:'1px solid var(--line)', paddingTop:'14px' } },
      h('label', { className:'checkbox-row', style:{ cursor:'pointer' } },
        h('input', { type:'checkbox', checked:recurring, onChange:e => setRecurring(e.target.checked) }),
        'This is a recurring subscription'
      ),
      recurring && h('div', { style:{ marginTop:'12px', display:'grid', gap:'12px' } },
        h('div', { className:'modal-row-2' },
          h('div', { className:'field' },
            h('label', null, 'Repeats every'),
            h('select', { className:'input', value:cadence, onChange:e => setCadence(e.target.value) },
              RECURRING_CADENCES.map(c => h('option', { key:c.value, value:c.value }, c.label))
            )
          ),
          h('div', { className:'field' },
            h('label', null, 'Ends on (optional)'),
            h('div', { style:{ display:'flex', gap:'8px' } },
              h('select', { className:'input', value:endMonth, onChange:e => setEndMonth(e.target.value) },
                END_DATE_MONTH_OPTIONS.map(m => h('option', { key:m.value, value:m.value }, m.label))
              ),
              endMonth && h('select', { className:'input', style:{ width:'90px', flex:'0 0 auto' }, value:endYear, onChange:e => setEndYear(e.target.value) },
                endDateYearOptions_().map(y => h('option', { key:y, value:y }, y))
              )
            )
          )
        ),
        (() => {
          const { unit, count } = intervalFromCadenceClient_(cadence);
          const preview = addIntervalClient_(form.Date, unit, count);
          return h('div', { className:'field-hint' },
            'This one is added now. The next occurrence — ' + formatInterval_(unit, count).toLowerCase() + ' — is added automatically on ' +
            (preview ? formatDate(formatDateOnlyClient_(preview)) : 'the next due date') +
            (recurringEndDate ? ', through ' + formatDate(recurringEndDate) + '.' : ', with no end date (pause or cancel any time from the Subscriptions page).')
          );
        })()
      )
    )
  );
}

// =====================================================================
// Mileage form (create/edit) — its own dedicated modal, separate from
// ExpenseForm above. No payment method, no receipt, no category picker
// (always Mileage) — just what a drive actually needs.
// =====================================================================
function MileageForm({ initial, defaultMileageRate, purposeOptions, endLocationOptions, facilityOptions, onCancel, onSaved, apiCreate, apiUpdate }) {
  const isEdit = !!(initial && initial.ExpenseId);
  const [form, setForm] = useState(() => ({
    Date: (initial && initial.Date) || todayStr(),
    Vendor: (initial && initial.Vendor) || '',
    FacilityName: (initial && initial.FacilityName) || '',
    Notes: (initial && initial.Notes) || '',
    Miles: (initial && initial.Miles) || '',
    MileageRate: (initial && initial.MileageRate) || defaultMileageRate,
    StartLocation: (initial && initial.StartLocation) || SAVED_START_LOCATIONS[0].address,
    EndLocation: (initial && initial.EndLocation) || ''
  }));
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState('');
  const [roundTrip, setRoundTrip] = useState(false);
  const [calculating, setCalculating] = useState(false);
  const startInputRef = useRef(null);
  const endInputRef = useRef(null);
  const hasMapsKey = GOOGLE_MAPS_BROWSER_API_KEY && GOOGLE_MAPS_BROWSER_API_KEY.indexOf('PASTE_YOUR') !== 0;
  const computedAmount = Number(form.Miles || 0) * Number(form.MileageRate || 0);
  // True when the Start location isn't one of the three saved bases — that's
  // when the free-text (autocomplete) input is shown at all.
  const isCustomStart = !SAVED_START_LOCATIONS.some(loc => loc.address === form.StartLocation);

  function set(field, value) { setForm(f => ({ ...f, [field]: value })); }

  useEffect(() => {
    if (!hasMapsKey) return;
    let cancelled = false;
    loadGoogleMaps(GOOGLE_MAPS_BROWSER_API_KEY).then(google => {
      if (cancelled) return;
      if (startInputRef.current && !startInputRef.current._bddAutocomplete) {
        const ac = new google.maps.places.Autocomplete(startInputRef.current, { fields:['formatted_address'] });
        ac.addListener('place_changed', () => {
          const place = ac.getPlace();
          set('StartLocation', (place && place.formatted_address) || startInputRef.current.value);
        });
        startInputRef.current._bddAutocomplete = ac;
      }
      if (endInputRef.current && !endInputRef.current._bddAutocomplete) {
        const ac2 = new google.maps.places.Autocomplete(endInputRef.current, { fields:['formatted_address'] });
        ac2.addListener('place_changed', () => {
          const place = ac2.getPlace();
          set('EndLocation', (place && place.formatted_address) || endInputRef.current.value);
        });
        endInputRef.current._bddAutocomplete = ac2;
      }
    }).catch(() => {});
    return () => { cancelled = true; };
  }, [hasMapsKey, isCustomStart]);

  async function calculateDistance() {
    setErr('');
    if (!form.StartLocation || !form.EndLocation) { setErr('Enter both a start and end location first.'); return; }
    if (!window.google || !window.google.maps) { setErr('Google Maps is still loading — try again in a moment.'); return; }
    setCalculating(true);
    try {
      const service = new google.maps.DistanceMatrixService();
      const response = await new Promise((resolve, reject) => {
        service.getDistanceMatrix({
          origins: [form.StartLocation],
          destinations: [form.EndLocation],
          travelMode: google.maps.TravelMode.DRIVING,
          unitSystem: google.maps.UnitSystem.IMPERIAL
        }, (result, status) => {
          if (status === 'OK') resolve(result); else reject(new Error('Could not calculate a route between those two locations.'));
        });
      });
      const element = response.rows[0] && response.rows[0].elements[0];
      if (!element || element.status !== 'OK') throw new Error('Could not calculate a route between those two locations.');
      const oneWayMiles = element.distance.value / 1609.344;
      set('Miles', (roundTrip ? oneWayMiles * 2 : oneWayMiles).toFixed(1));
    } catch (e) {
      setErr(e.message || 'Could not calculate mileage.');
    }
    setCalculating(false);
  }

  async function handleSubmit(e) {
    e.preventDefault();
    setErr('');
    if (!form.Date) return setErr('Date is required.');
    if (!form.Miles || Number(form.Miles) <= 0) return setErr('Enter the number of miles.');
    setSaving(true);
    try {
      const payload = {
        Date: form.Date,
        Category: 'Mileage',
        Vendor: form.Vendor,
        Description: '',
        PaymentMethod: '',
        Notes: form.Notes,
        Amount: computedAmount,
        Miles: Number(form.Miles),
        MileageRate: Number(form.MileageRate),
        StartLocation: form.StartLocation,
        EndLocation: form.EndLocation,
        FacilityName: form.FacilityName
      };
      if (isEdit) {
        await apiUpdate({ ExpenseId: initial.ExpenseId, ...payload });
      } else {
        await apiCreate(payload);
      }
      onSaved();
    } catch (err2) {
      setErr(err2.message || 'Something went wrong saving this mileage entry.');
    }
    setSaving(false);
  }

  return h(ModalShell, {
    title: isEdit ? 'Edit mileage' : 'Add mileage',
    onCancel, onSubmit: handleSubmit, saving,
    submitLabel: isEdit ? 'Save changes' : 'Add mileage'
  },
    err && h('div', { className:'field-error' }, err),
    h('div', { className:'field' },
      h('label', null, 'Date'),
      h('input', { type:'date', className:'input', value:form.Date, onChange:e => set('Date', e.target.value) })
    ),
    h('div', { className:'field' },
      h('label', null, 'Start location'),
      h('select', {
        className:'input',
        value: isCustomStart ? '__custom__' : form.StartLocation,
        onChange: e => set('StartLocation', e.target.value === '__custom__' ? '' : e.target.value)
      },
        SAVED_START_LOCATIONS.map(loc => h('option', { key:loc.label, value:loc.address }, loc.label)),
        h('option', { value:'__custom__' }, 'Other (type an address)')
      ),
      isCustomStart && h('input', { type:'text', className:'input', list:'end-location-options', style:{ marginTop:'6px' }, ref:startInputRef, value:form.StartLocation, onChange:e => set('StartLocation', e.target.value), placeholder:'Type or search an address' })
    ),
    h('div', { className:'field' },
      h('label', null, 'End location'),
      h('input', { type:'text', className:'input', list:'end-location-options', ref:endInputRef, value:form.EndLocation, onChange:e => set('EndLocation', e.target.value), placeholder:'e.g. Cape Cod Hospital, Hyannis, MA' }),
      endLocationOptions && endLocationOptions.length > 0 && h('datalist', { id:'end-location-options' }, endLocationOptions.map(v => h('option', { key:v, value:v })))
    ),
    h('div', { className:'field' },
      h('label', null, 'Facility name'),
      // A type-to-search field, not a dropdown: with dozens of CRM accounts,
      // scrolling a <select> to find one is slow, and there's no separate
      // "region" field in the CRM to pre-filter by. A text input backed by
      // a <datalist> narrows the list to matches as you type (e.g. typing
      // "hyannis" surfaces every facility with that in its name) while
      // still letting you type a facility that isn't in the CRM at all —
      // which also naturally covers a saved entry whose facility was since
      // renamed or removed there, with no special-case option needed.
      h('input', { type:'text', className:'input', list:'facility-options', value:form.FacilityName, onChange:e => set('FacilityName', e.target.value), placeholder:'Start typing to search facilities…' }),
      (facilityOptions && facilityOptions.length > 0)
        ? h('datalist', { id:'facility-options' }, facilityOptions.map(v => h('option', { key:v, value:v })))
        : h('span', { className:'field-hint' }, 'Facility list from the CRM isn’t available right now — typed in as free text for now.')
    ),
    h('div', { style:{ display:'flex', alignItems:'center', gap:'14px', flexWrap:'wrap' } },

  const [saving, setSaving] = useState(false);
  const [generatingPo, setGeneratingPo] = useState(false);
  const [err, setErr] = useState('');

  function set(field, value) { setForm(f => ({ ...f, [field]: value })); }

    setGeneratingPo(true);

  return h(ModalShell, {

const EXPENSE_COLUMNS = [
  { key:'Date', label:'Date', getValue:r => { const d = parseDate_(r.Date); return d ? d.getTime() : 0; } },
  { key:'Category', label:'Category', getValue:r => r.Category || '' },
  { key:'Vendor', label:'Vendor / Purpose', getValue:r => r.Vendor || '' },
  { key:'PaymentMethod', label:'Payment', getValue:r => r.PaymentMethod || '' },
  { key:'Amount', label:'Amount', num:true, getValue:r => Number(r.Amount) || 0 },
  { key:'Receipt', label:'Receipt', getValue:r => r.ReceiptFileUrl ? 1 : 0 },
];

function ExpensesView({ expenses, categories, onEdit, onDuplicate, onDelete, quickFilter, onClearQuickFilter }) {
  const [search, setSearch] = useState('');
  const [categoryFilter, setCategoryFilter] = useState('All');
  const restoredSortRef = useRef((() => { try { return JSON.parse(sessionStorage.getItem(LS_PREFIX+'expenses_table_sort')||'{}')||{}; } catch(_) { return {}; } })());
  const [sortCol, setSortCol] = useState(() => restoredSortRef.current.sortCol || 'Date');
  const [sortDir, setSortDir] = useState(() => restoredSortRef.current.sortDir === 'asc' ? 'asc' : 'desc');
  useEffect(() => sessionStorage.setItem(LS_PREFIX+'expenses_table_sort', JSON.stringify({ sortCol, sortDir })), [sortCol, sortDir]);
  function toggleSort(col) {
    if (sortCol === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortCol(col); setSortDir('asc'); }
  }

  // A quick filter arrives from elsewhere (right now: the Dashboard's
  // "Missing receipts (YTD)" tile) rather than being a filter you set here.
  // It's scoped to this one visit to the page — leaving Expenses clears it —
  // so coming back later via the nav shows everything again, not a stale
  // filter from three visits ago.
  useEffect(() => () => { if (onClearQuickFilter) onClearQuickFilter(); }, []);

  const filtered = useMemo(() => {
    let rows = expenses.slice();
    if (categoryFilter !== 'All') rows = rows.filter(r => r.Category === categoryFilter);
    if (quickFilter === 'missingReceiptsYtd') {
      const yearStart = new Date(new Date().getFullYear(), 0, 1);
      rows = rows.filter(r => r.Category !== 'Mileage' && !r.ReceiptFileUrl && (parseDate_(r.Date)||0) >= yearStart);
    }
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      rows = rows.filter(r => (r.Vendor||'').toLowerCase().includes(q) || (r.Description||'').toLowerCase().includes(q) || (r.Notes||'').toLowerCase().includes(q));
    }
    const col = EXPENSE_COLUMNS.find(c => c.key === sortCol) || EXPENSE_COLUMNS[0];
    rows.sort((a,b) => { const cmp = compareForSort_(col.getValue(a), col.getValue(b)); return sortDir === 'asc' ? cmp : -cmp; });
    return rows;
  }, [expenses, categoryFilter, quickFilter, search, sortCol, sortDir]);

  function exportCsv() {
    const headers = ['Date','Category','Vendor','Description','Amount','PaymentMethod','Miles','MileageRate','StartLocation','EndLocation','Notes'];
    const rows = filtered.map(r => headers.map(hd => r[hd] === undefined || r[hd] === null ? '' : r[hd]));
    downloadCsv_('bdd-exp-expenses-' + todayStr() + '.csv', headers, rows);
  }

  return h('div', null,
    h('div', { className:'filter-row', style:{ marginBottom:'16px', justifyContent:'space-between' } },
      h('div', { className:'filter-row' },
        h('input', { type:'text', className:'input', style:{ width:'220px' }, placeholder:'Search vendor, description…', value:search, onChange:e => setSearch(e.target.value) }),
        h('select', { className:'input', style:{ width:'190px' }, value:categoryFilter, onChange:e => setCategoryFilter(e.target.value) },
          h('option', { value:'All' }, 'All categories'),
          categories.map(c => h('option', { key:c, value:c }, c))
        )
      ),
      h('button', { type:'button', className:'btn btn-ghost', onClick:exportCsv }, 'Export CSV')
    ),
    quickFilter === 'missingReceiptsYtd' && h('div', { className:'filter-row', style:{ marginBottom:'14px' } },
      h('span', { className:'pill pill-teal' }, 'Missing receipts · year to date'),
      h('button', { type:'button', className:'btn btn-ghost btn-sm', onClick:onClearQuickFilter }, 'Clear filter')
    ),
    h('div', { className:'card table-wrap' },
      filtered.length === 0
        ? h('div', { className:'empty-state' },
            h('div', { className:'empty-state-title' }, quickFilter === 'missingReceiptsYtd' ? 'No missing receipts' : 'No expenses yet'),
            h('p', null, quickFilter === 'missingReceiptsYtd' ? 'Every expense logged this year already has a receipt attached.' : 'Add your first expense to start tracking spend.')
          )
        : h(React.Fragment, null,
            h('table', { className:'data-table' },
              h('thead', null, h('tr', null,
                EXPENSE_COLUMNS.map(col => h('th', {
                  key:col.key,
                  className:(col.num ? 'num ' : '') + 'sortable' + (sortCol === col.key ? ' sort-active' : ''),
                  onClick:() => toggleSort(col.key)
                }, col.label + sortArrow_(sortCol === col.key, sortDir))),
                h('th', null, '')
              )),
              h('tbody', null, filtered.map(r => h('tr', { key:r.ExpenseId, onClick:() => onEdit(r) },
                h('td', null, formatDate(r.Date)),
                h('td', null, h('span', { className:'pill ' + categoryPillClass(r.Category) }, r.Category)),
                h('td', null, r.Vendor || '—'),
                h('td', null, r.PaymentMethod || '—'),
                h('td', { className:'num' }, formatCurrency(r.Amount)),
                h('td', null, r.ReceiptFileUrl ? h('a', { href:r.ReceiptFileUrl, target:'_blank', rel:'noopener noreferrer', style:{ color:'var(--teal-dark)', display:'inline-flex' }, onClick:e => e.stopPropagation() }, h(Icon,{name:'receipt'})) : '—'),
                h('td', { style:{ textAlign:'right' } },
                  h('div', { style:{ display:'flex', alignItems:'center', justifyContent:'flex-end', gap:'6px' } },
                    h('button', { type:'button', className:'btn btn-ghost btn-sm', title:'Duplicate', onClick:e => { e.stopPropagation(); onDuplicate(r); } }, h(Icon,{name:'duplicate'})),
                    h('button', { type:'button', className:'btn btn-danger-ghost btn-sm', onClick:e => { e.stopPropagation(); onDelete(r); } }, h(Icon,{name:'trash'}))
                  )
                )
              )))
            ),
            h('div', { className:'table-summary' },
              h('span', null, 'Expenses log'),
              h('span', null, h('strong', null, filtered.length + (filtered.length === 1 ? ' expense' : ' expenses')))
