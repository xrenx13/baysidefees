// =====================================================================
// Facility map — one pin per distinct place you've driven to (bigger pin
// = more visits). Click a pin to see its visit count/mileage and jump to
// its drives in Table view. Geocoding results are cached in localStorage
// — addresses don't move, so this only ever looks a destination up once,
// not on every page load.
// =====================================================================
const GEOCODE_CACHE_KEY = LS_PREFIX + 'geocode_cache_v1';
function readGeocodeCache_() {
  try { return JSON.parse(localStorage.getItem(GEOCODE_CACHE_KEY) || '{}') || {}; } catch (e) { return {}; }
}
function writeGeocodeCache_(cache) {
  try { localStorage.setItem(GEOCODE_CACHE_KEY, JSON.stringify(cache)); } catch (e) {}
}
function markerIcon_(google, visits, maxVisits, isSelected) {
  return {
    path: google.maps.SymbolPath.CIRCLE,
    scale: 7 + (visits / (maxVisits || 1)) * 13,
    fillColor: isSelected ? '#0c5f58' : '#0f766e',
    fillOpacity: isSelected ? 1 : 0.82,
    strokeColor: '#ffffff',
    strokeWeight: 2
  };
}
function escapeHtml_(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function FacilityMap({ facilities, selectedFacility, onSelectFacility, onViewDrives, heightPx }) {
  const mapElRef = useRef(null);
  const mapObjRef = useRef(null);
  const infoWindowRef = useRef(null);
  const markersRef = useRef([]); // [{ key, marker }]
  const firstFitRef = useRef(false);
  const [mapsError, setMapsError] = useState('');
  const hasMapsKey = GOOGLE_MAPS_BROWSER_API_KEY && GOOGLE_MAPS_BROWSER_API_KEY.indexOf('PASTE_YOUR') !== 0;

  useEffect(() => {
    if (!hasMapsKey || !mapElRef.current || facilities.length === 0) return;
    let cancelled = false;
    setMapsError('');
    loadGoogleMaps(GOOGLE_MAPS_BROWSER_API_KEY).then(google => {
      if (cancelled) return;
      if (!mapObjRef.current) {
        mapObjRef.current = new google.maps.Map(mapElRef.current, {
          center: { lat: 41.7, lng: -70.3 }, // Cape Cod/South Shore — a reasonable start before pins fit the view
          zoom: 9,
          disableDefaultUI: true,
          zoomControl: true,
          gestureHandling: 'greedy'
        });
      }
      const map = mapObjRef.current;
      if (!infoWindowRef.current) infoWindowRef.current = new google.maps.InfoWindow();
      markersRef.current.forEach(({ marker }) => marker.setMap(null));
      markersRef.current = [];

      // Uses the Places API's "Find Place" lookup rather than the separate
      // Geocoding API — Places is already enabled and working (it's what
      // powers the autocomplete on this same form), so this avoids needing
      // yet another Google Cloud API turned on just for this map.
      const placesService = new google.maps.places.PlacesService(map);
      const cache = readGeocodeCache_();
      const bounds = new google.maps.LatLngBounds();
      const maxVisits = Math.max.apply(null, facilities.map(f => f.visits)) || 1;
      let pending = facilities.length;
      let cacheDirty = false;
      let failures = 0;
      let lastFailureStatus = '';

      function finishOne(failed, status) {
        if (failed) { failures += 1; lastFailureStatus = status || lastFailureStatus; }
        pending -= 1;
        if (pending !== 0) return;
        if (!bounds.isEmpty() && !firstFitRef.current) {
          map.fitBounds(bounds, 48);
          firstFitRef.current = true;
        }
        if (cancelled) return;
        if (bounds.isEmpty() && failures > 0) {
          // Every lookup failed. This uses the same Places API the
          // autocomplete on this form already relies on, so REQUEST_DENIED
          // here most likely means this specific browser key's API
          // restrictions don't include Places, or ZERO_RESULTS means none
          // of the saved facility names/end locations matched a real place.
          setMapsError(
            'Couldn’t place any locations on the map (Google returned "' + lastFailureStatus + '"). ' +
            (lastFailureStatus === 'REQUEST_DENIED'
              ? 'In Google Cloud Console, check that this browser key’s API restrictions include the "Places API" — the same one the autocomplete fields on this form use.'
              : lastFailureStatus === 'OVER_QUERY_LIMIT'
                ? 'This usually clears on its own — try again in a bit, or check billing/quota on the Google Maps key.'
                : 'Double-check the facility names/end locations are real, findable places.')
          );
        } else if (failures > 0) {
          setMapsError(failures + ' of ' + facilities.length + ' location' + (facilities.length === 1 ? '' : 's') + ' couldn’t be placed on the map (' + lastFailureStatus + ').');
        }
      }
      function placeMarker(facility, location) {
        if (cancelled) return;
        const isSelected = selectedFacility === facility.key;
        const marker = new google.maps.Marker({
          position: location,
          map,
          title: facility.key + ' — ' + facility.visits + (facility.visits === 1 ? ' visit' : ' visits') + ', ' + facility.miles.toLocaleString(undefined,{maximumFractionDigits:1}) + ' mi',
          icon: markerIcon_(google, facility.visits, maxVisits, isSelected),
          zIndex: isSelected ? 999 : undefined
        });
        marker.addListener('click', () => {
          onSelectFacility(facility.key);
          const btnId = 'facility-view-drives-btn';
          const html =
            '<div style="font-family:Inter,sans-serif;min-width:170px;">' +
              '<div style="font-size:12.5px;font-weight:750;color:#0f172a;margin-bottom:3px;">' + escapeHtml_(facility.key) + '</div>' +
              '<div style="font-size:11px;font-weight:600;color:#64748b;margin-bottom:8px;">' +
                facility.visits + (facility.visits === 1 ? ' visit' : ' visits') + ' · ' + facility.miles.toLocaleString(undefined,{maximumFractionDigits:1}) + ' mi' +
              '</div>' +
              '<button id="' + btnId + '" type="button" style="border:1px solid #0f766e;background:#0f766e;color:#fff;border-radius:7px;padding:6px 11px;font-size:11.5px;font-weight:650;cursor:pointer;">View drives →</button>' +
            '</div>';
          infoWindowRef.current.setContent(html);
          infoWindowRef.current.open(map, marker);
          google.maps.event.addListenerOnce(infoWindowRef.current, 'domready', () => {
            const btn = document.getElementById(btnId);
            if (btn) btn.onclick = () => onViewDrives(facility.key);
          });
        });
        markersRef.current.push({ key: facility.key, marker });
        bounds.extend(location);
        finishOne(false);
      }

      facilities.forEach(facility => {
        const cached = cache[facility.address];
        if (cached) { placeMarker(facility, cached); return; }
        placesService.findPlaceFromQuery({ query: facility.address, fields: ['geometry'] }, (results, status) => {
          if (cancelled) return;
          if (status === google.maps.places.PlacesServiceStatus.OK && results && results[0] && results[0].geometry) {
            const loc = { lat: results[0].geometry.location.lat(), lng: results[0].geometry.location.lng() };
            cache[facility.address] = loc;
            cacheDirty = true;
            placeMarker(facility, loc);
          } else {
            finishOne(true, status);
          }
          if (cacheDirty) writeGeocodeCache_(cache);
        });
      });
    }).catch(err => setMapsError(err.message || 'Could not load Google Maps.'));
    return () => { cancelled = true; };
  }, [facilities, hasMapsKey]);

  // Recolor/resize markers when the selection changes, without re-geocoding.
  useEffect(() => {
    if (!window.google || !window.google.maps) return;
    const maxVisits = Math.max.apply(null, facilities.map(f => f.visits)) || 1;
    markersRef.current.forEach(({ key, marker }) => {
      const facility = facilities.find(f => f.key === key);
      if (!facility) return;
      const isSelected = selectedFacility === key;
      marker.setIcon(markerIcon_(window.google, facility.visits, maxVisits, isSelected));
      marker.setZIndex(isSelected ? 999 : undefined);
    });
  }, [selectedFacility, facilities]);

  if (!hasMapsKey) {
    return h('div', { className:'card card-pad', style:{ marginBottom:'18px' } },
      h('div', { className:'card-title' }, 'Facility map'),
      h('p', { className:'card-copy' }, 'Add a Google Maps API key in index.html to see a map of the facilities you’ve driven to.')
    );
  }
  if (facilities.length === 0) return null;
  return h('div', { className:'card facility-map-card', style:{ marginBottom:'18px' } },
    h('div', { ref:mapElRef, className:'facility-map', style:{ height:(heightPx || 280) + 'px' } }),
    mapsError && h('div', { className:'field-error', style:{ margin:'10px 14px' } }, mapsError)
  );
}

// =====================================================================
// Mileage view — same data, filtered to Category === 'Mileage'
// =====================================================================
function MileageView({ expenses, onEdit, onDelete, onDuplicate }) {
  const rows = useMemo(() => expenses.filter(e => e.Category === 'Mileage').sort((a,b) => (parseDate_(b.Date)||0) - (parseDate_(a.Date)||0)), [expenses]);
  const totalMiles = rows.reduce((s,r) => s + (Number(r.Miles)||0), 0);
  const totalAmount = rows.reduce((s,r) => s + (Number(r.Amount)||0), 0);

  // Group drives by destination (preferring the CRM facility name — the
  // more meaningful identity — and falling back to the raw End location)
  // so the map can show one pin per place, sized by how often you've been.
  const facilities = useMemo(() => {
    const map = new Map();
    rows.forEach(r => {
      const key = (r.FacilityName || r.EndLocation || '').trim();
      if (!key) return;
      const address = r.EndLocation || r.FacilityName;
      if (!map.has(key)) map.set(key, { key, address, visits:0, miles:0 });
      const entry = map.get(key);
      entry.visits += 1;
      entry.miles += Number(r.Miles) || 0;
    });
    return Array.from(map.values()).sort((a,b) => b.visits - a.visits).slice(0, 40);
  }, [rows]);

  const [selectedFacility, setSelectedFacility] = useState(null);
  useEffect(() => {
    if (selectedFacility && !facilities.some(f => f.key === selectedFacility)) setSelectedFacility(null);
  }, [facilities, selectedFacility]);

  // Table / Map toggle — same idea as the CRM's Accounts view toggle.
  // Remembered per browser tab so switching pages and coming back doesn't
  // reset it.
  const [viewMode, setViewMode] = useState(() => {
    const saved = sessionStorage.getItem(LS_PREFIX + 'mileage_view_mode');
    return saved === 'map' ? 'map' : 'table';
  });
  useEffect(() => { sessionStorage.setItem(LS_PREFIX + 'mileage_view_mode', viewMode); }, [viewMode]);
  function viewDrivesForFacility(key) {
    setSelectedFacility(key);
    setViewMode('table');
  }

  const [search, setSearch] = useState('');
  const visibleRows = useMemo(() => {
    let list = selectedFacility
      ? rows.filter(r => (r.FacilityName || r.EndLocation || '').trim() === selectedFacility)
      : rows;
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      list = list.filter(r =>
        (r.Vendor || '').toLowerCase().includes(q) ||
        (r.FacilityName || '').toLowerCase().includes(q) ||
        (r.StartLocation || '').toLowerCase().includes(q) ||
        (r.EndLocation || '').toLowerCase().includes(q) ||
        (r.Notes || '').toLowerCase().includes(q)
      );
    }
    return list;
  }, [rows, selectedFacility, search]);
  const selectedStats = selectedFacility ? facilities.find(f => f.key === selectedFacility) : null;

  function exportCsv() {
    const headers = ['Date','Vendor','FacilityName','StartLocation','EndLocation','Miles','MileageRate','Amount','Notes'];
    const csvRows = visibleRows.map(r => headers.map(hd => r[hd] === undefined || r[hd] === null ? '' : r[hd]));
    downloadCsv_('bdd-exp-mileage-' + todayStr() + '.csv', headers, csvRows);
  }

  return h('div', null,
    h('div', { className:'kpi-grid', style:{ marginBottom:'18px', gridTemplateColumns:'repeat(2,minmax(0,1fr))' } },
      h('div', { className:'kpi-tile' }, h('div', { className:'kpi-label' }, 'Total miles logged'), h('div', { className:'kpi-value' }, totalMiles.toLocaleString(undefined,{maximumFractionDigits:1}))),
      h('div', { className:'kpi-tile' }, h('div', { className:'kpi-label' }, 'Total mileage reimbursement'), h('div', { className:'kpi-value' }, formatCurrency(totalAmount)))
    ),
    h('div', { className:'filter-row', style:{ marginBottom:'14px', justifyContent: viewMode === 'table' ? 'space-between' : 'flex-end', flexWrap:'wrap', gap:'10px' } },
      viewMode === 'table' && h('input', { type:'text', className:'input', style:{ width:'220px' }, placeholder:'Search purpose, facility, notes…', value:search, onChange:e => setSearch(e.target.value) }),
      h('div', { className:'filter-row', style:{ gap:'8px' } },
        viewMode === 'table' && rows.length > 0 && h('button', { type:'button', className:'btn btn-teal btn-sm', onClick:() => onDuplicate(rows[0]) }, h(Icon,{name:'duplicate'}), 'Repeat last drive'),
        viewMode === 'table' && visibleRows.length > 0 && h('button', { type:'button', className:'btn btn-ghost', onClick:exportCsv }, 'Export CSV'),
        h('div', { className:'segmented' },
          h('button', { type:'button', className:viewMode === 'table' ? 'active' : '', onClick:() => setViewMode('table') }, h(Icon,{name:'expenses'}), 'Table'),
          h('button', { type:'button', className:viewMode === 'map' ? 'active' : '', onClick:() => setViewMode('map') }, h(Icon,{name:'mileage'}), 'Map')
        )
      )
    ),
    viewMode === 'map'
      ? h(FacilityMap, { facilities, selectedFacility, onSelectFacility:setSelectedFacility, onViewDrives:viewDrivesForFacility, heightPx:480 })
      : h(React.Fragment, null,
    selectedStats && h('div', { className:'filter-row', style:{ marginBottom:'14px' } },
      h('span', { className:'pill pill-teal' }, selectedStats.key + ' · ' + selectedStats.visits + (selectedStats.visits === 1 ? ' visit' : ' visits') + ' · ' + selectedStats.miles.toLocaleString(undefined,{maximumFractionDigits:1}) + ' mi'),
      h('button', { type:'button', className:'btn btn-ghost btn-sm', onClick:() => setSelectedFacility(null) }, 'Clear filter')
    ),
    h('div', { className:'card table-wrap' },
      visibleRows.length === 0
        ? h('div', { className:'empty-state' },
            h('div', { className:'empty-state-title' }, rows.length === 0 ? 'No mileage logged yet' : search.trim() ? 'No drives match your search' : 'No drives to this facility'),
            h('p', null, rows.length === 0 ? 'Use "Add Mileage" at the top to log a drive.' : search.trim() ? 'Try a different search term.' : 'Click "Clear filter" above to see everything again.')
          )
        : h('table', { className:'data-table' },
            h('thead', null, h('tr', null, h('th', null,'Date'), h('th', null,'Purpose'), h('th', null,'Facility'), h('th', null,'From'), h('th', null,'To'), h('th', {className:'num'}, 'Miles'), h('th', {className:'num'}, 'Amount'), h('th', null, ''))),
            h('tbody', null, visibleRows.map(r => h('tr', { key:r.ExpenseId, onClick:() => onEdit(r) },
              h('td', null, formatDate(r.Date)),
              h('td', null, r.Vendor || '—'),
              h('td', null, r.FacilityName || '—'),
              h('td', null, extractTown_(r.StartLocation) || '—'),
              h('td', null, extractTown_(r.EndLocation) || '—'),
              h('td', { className:'num' }, Number(r.Miles||0).toLocaleString(undefined,{maximumFractionDigits:1})),
              h('td', { className:'num' }, formatCurrency(r.Amount)),
              h('td', { style:{ textAlign:'right' } }, h('button', { type:'button', className:'btn btn-danger-ghost btn-sm', onClick:e => { e.stopPropagation(); onDelete(r); } }, h(Icon,{name:'trash'})))
            )))
          )
    )
    )
  );
}

// =====================================================================
// Dashboard — KPI tiles + spend-by-category bars + recent activity
// =====================================================================
function DashboardView({ expenses, setView, onMissingReceiptsClick }) {
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const yearStart = new Date(now.getFullYear(), 0, 1);
  const lastMonthStart = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const lastMonthEnd = new Date(now.getFullYear(), now.getMonth(), 0, 23,59,59);

  const sum = (rows) => rows.reduce((s,r) => s + (Number(r.Amount)||0), 0);
  const inRange = (r, start, end) => { const d = parseDate_(r.Date); return d && d >= start && (!end || d <= end); };

  const mtd = expenses.filter(r => inRange(r, monthStart));
  const lastMonth = expenses.filter(r => inRange(r, lastMonthStart, lastMonthEnd));
  const ytd = expenses.filter(r => inRange(r, yearStart));
  const mileageYtd = ytd.filter(r => r.Category === 'Mileage');
  // Mileage entries never have a receipt to attach — they're a calculated
  // distance × rate, not a purchase — so they shouldn't count as "missing."
  const missingReceipts = ytd.filter(r => r.Category !== 'Mileage' && !r.ReceiptFileUrl).length;

  const mtdTotal = sum(mtd), lastMonthTotal = sum(lastMonth), ytdTotal = sum(ytd);
  const mtdDelta = lastMonthTotal > 0 ? Math.round(((mtdTotal - lastMonthTotal) / lastMonthTotal) * 100) : null;

  const byCategory = useMemo(() => {
    const map = {};
    ytd.forEach(r => { map[r.Category] = (map[r.Category]||0) + (Number(r.Amount)||0); });
    return Object.entries(map).sort((a,b) => b[1]-a[1]);
  }, [ytd]);
  const maxCategory = byCategory.length ? byCategory[0][1] : 0;

  const recent = expenses.slice().sort((a,b) => (parseDate_(b.Date)||0) - (parseDate_(a.Date)||0)).slice(0,10);

  // Both list cards below can scroll internally rather than growing the
  // whole dashboard. A plain overflow:hidden box abruptly chops the last
  // row in half right at the edge, which reads as broken/clipped content —
  // so when (and only when) a list is actually taller than its box, fade
  // its bottom edge to transparent instead of hard-cutting it. A list that
  // fits with no scrolling needed is left alone (no fade on the true end
  // of the data — that would look like something's missing).
  const categoryListRef = useRef(null);
  const recentListRef = useRef(null);
  const [categoryOverflowing, setCategoryOverflowing] = useState(false);
  const [recentOverflowing, setRecentOverflowing] = useState(false);
  useEffect(() => {
    const check = () => {
      setCategoryOverflowing(!!categoryListRef.current && categoryListRef.current.scrollHeight > categoryListRef.current.clientHeight + 1);
      setRecentOverflowing(!!recentListRef.current && recentListRef.current.scrollHeight > recentListRef.current.clientHeight + 1);
    };
    check();
    window.addEventListener('resize', check);
    return () => window.removeEventListener('resize', check);
  }, [byCategory, recent]);

  // Spend by month, Jan–Dec of the current year — same scope as the KPI
  // tiles and the category card above (year to date), just sliced a
  // different way.
  const monthLabels = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const monthTotals = useMemo(() => {
    const totals = new Array(12).fill(0);
    ytd.forEach(r => { const d = parseDate_(r.Date); if (d) totals[d.getMonth()] += Number(r.Amount)||0; });
    return totals;
  }, [ytd]);
  const maxMonth = Math.max.apply(null, monthTotals);
  const hasMonthData = maxMonth > 0;

  return h('div', null,
    h('div', { className:'kpi-grid', style:{ marginBottom:'20px' } },
      h('div', { className:'kpi-tile' },
        h('div', { className:'kpi-label' }, 'This month'),
        h('div', { className:'kpi-value' }, formatCurrencyCompact(mtdTotal)),
        mtdDelta !== null && h('div', { className:'kpi-delta ' + (mtdDelta > 0 ? 'up' : mtdDelta < 0 ? 'down' : 'flat') }, (mtdDelta>0?'↑ ':mtdDelta<0?'↓ ':'') + Math.abs(mtdDelta) + '% vs last month')
      ),
      h('div', { className:'kpi-tile' }, h('div', { className:'kpi-label' }, 'Year to date'), h('div', { className:'kpi-value' }, formatCurrency(ytdTotal))),
      h('div', { className:'kpi-tile' }, h('div', { className:'kpi-label' }, 'Mileage YTD'), h('div', { className:'kpi-value' }, mileageYtd.reduce((s,r)=>s+(Number(r.Miles)||0),0).toLocaleString(undefined,{maximumFractionDigits:0}) + ' mi')),
      h('div', {
        className:'kpi-tile kpi-tile-clickable',
        role:'button', tabIndex:0,
        onClick: onMissingReceiptsClick,
        onKeyDown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onMissingReceiptsClick(); } },
        title:'View these expenses'
      }, h('div', { className:'kpi-label' }, 'Missing receipts (YTD)'), h('div', { className:'kpi-value' }, missingReceipts))
    ),
    h('div', { style:{ display:'grid', gridTemplateColumns:'1.1fr .9fr', gap:'16px' }, className:'dash-grid' },
      h('div', { className:'card card-pad', style:{ display:'flex', flexDirection:'column' } },
        h('div', { className:'card-title' }, 'Spend by category · year to date'),
        h('div', { ref:categoryListRef, className:'dash-scroll-list' + (categoryOverflowing ? ' dash-scroll-fade' : ''), style:{ marginTop:'12px', maxHeight:'236px' } },
          byCategory.length === 0
            ? h('p', { className:'card-copy' }, 'No expenses logged yet this year.')
            : byCategory.map(([cat, amt]) => h('div', { className:'bar-row', key:cat },
                h('div', { className:'bar-row-label' }, cat),
                h('div', { className:'bar-track' }, h('div', { className:'bar-fill', style:{ width: (maxCategory ? (amt/maxCategory*100) : 0) + '%' } })),
                h('div', { className:'bar-row-value' }, formatCurrency(amt))
              ))
        )
      ),
      h('div', { className:'card card-pad', style:{ display:'flex', flexDirection:'column' } },
        h('div', { className:'card-title' }, 'Recent activity'),
        h('div', { ref:recentListRef, className:'dash-scroll-list' + (recentOverflowing ? ' dash-scroll-fade' : ''), style:{ marginTop:'10px', maxHeight:'236px', display:'grid', gap:'2px', alignContent:'start' } },
          recent.length === 0
            ? h('p', { className:'card-copy' }, 'Nothing logged yet.')
            : recent.map(r => h('div', { key:r.ExpenseId, style:{ display:'flex', justifyContent:'space-between', gap:'10px', padding:'9px 0', borderBottom:'1px solid #f0f2f5', cursor:'pointer' }, onClick:() => setView('expenses') },
                h('div', { style:{ minWidth:0 } },
                  h('div', { style:{ fontSize:'12.5px', fontWeight:600, color:'#39465a', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' } }, r.Vendor || r.Category),
                  h('div', { style:{ fontSize:'11px', color:'var(--faint)' } }, formatDate(r.Date) + ' · ' + r.Category)
                ),
                h('div', { style:{ fontSize:'12.5px', fontWeight:700, color:'var(--navy-deep)', flex:'0 0 auto' } }, formatCurrency(r.Amount))
              ))
        )
      )
    ),
    h('div', { className:'card card-pad', style:{ marginTop:'16px' } },
      h('div', { className:'card-title' }, 'Spend by month · ' + now.getFullYear()),
      hasMonthData
        ? h('div', { className:'month-chart', style:{ marginTop:'14px', height:'200px' } },
            monthLabels.map((label, i) => h('div', { className:'month-chart-col', key:label, title: label + ' ' + now.getFullYear() + ': ' + formatCurrency(monthTotals[i]) },
              h('div', { className:'month-chart-value' }, monthTotals[i] > 0 ? formatCurrencyCompact(monthTotals[i]) : ''),
              h('div', { className:'month-chart-track' },
                monthTotals[i] > 0 && h('div', { className:'month-chart-fill', style:{ height: (maxMonth ? (monthTotals[i]/maxMonth*100) : 0) + '%' } })
              ),
              h('div', { className:'month-chart-label' }, label)
            ))
          )
        : h('p', { className:'card-copy', style:{ marginTop:'8px' } }, 'No expenses logged yet this year.')
    ),
    h('style', null, '@media (max-width:900px){ .dash-grid { grid-template-columns:1fr !important; } }')
  );
}

// =====================================================================
// Tax summary — a printable, one-click year-end summary: category totals,
// the mileage deduction (summed from each entry's own stored rate, so a
// mid-year IRS rate change is already accounted for), and a missing-
// receipts list. "Print / Save as PDF" hides the rest of the app and
// prints only the .tax-summary-print block (see the @media print rule).
// =====================================================================
function TaxSummaryModal({ open, onClose, expenses, categories, year, years, onYearChange }) {
  useEffect(() => {
    function handleAfterPrint() { document.body.classList.remove('printing-tax-summary'); }
    window.addEventListener('afterprint', handleAfterPrint);
    return () => window.removeEventListener('afterprint', handleAfterPrint);
  }, []);

  const yearExpenses = useMemo(() => expenses.filter(r => { const d = parseDate_(r.Date); return d && d.getFullYear() === year; }), [expenses, year]);
  const nonMileage = useMemo(() => yearExpenses.filter(r => r.Category !== 'Mileage'), [yearExpenses]);
  const mileageRows = useMemo(() => yearExpenses.filter(r => r.Category === 'Mileage'), [yearExpenses]);
  const byCategory = useMemo(() => {
    const map = {};
    nonMileage.forEach(r => { map[r.Category] = (map[r.Category] || 0) + (Number(r.Amount) || 0); });
    return Object.entries(map).sort((a, b) => b[1] - a[1]);
  }, [nonMileage]);
  const nonMileageTotal = byCategory.reduce((s, [, amt]) => s + amt, 0);
  const totalMiles = mileageRows.reduce((s, r) => s + (Number(r.Miles) || 0), 0);
  const mileageTotal = mileageRows.reduce((s, r) => s + (Number(r.Amount) || 0), 0);
  const grandTotal = nonMileageTotal + mileageTotal;
  const missingReceipts = useMemo(
    () => nonMileage.filter(r => !r.ReceiptFileUrl).sort((a, b) => (parseDate_(a.Date) || 0) - (parseDate_(b.Date) || 0)),
    [nonMileage]
  );

  if (!open) return null;

  function handlePrint() {
    document.body.classList.add('printing-tax-summary');
    setTimeout(() => window.print(), 50);
  }

  const generatedLabel = new Date().toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' });

  return h('div', { className:'modal-overlay tax-summary-overlay', onClick: e => { if (e.target === e.currentTarget) onClose(); } },
    h('div', { className:'modal', style:{ width:'min(680px,100%)' } },
      h('div', { className:'modal-head no-print' },
        h('div', { className:'modal-title' }, 'Tax summary'),
        h('button', { type:'button', className:'modal-close', onClick:onClose }, 'Close')
      ),
      h('div', { className:'modal-body' },
        h('div', { className:'no-print', style:{ display:'flex', alignItems:'center', gap:'10px' } },
          h('label', { style:{ fontSize:'12px', fontWeight:650, color:'#475467' } }, 'Tax year'),
          h('select', { className:'input', style:{ width:'110px' }, value:year, onChange:e => onYearChange(Number(e.target.value)) },
            years.map(y => h('option', { key:y, value:y }, y))
          )
        ),
        h('div', { className:'tax-summary-print' },
          h('div', { style:{ marginBottom:'16px' } },
            h('div', { style:{ fontSize:'16px', fontWeight:800, color:'var(--navy-deep)' } }, 'Bayside Dysphagia Diagnostics'),
            h('div', { style:{ fontSize:'13px', color:'var(--muted)' } }, 'Tax summary — ' + year),
            h('div', { style:{ fontSize:'11px', color:'var(--faint)', marginTop:'2px' } }, 'Generated ' + generatedLabel)
          ),
          h('table', { className:'data-table', style:{ marginBottom:'14px' } },
            h('thead', null, h('tr', null, h('th', null, 'Category'), h('th', { className:'num' }, 'Amount'))),
            h('tbody', null,
              byCategory.length === 0
                ? h('tr', null, h('td', { colSpan:2, style:{ color:'var(--faint)' } }, 'No non-mileage expenses recorded for ' + year + '.'))
                : byCategory.map(([cat, amt]) => h('tr', { key:cat }, h('td', null, cat), h('td', { className:'num' }, formatCurrency(amt)))),
              h('tr', null,
                h('td', { style:{ fontWeight:700 } }, 'Mileage (' + totalMiles.toLocaleString(undefined,{maximumFractionDigits:1}) + ' mi)'),
                h('td', { className:'num', style:{ fontWeight:700 } }, formatCurrency(mileageTotal))
              ),
              h('tr', null,
                h('td', { style:{ fontWeight:800 } }, 'Total business expenses'),
                h('td', { className:'num', style:{ fontWeight:800 } }, formatCurrency(grandTotal))
              )
            )
          ),
          h('div', { style:{ marginBottom:'10px' } },
            h('div', { style:{ fontSize:'13px', fontWeight:700, color:'var(--navy-deep)' } }, 'Receipts on file'),
            h('div', { style:{ fontSize:'12px', color:'var(--muted)', marginTop:'2px' } },
              (nonMileage.length - missingReceipts.length) + ' of ' + nonMileage.length + ' non-mileage expenses have a receipt attached' +
              (missingReceipts.length ? ' — ' + missingReceipts.length + ' missing:' : '.')
            )
          ),
          missingReceipts.length > 0 && h('table', { className:'data-table', style:{ marginBottom:'10px' } },
            h('thead', null, h('tr', null, h('th', null, 'Date'), h('th', null, 'Vendor'), h('th', { className:'num' }, 'Amount'))),
            h('tbody', null, missingReceipts.map(r => h('tr', { key:r.ExpenseId },
              h('td', null, formatDate(r.Date)), h('td', null, r.Vendor || '—'), h('td', { className:'num' }, formatCurrency(r.Amount))
            )))
          ),
          h('p', { style:{ fontSize:'10.5px', color:'var(--faint)', marginTop:'16px' } },
            'Prepared by BDD EXP for recordkeeping and tax preparation purposes. Not tax advice — confirm categorization and deductibility with your accountant.'
          )
        )
      ),
      h('div', { className:'modal-foot no-print' },
        h('button', { type:'button', className:'btn btn-ghost', onClick:onClose }, 'Close'),
        h('button', { type:'button', className:'btn btn-teal', onClick:handlePrint }, 'Print / Save as PDF')
      )
    )
  );
}

function ReportsView({ expenses, categories }) {
  const [year, setYear] = useState(() => new Date().getFullYear());
  const [showTaxSummary, setShowTaxSummary] = useState(false);
  const years = useMemo(() => {
    const set = new Set(expenses.map(r => { const d = parseDate_(r.Date); return d ? d.getFullYear() : null; }).filter(Boolean));
    set.add(new Date().getFullYear());
    return Array.from(set).sort((a,b) => b-a);
  }, [expenses]);

  const monthLabels = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const matrix = useMemo(() => {
    const grid = {};
    categories.forEach(c => { grid[c] = new Array(12).fill(0); });
    expenses.forEach(r => {
      const d = parseDate_(r.Date);
      if (!d || d.getFullYear() !== year) return;
      if (!grid[r.Category]) grid[r.Category] = new Array(12).fill(0);
      grid[r.Category][d.getMonth()] += Number(r.Amount) || 0;
    });
    return grid;
  }, [expenses, categories, year]);

  const monthTotals = monthLabels.map((_, i) => Object.values(matrix).reduce((s,arr) => s + arr[i], 0));

        h('thead', null, h('tr', null, h('th', null, 'Category'), monthLabels.map(m => h('th', { key:m, className:'num' }, m)), h('th', { className:'num' }, 'Total'))),
        h('tbody', null,
          Object.entries(matrix).filter(([,arr]) => arr.some(v => v>0)).map(([cat, arr]) => h('tr', { key:cat },
            h('td', null, cat),
            arr.map((v,i) => h('td', { key:i, className:'num' }, v ? formatCurrency(v) : '—')),
            h('td', { className:'num', style:{ fontWeight:700 } }, formatCurrency(arr.reduce((s,v)=>s+v,0)))
          )),

            h('td', { style:{ fontWeight:700 } }, 'Total'),
            monthTotals.map((v,i) => h('td', { key:i, className:'num', style:{ fontWeight:700 } }, v ? formatCurrency(v) : '—')),

}

function poStatusPillClass(status) {
  if (status === 'Received') return 'pill-navy';
  if (status === 'Cancelled') return 'pill';
  return 'pill-teal';
}

  useEffect(() => sessionStorage.setItem(LS_PREFIX+'po_table_sort', JSON.stringify({ sortCol, sortDir })), [sortCol, sortDir]);

        h('select', { className:'input', style:{ width:'190px' }, value:categoryFilter, onChange:e => setCategoryFilter(e.target.value) },
          h('option', { value:'All' }, 'All categories'),
          categories.map(c => h('option', { key:c, value:c }, c))
        ),
        h('select', { className:'input', style:{ width:'150px' }, value:statusFilter, onChange:e => setStatusFilter(e.target.value) },
          h('option', { value:'All' }, 'All statuses'),

function SubscriptionEditForm({ initial, categories, paymentMethods, onCancel, onSaved, apiUpdate }) {
  const [form, setForm] = useState(() => {
    const { month, year } = monthYearFromEndDate_(initial.EndDate);
    return {
      Vendor: initial.Vendor || '',
      Category: initial.Category || categories[0] || 'Other',
      Amount: initial.Amount || '',
      PaymentMethod: initial.PaymentMethod || paymentMethods[0] || '',
      Notes: initial.Notes || '',
      Cadence: cadenceFromIntervalClient_(initial.IntervalUnit, initial.IntervalCount),
      EndMonth: month, EndYear: year
    };
  });
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState('');
  function set(field, value) { setForm(f => ({ ...f, [field]: value })); }
  const endDate = endDateFromMonthYear_(form.EndMonth, form.EndYear);

  async function handleSubmit(e) {
    e.preventDefault();
    setErr('');
    if (!form.Amount || Number(form.Amount) <= 0) return setErr('Enter an amount greater than zero.');
    if (endDate && endDate <= todayStr()) return setErr('The end date should be in the future — to stop it immediately, pause the subscription instead.');
    setSaving(true);
    try {
      const { unit, count } = intervalFromCadenceClient_(form.Cadence);
      const payload = {
        TemplateId: initial.TemplateId,
        Vendor: form.Vendor, Category: form.Category, Amount: Number(form.Amount),
        PaymentMethod: form.PaymentMethod, Notes: form.Notes,
        IntervalUnit: unit, IntervalCount: count,
        EndDate: endDate
      };
      await apiUpdate(payload);
      onSaved();
    } catch (err2) {
      setErr(err2.message || 'Something went wrong saving this subscription.');
    }
    setSaving(false);
  }

  return h(ModalShell, {
    title: 'Edit subscription', onCancel, onSubmit: handleSubmit, saving, submitLabel: 'Save changes'
  },
    err && h('div', { className:'field-error' }, err),
    h('div', { className:'field-hint', style:{ marginTop:'-6px' } }, 'Changes apply to future occurrences only — expenses already added are never rewritten.'),
    h('div', { className:'modal-row-2' },
      h('div', { className:'field' },
        h('label', null, 'Vendor'),
        h('input', { type:'text', className:'input', value:form.Vendor, onChange:e => set('Vendor', e.target.value) })
      ),
      h('div', { className:'field' },
        h('label', null, 'Category'),
        h('select', { className:'input', value:form.Category, onChange:e => set('Category', e.target.value) },
          categories.map(c => h('option', { key:c, value:c }, c))
        )
      )
    ),
    h('div', { className:'modal-row-2' },
      h('div', { className:'field' },
        h('label', null, 'Amount'),
        h('div', { className:'amount-input-wrap' },
          h('span', { className:'amount-prefix' }, '$'),
          h('input', { type:'number', min:'0', step:'0.01', className:'input', value:form.Amount, onChange:e => set('Amount', e.target.value) })
        )
      ),
      h('div', { className:'field' },
        h('label', null, 'Payment method'),
        h('select', { className:'input', value:form.PaymentMethod, onChange:e => set('PaymentMethod', e.target.value) },
          paymentMethods.map(p => h('option', { key:p, value:p }, p))
        )
      )
    ),
    h('div', { className:'field' },
      h('label', null, 'Notes'),
      h('input', { type:'text', className:'input', value:form.Notes, onChange:e => set('Notes', e.target.value) })
    ),
    h('div', { className:'modal-row-2' },
      h('div', { className:'field' },
        h('label', null, 'Repeats every'),
        h('select', { className:'input', value:form.Cadence, onChange:e => set('Cadence', e.target.value) },
          RECURRING_CADENCES.map(c => h('option', { key:c.value, value:c.value }, c.label))
        )
      ),
      h('div', { className:'field' },
        h('label', null, 'Ends on (optional)'),
        h('div', { style:{ display:'flex', gap:'8px' } },
          h('select', { className:'input', value:form.EndMonth, onChange:e => set('EndMonth', e.target.value) },
            END_DATE_MONTH_OPTIONS.map(m => h('option', { key:m.value, value:m.value }, m.label))
          ),
          form.EndMonth && h('select', { className:'input', style:{ width:'90px', flex:'0 0 auto' }, value:form.EndYear, onChange:e => set('EndYear', e.target.value) },
            endDateYearOptions_().map(y => h('option', { key:y, value:y }, y))
          )
        )
      )
    )
  );
}

function SubscriptionsView({ subscriptions, categories, paymentMethods, onPauseResume, onEdit, onDelete }) {

      return (parseDate_(a.NextDueDate)||0) - (parseDate_(b.NextDueDate)||0);

              )),

                  h('td', null, active ? formatDate(r.NextDueDate) : '—'),
                  h('td', null, h('span', { className:'pill ' + (active ? 'pill-teal' : '') }, active ? 'Active' : 'Paused')),
                  h('td', null,
                    h('div', { style:{ display:'flex', alignItems:'center', justifyContent:'flex-end', gap:'8px', whiteSpace:'nowrap' } },
                      h('button', {
                        type:'button', className:'btn btn-ghost btn-sm', title:active ? 'Pause' : 'Resume',
                        onClick:() => onPauseResume(r, !active)
                      }, h(Icon,{ name: active ? 'pause' : 'play' }), active ? 'Pause' : 'Resume'),
                      h('button', { type:'button', className:'btn btn-ghost btn-sm', title:'Edit', onClick:() => onEdit(r) }, h(Icon,{name:'edit'})),
                      h('button', { type:'button', className:'btn btn-danger-ghost btn-sm', title:'Delete', onClick:() => onDelete(r) }, h(Icon,{name:'trash'}))
                    )
                  )
                );
              }))
            ),
            h('div', { className:'table-summary' },
              h('span', null, 'Recurring subscriptions'),
              h('span', null, h('strong', null, rows.length + (rows.length === 1 ? ' subscription' : ' subscriptions')))

          )
    )
  );
}

// =====================================================================
// App shell
// =====================================================================
function emptyData_() { return { expenses:[], settings:{ mileageRate:0.76 }, categories:[], paymentMethods:[], purchaseOrders:[], poCategories:[], poStatuses:[], facilities:[], recurringSubscriptions:[] }; }

function App() {
  const [unlocked, setUnlocked] = useState(() => sessionStorage.getItem(LS_PREFIX+'unlocked') === 'true' && !!sessionStorage.getItem(LS_PREFIX+'session_token'));
  const [startupCache] = useState(() => readCache_());
  // Merge onto emptyData_()'s defaults (rather than using the cache as-is) so
  // a cache written by an older version of this app — from before some field
  // existed (recurringSubscriptions, say) — still gets a safe default for
  // it, instead of `undefined` reaching a component that assumes an array.
  const [data, setData] = useState(() => startupCache ? Object.assign({}, emptyData_(), startupCache) : emptyData_());
  const [loading, setLoading] = useState(() => !startupCache);
  const [loadError, setLoadError] = useState(null);
  // Browser back/forward support: same pushState/popstate pattern as BDD
  // CRM's setView — switching pages pushes a history entry so the phone/
  // browser back button (and the header's back button below) step back
  // through the pages you've visited, instead of leaving the app.
  const [view, setViewState] = useState('dashboard');
  // Set by the Dashboard's "Missing receipts (YTD)" tile so Expenses opens
  // pre-filtered to exactly those rows instead of just landing on the page
  // and leaving you to go find them yourself.
  const [expensesQuickFilter, setExpensesQuickFilter] = useState(null);
  const historyDepthRef = useRef(0);
  const [canGoBack, setCanGoBack] = useState(false);
  const setView = useCallback(next => {
    const value = typeof next === 'function' ? next(view) : next;
    if (value === view) return;
    const depth = historyDepthRef.current + 1;
    window.history.pushState({ bddExp:true, view:value, depth }, '', window.location.href);
    historyDepthRef.current = depth;
    setCanGoBack(true);
    setViewState(value);
  }, [view]);
  const goBack = useCallback(() => {
    if (historyDepthRef.current > 0) window.history.back();
  }, []);
  useEffect(() => {
    window.history.replaceState({ bddExp:true, view, depth:0 }, '', window.location.href);
    const handlePop = event => {
      const state = event.state;
      if (!state || !state.bddExp) return;
      historyDepthRef.current = Math.max(0, Number(state.depth) || 0);
      setCanGoBack(historyDepthRef.current > 0);
      setViewState(state.view || 'dashboard');
    };
    window.addEventListener('popstate', handlePop);
    return () => window.removeEventListener('popstate', handlePop);
  }, []);
  // Sticky-header search — same pattern as the CRM's global search: type
  // to filter, click a result to jump straight into that expense/mileage/PO
  // record's edit modal, click outside (or Escape) to dismiss.
  const [globalSearch, setGlobalSearch] = useState('');
  const globalSearchRef = useRef(null);
  useEffect(() => {
    const clearSearchOutside = event => {
      if (globalSearchRef.current && !globalSearchRef.current.contains(event.target)) setGlobalSearch('');
    };
    document.addEventListener('pointerdown', clearSearchOutside);
    return () => document.removeEventListener('pointerdown', clearSearchOutside);
  }, []);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [modal, setModal] = useState(null); // null | { type:'expense'|'mileage'|'po', mode:'create'|'edit', expense?, po? }
  const [toast, setToast] = useState(null);
  const [sidebarTheme, setSidebarTheme] = useState(() => localStorage.getItem(LS_PREFIX+'sidebar_theme') === 'dark' ? 'dark' : 'light');
  const [showCalendar, setShowCalendar] = useState(() => localStorage.getItem(LS_PREFIX+'show_calendar') !== 'false');
  const [showTools, setShowTools] = useState(() => localStorage.getItem(LS_PREFIX+'show_tools') !== 'false');
  const [showPreferences, setShowPreferences] = useState(false);
  const [preferencesRefreshing, setPreferencesRefreshing] = useState(false);
  const [lastSyncedAt, setLastSyncedAt] = useState(() => localStorage.getItem(LS_PREFIX+'last_synced_at') || '');

  const user = {
    email: sessionStorage.getItem(LS_PREFIX+'user_email') || '',
    name: sessionStorage.getItem(LS_PREFIX+'user_name') || ''
  };

  // Lightweight autocomplete sources — built client-side from history already
  // in memory, no extra backend calls.
  const vendorOptions = useMemo(() => recentUniqueValues_(
    data.expenses.filter(e => e.Category !== 'Mileage').concat(data.purchaseOrders), 'Vendor', 40
  ), [data.expenses, data.purchaseOrders]);
  const mileagePurposeOptions = useMemo(() => recentUniqueValues_(
    data.expenses.filter(e => e.Category === 'Mileage'), 'Vendor', 20
  ), [data.expenses]);
  const mileageLocationOptions = useMemo(() => {
    const mileageRows = data.expenses.filter(e => e.Category === 'Mileage');
    const ends = recentUniqueValues_(mileageRows, 'EndLocation', 20);
    const starts = recentUniqueValues_(mileageRows, 'StartLocation', 20);
    const seen = new Set(); const out = [];
    ends.concat(starts).forEach(v => { if (!seen.has(v)) { seen.add(v); out.push(v); } });
    return out;
  }, [data.expenses]);

  function showToast(message, type) {
    setToast({ message, type });
    setTimeout(() => setToast(null), 2800);
  }

  useEffect(() => {
    document.documentElement.dataset.expTheme = sidebarTheme;
    const themeMeta = document.querySelector('meta[name="theme-color"]');
    if (themeMeta) themeMeta.content = sidebarTheme === 'dark' ? '#081e3d' : '#ffffff';
  }, [sidebarTheme]);

  function applySidebarTheme(next) {
    const safeTheme = next === 'dark' ? 'dark' : 'light';
    localStorage.setItem(LS_PREFIX+'sidebar_theme', safeTheme);
    setSidebarTheme(safeTheme);
  }
  function toggleSidebarTheme() { applySidebarTheme(sidebarTheme === 'dark' ? 'light' : 'dark'); }
  function updateShowCalendar(next) {
    const enabled = !!next;
    localStorage.setItem(LS_PREFIX+'show_calendar', enabled ? 'true' : 'false');
    setShowCalendar(enabled);
  }
  function updateShowTools(next) {
    const enabled = !!next;
    localStorage.setItem(LS_PREFIX+'show_tools', enabled ? 'true' : 'false');
    setShowTools(enabled);
  }

  const refresh = useCallback(async () => {
    setLoadError(null);
    try {
      const result = await apiGet();
      const categories = (result.categories && result.categories.length) ? result.categories : ['Mileage','Equipment & Supplies','Software & Subscriptions','Insurance','Marketing','Professional Services','Travel & Lodging','Office Supplies','Other'];
      const next = {
        expenses: result.expenses || [],
        settings: result.settings || { mileageRate:0.76 },
        categories,
        paymentMethods: (result.paymentMethods && result.paymentMethods.length) ? result.paymentMethods : ['Business Debit Card','Business Credit Card','Personal (to be reimbursed)','Check','Cash','Other'],
        purchaseOrders: result.purchaseOrders || [],
        poCategories: (result.poCategories && result.poCategories.length) ? result.poCategories : categories.filter(c => c !== 'Mileage'),
        poStatuses: (result.poStatuses && result.poStatuses.length) ? result.poStatuses : ['Open','Received','Cancelled'],
        // Distinct facility names read live from the CRM's own Accounts
        // sheet (see Code.gs's getCrmFacilities_) — an empty list here just
        // means the Facility name field on Add Mileage falls back to plain
        // free text with no suggestions.
        facilities: result.facilities || [],
        recurringSubscriptions: result.recurringSubscriptions || []
      };
      setData(next);
      writeCache_(next);
      const syncedAt = new Date().toISOString();
      setLastSyncedAt(syncedAt);
      localStorage.setItem(LS_PREFIX+'last_synced_at', syncedAt);
    } catch (err) {
      setLoadError(err.message || 'Failed to load your expenses.');
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { if (unlocked) refresh(); }, [unlocked, refresh]);

  // PWA "shortcuts": long-pressing the installed app's icon offers "Add
  // Mileage" / "Add expense" shortcuts (see manifest.json) that land here
  // with a `?action=` URL param. Once signed in and loaded, jump straight
  // into the matching modal, then scrub the param so refreshing the page
  // doesn't reopen it.
  useEffect(() => {
    if (!unlocked || loading) return;
    const params = new URLSearchParams(window.location.search);
    const action = params.get('action');
    if (!action) return;
    if (action === 'addExpense') openAddExpense();
    else if (action === 'addMileage') openAddMileage();
    const url = new URL(window.location.href);
    url.searchParams.delete('action');
    window.history.replaceState({ bddExp:true, view, depth:historyDepthRef.current }, '', url.pathname + url.search + url.hash);
  }, [unlocked, loading]);

  async function runPreferencesRefresh() {
    setPreferencesRefreshing(true);
    try { await refresh(); }
    finally { setPreferencesRefreshing(false); }
  }

  function handleUnlock() { setUnlocked(true); }
  function handleSignOut() {
    apiPost('logout', {}).catch(() => {});
    sessionStorage.clear();
    window.location.reload();
  }

  const apiCreate = useCallback(async (payload) => {
    const res = await apiPost('createExpense', { data: payload });
    if (!res.success) throw new Error(res.error || 'Could not save expense.');
    setData(d => { const next = { ...d, expenses: [...d.expenses, res.result] }; writeCache_(next); return next; });
    return res.result;
  }, []);
  const apiUpdate = useCallback(async (payload) => {
    const res = await apiPost('updateExpense', { data: payload });
    if (!res.success) throw new Error(res.error || 'Could not save changes.');
    setData(d => { const next = { ...d, expenses: d.expenses.map(e => e.ExpenseId === payload.ExpenseId ? { ...e, ...payload } : e) }; writeCache_(next); return next; });
    return res.result;
  }, []);
  const apiUploadReceipt = useCallback(async (expenseId, filename, mimeType, base64Data) => {
    const res = await apiPost('uploadReceipt', { expenseId, filename, mimeType, base64Data });
    if (!res.success) throw new Error(res.error || 'Could not upload the receipt.');
    return res.result;
  }, []);
  const apiDelete = useCallback(async (expenseId) => {
    const res = await apiPost('deleteExpense', { expenseId });
    if (!res.success) throw new Error(res.error || 'Could not delete this expense.');
    setData(d => { const next = { ...d, expenses: d.expenses.filter(e => e.ExpenseId !== expenseId) }; writeCache_(next); return next; });
  }, []);
  const apiSaveSettings = useCallback(async (payload) => {
    const res = await apiPost('updateSettings', { data: payload });
    if (res.success) setData(d => { const next = { ...d, settings: res.result }; writeCache_(next); return next; });
  }, []);

  const apiGeneratePo = useCallback(async (category, date) => {
    const res = await apiPost('generatePoNumber', { category, date });
    if (!res.success) throw new Error(res.error || 'Could not generate a PO number.');
    return res.result.poNumber;
  }, []);
  const apiCreatePO = useCallback(async (payload) => {
    const res = await apiPost('createPurchaseOrder', { data: payload });
    if (!res.success) throw new Error(res.error || 'Could not save the purchase order.');
    setData(d => { const next = { ...d, purchaseOrders: [...d.purchaseOrders, res.result] }; writeCache_(next); return next; });
    return res.result;
  }, []);
  const apiUpdatePO = useCallback(async (payload) => {
    const res = await apiPost('updatePurchaseOrder', { data: payload });
    if (!res.success) throw new Error(res.error || 'Could not save changes.');
    setData(d => { const next = { ...d, purchaseOrders: d.purchaseOrders.map(p => p.PoId === payload.PoId ? { ...p, ...payload } : p) }; writeCache_(next); return next; });
    return res.result;
  }, []);
  const apiDeletePO = useCallback(async (poId) => {
    const res = await apiPost('deletePurchaseOrder', { poId });
    if (!res.success) throw new Error(res.error || 'Could not delete this purchase order.');
    setData(d => { const next = { ...d, purchaseOrders: d.purchaseOrders.filter(p => p.PoId !== poId) }; writeCache_(next); return next; });
  }, []);

  const apiCreateRecurringSub = useCallback(async (payload) => {
    const res = await apiPost('createRecurringSubscription', { data: payload });
    if (!res.success) throw new Error(res.error || 'Could not set up this recurring subscription.');
    setData(d => { const next = { ...d, recurringSubscriptions: [...d.recurringSubscriptions, res.result] }; writeCache_(next); return next; });
    return res.result;
  }, []);
  const apiUpdateRecurringSub = useCallback(async (payload) => {
    const res = await apiPost('updateRecurringSubscription', { data: payload });
    if (!res.success) throw new Error(res.error || 'Could not save changes to this subscription.');
    setData(d => { const next = { ...d, recurringSubscriptions: d.recurringSubscriptions.map(s => s.TemplateId === payload.TemplateId ? { ...s, ...payload } : s) }; writeCache_(next); return next; });
    return res.result;
  }, []);
  const apiDeleteRecurringSub = useCallback(async (templateId) => {
    const res = await apiPost('deleteRecurringSubscription', { templateId });
    if (!res.success) throw new Error(res.error || 'Could not delete this subscription.');
    setData(d => { const next = { ...d, recurringSubscriptions: d.recurringSubscriptions.filter(s => s.TemplateId !== templateId) }; writeCache_(next); return next; });
  }, []);

  function openAddExpense() {
    // No presetCategory here — ExpenseForm falls back to whatever category
    // was used last time, so it doesn't override that remembered default.
    setModal({ type:'expense', mode:'create' });
  }
  function openAddMileage() { setModal({ type:'mileage', mode:'create' }); }
  function openAddPO() { setModal({ type:'po', mode:'create' }); }
  function openRecordExpense(po) { setModal({ type:'expense', mode:'create', presetCategory: po.Category, po }); }
  function openEdit(expense) {
    setModal(expense.Category === 'Mileage' ? { type:'mileage', mode:'edit', expense } : { type:'expense', mode:'edit', expense });
  }
  function openEditPO(po) { setModal({ type:'po', mode:'edit', po }); }
  // "Duplicate" pre-fills a brand-new record from an existing one (minus its
  // id, receipt, PO number and status) so a recurring expense/PO doesn't have
  // to be typed from scratch every time — the date resets to today.
  function openDuplicate(expense) {
    const base = {
      Date: todayStr(), Category: expense.Category, Vendor: expense.Vendor,
      Description: expense.Description, Amount: expense.Amount,
      PaymentMethod: expense.PaymentMethod, Notes: expense.Notes,
      Miles: expense.Miles, MileageRate: expense.MileageRate,
      StartLocation: expense.StartLocation, EndLocation: expense.EndLocation,
      FacilityName: expense.FacilityName
    };
    if (expense.Category === 'Mileage') {
      setModal({ type:'mileage', mode:'create', duplicateFrom: base });
    } else {
      setModal({ type:'expense', mode:'create', presetCategory: expense.Category, duplicateFrom: base });
    }
  }
  function openDuplicatePO(po) {
    setModal({ type:'po', mode:'create', duplicateFrom: {
      Date: todayStr(), Category: po.Category, Vendor: po.Vendor, Description: po.Description, Amount: po.Amount, Notes: po.Notes
    } });
  }
  // Sticky-header search results, ranked the same way as the CRM's global
  // search: exact/prefix/word-prefix matches on the name first, then
  // substring matches on the name, then a match found only in the record's
  // other fields (notes, category, locations, PO number, etc).
  const globalSearchResults = useMemo(() => {
    const q = globalSearch.trim().toLowerCase();
    if (!q) return [];
    function scoreFor(name, meta) {
      const n = String(name || '').toLowerCase();
      if (n === q) return 0;
      if (n.startsWith(q)) return 1;
      if (n.split(/\s+/).some(w => w.startsWith(q))) return 2;
      if (n.includes(q)) return 3;
      if (meta.includes(q)) return 4;
      return null;
    }
    const scored = [];
    data.expenses.forEach(e => {
      const isMileage = e.Category === 'Mileage';
      const name = e.Vendor || (isMileage ? 'Mileage' : e.Category) || '';
      const meta = [e.Description, e.Notes, e.Category, e.PaymentMethod, e.StartLocation, e.EndLocation, e.FacilityName].filter(Boolean).join(' ').toLowerCase();
      const score = scoreFor(name, meta);
      if (score === null) return;
      const fromTo = isMileage ? [extractTown_(e.StartLocation), extractTown_(e.EndLocation)].filter(Boolean).join(' → ') : '';
      scored.push({ score, item: {
        key: 'exp_' + e.ExpenseId, kind: isMileage ? 'mileage' : 'expense',
        title: name || (isMileage ? 'Mileage entry' : 'Expense'),
        subtitle: [formatDate(e.Date), isMileage ? (fromTo || 'Mileage') : e.Category, formatCurrency(e.Amount)].filter(Boolean).join(' · '),
        record: e
      }});
    });
    data.purchaseOrders.forEach(po => {
      const name = po.Vendor || po.PoNumber || '';
      const meta = [po.PoNumber, po.Description, po.Notes, po.Category, po.Status].filter(Boolean).join(' ').toLowerCase();
      const score = scoreFor(name, meta);
      if (score === null) return;
      scored.push({ score, item: {
        key: 'po_' + po.PoId, kind: 'po',
        title: name || 'Purchase order',
        subtitle: [po.PoNumber, po.Status, formatCurrency(po.Amount)].filter(Boolean).join(' · '),
        record: po
      }});
    });
    scored.sort((a, b) => a.score - b.score || String(a.item.title).localeCompare(String(b.item.title)));
    return scored.map(s => s.item).slice(0, 20);
  }, [globalSearch, data.expenses, data.purchaseOrders]);
  function selectSearchResult(result) {
    setGlobalSearch('');
    if (result.kind === 'po') { setView('purchaseorders'); openEditPO(result.record); }
    else if (result.kind === 'mileage') { setView('mileage'); openEdit(result.record); }
    else { setView('expenses'); openEdit(result.record); }
  }
  async function handleDelete(expense) {
    if (!window.confirm('Delete this expense? This cannot be undone.')) return;
    try { await apiDelete(expense.ExpenseId); showToast('Expense deleted.'); }
    catch (err) { showToast(err.message, 'error'); }
  }
  async function handleDeletePO(po) {
    if (!window.confirm('Delete this purchase order? This cannot be undone.')) return;
    try { await apiDeletePO(po.PoId); showToast('Purchase order deleted.'); }
    catch (err) { showToast(err.message, 'error'); }
  }
  function openEditSub(subscription) { setModal({ type:'subscriptionEdit', subscription }); }
  async function handlePauseResumeSub(subscription, nextActive) {
    try {
      await apiUpdateRecurringSub({ TemplateId: subscription.TemplateId, Active: nextActive });
      showToast(nextActive ? 'Subscription resumed.' : 'Subscription paused.');
    } catch (err) { showToast(err.message, 'error'); }
  }
  async function handleDeleteSub(subscription) {
    if (!window.confirm('Delete this recurring subscription? Expenses already added stay in your records — this only stops future ones from being generated.')) return;
    try { await apiDeleteRecurringSub(subscription.TemplateId); showToast('Subscription deleted.'); }
    catch (err) { showToast(err.message, 'error'); }
  }
  async function handleSaved(savedRecord) {
    const type = modal && modal.type;
    const isEdit = modal && modal.mode === 'edit';
    const linkedPO = modal && modal.po;
    setModal(null);
    if (type === 'po') { showToast(isEdit ? 'Purchase order updated.' : 'Purchase order created.'); return; }
    if (type === 'mileage') { showToast(isEdit ? 'Mileage updated.' : 'Mileage added.'); return; }
    if (linkedPO && savedRecord && savedRecord.ExpenseId) {
      try { await apiUpdatePO({ PoId: linkedPO.PoId, RecordedExpenseId: savedRecord.ExpenseId }); }
      catch (err) { /* the expense itself still saved fine; the PO just won't show "Recorded" */ }
      showToast('Expense recorded from ' + linkedPO.PoNumber + '.');
      return;
    }
    if (!isEdit && savedRecord && savedRecord.RecurringTemplateId) {
      showToast('Expense added — set up as a recurring subscription.');
      return;
    }
    showToast(isEdit ? 'Expense updated.' : 'Expense added.');
  }

  if (!unlocked) return h(Gate, { onUnlock: handleUnlock });

  if (loading) {
    return h('div', { className:'full-loading' }, h('div', { className:'spinner' }), h('p', null, 'Loading BDD EXP…'));
  }

  const pageTitles = { dashboard:'Dashboard', expenses:'Expenses', mileage:'Mileage', reports:'Reports', purchaseorders:'Purchase Orders', subscriptions:'Subscriptions' };

  return h('div', { className:'app-shell' },
    h(Sidebar, {
      view, setView, user, onSignOut:handleSignOut, open:sidebarOpen, onClose:() => setSidebarOpen(false),
      sidebarTheme, onToggleTheme:toggleSidebarTheme, showCalendar, showTools, expenses:data.expenses,
      onOpenPreferences:() => setShowPreferences(true)
    }),
    h('div', { className:'main' },
      h('div', { className:'topbar' },
        h('div', { style:{ display:'flex', alignItems:'center', gap:'12px' } },
          h('button', { type:'button', className:'hamburger', onClick:() => setSidebarOpen(true) }, h(Icon, { name:'menu' })),
          canGoBack && h('button', { type:'button', className:'history-back', onClick:goBack, title:'Go back', 'aria-label':'Go back to previous page' }, '‹'),
          h('div', null,
            h('div', { className:'topbar-title' }, pageTitles[view] || ''),
            loadError && h('div', { className:'topbar-sub', style:{ color:'var(--danger)' } }, loadError)
          )
        ),
        h('div', { className:'topbar-actions' },
          h('div', { className:'global-search', ref:globalSearchRef },
            h('input', {
              value:globalSearch, onChange:e => setGlobalSearch(e.target.value),
              placeholder:'Search expenses, mileage, POs…', 'aria-label':'Search BDD EXP'
            }),
            globalSearch
              ? h('button', { type:'button', className:'global-search-clear', onClick:() => setGlobalSearch(''), 'aria-label':'Clear search', title:'Clear search' }, '×')
              : h('span', { className:'global-search-icon' }, '⌕'),
            globalSearch.trim() && h('div', { className:'search-results' },
              globalSearchResults.length
                ? globalSearchResults.map(r => h('button', { key:r.key, type:'button', className:'search-result', onClick:() => selectSearchResult(r) },
                    h('strong', null, r.title),
                    h('span', null, r.subtitle)
                  ))
                : h('div', { className:'search-empty' }, 'No matches')
            )
          ),
          h('button', { type:'button', className:'btn btn-teal btn-sm', onClick:openAddMileage }, h(Icon,{name:'plus'}), 'Add Mileage'),
          h('button', { type:'button', className:'btn btn-primary btn-sm', onClick:openAddExpense }, h(Icon,{name:'plus'}), 'Add expense')
        )
      ),
      h('div', { className:'page' },
        view === 'dashboard' && h(DashboardView, { expenses:data.expenses, setView, onMissingReceiptsClick: () => { setExpensesQuickFilter('missingReceiptsYtd'); setView('expenses'); } }),
        view === 'expenses' && h(ExpensesView, { expenses:data.expenses, categories:data.categories, onEdit:openEdit, onDuplicate:openDuplicate, onDelete:handleDelete, quickFilter:expensesQuickFilter, onClearQuickFilter: () => setExpensesQuickFilter(null) }),
        view === 'mileage' && h(MileageView, { expenses:data.expenses, onEdit:openEdit, onDelete:handleDelete, onDuplicate:openDuplicate }),
        view === 'reports' && h(ReportsView, { expenses:data.expenses, categories:data.categories }),
        view === 'purchaseorders' && h(PurchaseOrdersView, { purchaseOrders:data.purchaseOrders, categories:data.poCategories, statuses:data.poStatuses, onAdd:openAddPO, onEdit:openEditPO, onDuplicate:openDuplicatePO, onDelete:handleDeletePO, onRecordExpense:openRecordExpense }),
        view === 'subscriptions' && h(SubscriptionsView, { subscriptions:data.recurringSubscriptions, categories:data.categories.filter(c => c !== 'Mileage'), paymentMethods:data.paymentMethods, onPauseResume:handlePauseResumeSub, onEdit:openEditSub, onDelete:handleDeleteSub })
      )
    ),
    modal && modal.type === 'mileage' && h(MileageForm, {
      initial: modal.mode === 'edit' ? modal.expense : (modal.duplicateFrom || null),
      defaultMileageRate: data.settings.mileageRate,
      purposeOptions: mileagePurposeOptions,
      endLocationOptions: mileageLocationOptions,
      facilityOptions: data.facilities,
      onCancel: () => setModal(null),
      onSaved: handleSaved,
      apiCreate, apiUpdate
    }),
    modal && modal.type === 'expense' && h(ExpenseForm, {
      initial: modal.mode === 'edit' ? modal.expense : (modal.po ? {
        Date: modal.po.Date, Category: modal.po.Category, Vendor: modal.po.Vendor,
        Description: modal.po.Description, Amount: modal.po.Amount,
        Notes: modal.po.PoNumber + (modal.po.Notes ? ' — ' + modal.po.Notes : '')
      } : (modal.duplicateFrom || null)),
      presetCategory: modal.presetCategory,
      categories: data.categories.filter(c => c !== 'Mileage'),
      paymentMethods: data.paymentMethods,
      vendorOptions,
      onCancel: () => setModal(null),
      onSaved: handleSaved,
      apiCreate, apiUpdate, apiUploadReceipt, apiCreateRecurringSub,
      recurringSubscriptions: data.recurringSubscriptions
    }),
    modal && modal.type === 'po' && h(PurchaseOrderForm, {
      initial: modal.mode === 'edit' ? modal.po : (modal.duplicateFrom || null),
      categories: data.poCategories,
      statuses: data.poStatuses,
      vendorOptions,
      onCancel: () => setModal(null),
      onSaved: handleSaved,
      apiCreate: apiCreatePO, apiUpdate: apiUpdatePO, apiGeneratePo
    }),
    modal && modal.type === 'subscriptionEdit' && h(SubscriptionEditForm, {
      initial: modal.subscription,
      categories: data.categories.filter(c => c !== 'Mileage'),
      paymentMethods: data.paymentMethods,
      onCancel: () => setModal(null),
      onSaved: () => { setModal(null); showToast('Subscription updated.'); },
      apiUpdate: apiUpdateRecurringSub
    }),
    h(PreferencesModal, {
      open: showPreferences,
      onClose: () => setShowPreferences(false),
      sidebarTheme, onChangeTheme: applySidebarTheme,
      showCalendar, onChangeShowCalendar: updateShowCalendar,
      showTools, onChangeShowTools: updateShowTools,
      settings: data.settings, onSaveSettings: apiSaveSettings,
      lastSyncedAt, refreshing: preferencesRefreshing, onRefresh: runPreferencesRefresh,
      onSignOut: handleSignOut
    }),
    h(Toast, { toast })
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App, null));

// Register the (deliberately minimal) service worker so the app is
// installable on a phone's home screen. Safe to no-op wherever service
// workers aren't available (e.g. plain http:// during local testing).
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
